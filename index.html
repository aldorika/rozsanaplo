@media (max-width: 700px){
  html,body{ height:100%; }
  .kulso{ height:100dvh; padding:0; }
  .lap{ border-radius:0; box-shadow:none; }

  /* a lista és az írás egymás helyett látszik, nem egymás mellett */
  .oldalsav{ width:100%; padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 10px); border-right:none; transition:none; }
  .lap:not(.osszecsukott) .iras{ display:none; }
  .lap.osszecsukott .oldalsav{ display:none; }

  .eszkozsor{ padding:2px 16px 10px; }
  .kereso-mezo{ font-size:16px !important; }
  .lista{ padding:0 12px 4px; }
  .tetel{ padding:11px 12px 12px; }
  .tetel-cim{ font-size:15.5px; }
  .tetel-also{ font-size:12.5px; }
  .mappa-fej{ padding:10px 10px 10px 6px; }
  .mappa-fej .nev{ font-size:11.5px; }

  .iras{ padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 8px); }
  .iras-eszkozsor{ padding:0 14px; height:40px; }
  .eszkoz{ width:36px; height:36px; border-radius:10px; }
  .eszkoz svg{ width:20px; height:20px; }
  /* telefonon ez a gomb visz vissza a listára */
  #oldalsavGomb{ width:auto; padding:0 14px 0 10px; }
  #oldalsavGomb svg{ display:none; }
  #oldalsavGomb::before{ content:"‹  Lista"; font-size:15px; font-weight:600; white-space:pre; }

  .cimsor{ flex-wrap:wrap; gap:8px; padding:4px 16px 0; }
  #leckeCim{ max-width:100%; min-width:0; font-size:21px; }
  .fulek, .szerkeszto-sor, .csoport-inditok{ padding-left:16px; padding-right:16px; }
  .csoport-cim{ padding-left:16px !important; padding-right:16px !important; }
  .fulek{ overflow-x:auto; }
  .ful{ font-size:14px; padding:7px 14px; }

  #tartalom, .kerdesek{ padding:2px 16px 28px; font-size:16px; }
  #tartalom h3{ font-size:23px; }
  #tartalom table{ display:block; overflow-x:auto; }
  #tartalom img{ max-width:100%; height:auto; }
  #gyakBlokk, #jatekIndito, #menetrendNezet{ padding-left:16px; padding-right:16px; }
  #gyakorlatokNezet{ padding:6px 16px 40px; }
  .gyakorlas{ padding:2px 14px 12px; }
  .uresen{ padding:0 24px; }

  .sugo-gomb{ right:16px; bottom:calc(env(safe-area-inset-bottom) + 16px); width:40px; height:40px; }
  .vissza-sav{ bottom:calc(env(safe-area-inset-bottom) + 16px); max-width:calc(100% - 90px); }
  .kereso-sav, .sugo-ablak{ max-width:calc(100vw - 24px); }

  /* a gépeléshez: iOS ne nagyítson rá a mezőkre */
  input, textarea, select, [contenteditable]{ font-size:16px; }
}
</style>
</head>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ===== ÁLLAPOT ===== */
let mappak = [];
let leckek = [];
let kivalasztottId = null;
let oldalsavNyitva = true;
let haladas = {};        /* naponta: hány kártya ment és mennyi időt töltöttél vele */
let nyitottMappak = [];
let aktivFul = "vazlat";          /* vazlat | kerdesek */
let gyakorlasSor = null;          /* gyakorlás közben: {tetelek:[], mutato, valaszLatszik, jo, rossz} */
let gyakorlatokNyitva = false;    /* a gyakorlat-áttekintő lap van nyitva */
let gyakKeszLatszik = false;      /* az áttekintőn a „Már kész" rész ki van nyitva */

/* ismétlés lépcsői ezredmásodpercben: aznap, +1 nap, +3 nap, +1 hét, +1 hónap, +3 hónap */
const NAP = 86400000;
const LEPCSOK = [0, 1*NAP, 3*NAP, 7*NAP, 14*NAP, 30*NAP, 90*NAP];

/* ===== TÁROLÁS ===== */
const hid = (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.naplo) || null;
const TAROLO_KULCS = "rozsanaplo-v1";
let mentesIdozito = null;

function csomag(){
  return JSON.stringify({
    app:"rozsanaplo", verzio:2,
    beallitasok:{ oldalsavNyitva: oldalsavNyitva, nyitottMappak: nyitottMappak, haladas: haladas },
    mappak: mappak,
    leckek: leckek
  });
}

let utolsoKiirt = null;

function mentAzonnal(){
  const adat = csomag();
  if (adat === utolsoKiirt) return adat;    /* nem változott — minek írjuk ki újra */
  utolsoKiirt = adat;
  if (hid) hid.postMessage({ tipus:"mentes", adat: adat });
  else { try { localStorage.setItem(TAROLO_KULCS, adat); } catch(e){} }
  if (window.felhoValtozott) window.felhoValtozott();
  return adat;
}

/* frissíthető-e most a lap (új appváltozatnál) — gyakorlás vagy írás közben nem */
/* csak akkor NEM, ha épp gyakorolsz, vagy az utolsó pár másodpercben gépeltél —
   a lecke szövegmezője fókuszban maradhat, attól még frissülhet */
let utolsoGepeles = 0;
document.addEventListener("input", () => { utolsoGepeles = Date.now(); }, true);
window.naploFrissithetoE = function(){
  if (gyakorlasSor) return false;
  if (Date.now() - utolsoGepeles < 8000) return false;
  return true;
};

window.naploAzonnaliMentes = function(){
  if (mentesIdozito){ clearTimeout(mentesIdozito); mentesIdozito = null; }
  return mentAzonnal();
};

function ment(){
  if (mentesIdozito) clearTimeout(mentesIdozito);
  mentesIdozito = setTimeout(() => { mentesIdozito = null; mentAzonnal(); }, 1500);
}

window.naploBetoltes = function(szoveg){
  const t = ertelmez(szoveg);
  mappak = t.mappak; leckek = t.leckek;
  /* ha gyakorlás közben töltődik újra az adat (kívülről frissült), a futó kör
     az új kártyákra álljon át — különben a válaszaid a régi, eldobott példányokba mennének */
  if (gyakorlasSor && Array.isArray(gyakorlasSor.tetelek)){
    gyakorlasSor.tetelek = gyakorlasSor.tetelek.map(x => {
      const l = leckek.find(y => y.id === x.lecke.id);
      const k = l && l.kerdesek.find(y => y.id === x.kerdes.id);
      return k ? { lecke: l, kerdes: k } : null;
    }).filter(Boolean);
    gyakorlasSor.mutato = Math.min(gyakorlasSor.mutato, gyakorlasSor.tetelek.length);
  }
  oldalsavNyitva = t.oldalsavNyitva; nyitottMappak = t.nyitottMappak;
  haladas = t.haladas || {};
  indulasUtan();
};

/* ===== ÉRTELMEZÉS ÉS MIGRÁCIÓ ===== */
function ertelmez(szoveg){
  const ures = { mappak:[], leckek:[], oldalsavNyitva:true, nyitottMappak:[] };
  if (!szoveg) return ures;

  let t;
  try { t = JSON.parse(szoveg); } catch(e){ return ures; }
  if (!t) return ures;

  const beall = t.beallitasok || {};
  const oldalsav = beall.oldalsavNyitva !== false;

  /* v2: kész szerkezet */
  if (Array.isArray(t.leckek)){
    return {
      mappak: (t.mappak || []).map((m, i) => ({
        /* Az ismeretlen mezők átmennek: ha egy újabb build vezet be egy mezőt,
           egy régebbi példány ne törölje ki az adatból, amikor visszaír. */
        ...m,
        id: m.id || ujAzonosito("m"),
        nev: m.nev || "Mappa",
        sorrend: typeof m.sorrend === "number" ? m.sorrend : i,
        /* almappa: a szülő mappa azonosítója, felső szinten null */
        szuloId: m.szuloId || null
      })),
      leckek: t.leckek.map((l, i) => rendbeTeszLecke(l, i)),
      oldalsavNyitva: oldalsav,
      nyitottMappak: Array.isArray(beall.nyitottMappak) ? beall.nyitottMappak : [],
      haladas: (beall.haladas && typeof beall.haladas === "object") ? beall.haladas : {}
    };
  }

  /* v1: a régi naplóbejegyzésekből leckék lesznek, hogy semmi ne vesszen el */
  if (Array.isArray(t.bejegyzesek)){
    const regiek = t.bejegyzesek.filter(b => (b.szoveg || b.cim || "").trim());
    if (!regiek.length) return { ...ures, oldalsavNyitva: oldalsav };

    const mappaId = ujAzonosito("m");
    return {
      mappak: [{ id: mappaId, nev: "Régi jegyzetek", sorrend: 0 }],
      leckek: regiek.map((b, i) => {
        const teljes = b.cim ? (b.cim + (b.szoveg ? "\n" + b.szoveg : "")) : (b.szoveg || "");
        const sorok = teljes.split("\n");
        let elso = 0;
        while (elso < sorok.length && !sorok[elso].trim()) elso++;
        return rendbeTeszLecke({
          id: b.id, mappaId: mappaId,
          cim: (sorok[elso] || "Jegyzet").trim(),
          html: sorok.slice(elso + 1).map(s => "<p>" + szovegEscape(s) + "</p>").join(""),
          kerdesek: [],
          letrehozva: b.letrehozva, modositva: b.modositva || b.letrehozva
        }, i);
      }),
      oldalsavNyitva: oldalsav,
      nyitottMappak: [mappaId]
    };
  }

  return { ...ures, oldalsavNyitva: oldalsav };
}

function rendbeTeszLecke(l, i){
  return {
    ...l,                            /* ismeretlen mezők megmaradnak — lásd a mappáknál */
    id: l.id || ujAzonosito("l"),
    mappaId: l.mappaId || null,
    cim: l.cim || "Cím nélküli lecke",
    sorrend: typeof l.sorrend === "number" ? l.sorrend : i,
    html: l.html || "",
    gyakorlatok: (l.gyakorlatok || []).map(g => ({
      ...g,
      id: g.id || ujAzonosito("g"),
      cim: g.cim || "",
      url: g.url || "",
      kesz: !!g.kesz,
      keszDatum: g.keszDatum || null,
      /* számlálós teendő (pl. 30 Zoom-óra): cel > 0 esetén halad/cel jelenik meg */
      cel: typeof g.cel === "number" ? g.cel : 0,
      halad: typeof g.halad === "number" ? g.halad : 0,
      /* hosszú távú kurzuskövetelmény — nem szerepel a napi emlékeztetőben */
      hosszuTav: !!g.hosszuTav
    })),
    kerdesek: (l.kerdesek || []).map(k => ({
      ...k,
      id: k.id || ujAzonosito("k"),
      kerdes: k.kerdes || "",
      valasz: k.valasz || "",
      kep: k.kep || "",
      /* saját csoportnév: külön gyakorló gombot kap a lecke tetején */
      csoport: k.csoport || "",
      csoportFent: !!k.csoportFent,     /* kiemelt: a nagy gomb alatt, nem a csoportok közt */
      iras: !!k.iras,                   /* ide gépelve válaszolsz, nem fejben */
      kepFent: !!k.kepFent,             /* a kép a kérdés szövege FÖLÖTT jelenik meg, nagyban */
      reszek: Array.isArray(k.reszek) ? k.reszek.map(r => ({
        cim: r.cim || "", kerdes: r.kerdes || "", valasz: r.valasz || "", sajatValasz: r.sajatValasz || ""
      })) : [],                         /* munkafüzet-mód: egy kártyán több önálló kérdés, külön beírt válasszal */
      csakParosito: !!k.csakParosito,   /* csak a párosító játékban jelenik meg */
      tukor: !!k.tukor,
      /* záróvizsga: feleletválasztós — lehetőségek angolul és magyarul, a jó indexe */
      valasztos: (k.valasztos && Array.isArray(k.valasztos.lehetosegek)) ? {
        lehetosegek: k.valasztos.lehetosegek, lehetosegekHu: k.valasztos.lehetosegekHu || [],
        helyes: typeof k.valasztos.helyes === "number" ? k.valasztos.helyes : 0,
        kerdesHu: k.valasztos.kerdesHu || "", magyarazat: k.valasztos.magyarazat || ""
      } : null,                 /* tükörkép: kifejtős önreflexió, nem ismétlődik, a válaszok megmaradnak */
      valaszok: Array.isArray(k.valaszok) ? k.valaszok : [],
      sajatValasz: k.sajatValasz || "",
      lepcso: typeof k.lepcso === "number" ? k.lepcso : 0,
      kovetkezo: k.kovetkezo || most(),
      utolso: k.utolso || null
    })),
    /* menetrend: a napi bontás önálló szerkezete — a napokra osztás számított */
    menetrend: l.menetrend ? {
      percNap: typeof l.menetrend.percNap === "number" ? l.menetrend.percNap : 180,
      pihenoNapok: Array.isArray(l.menetrend.pihenoNapok) ? l.menetrend.pihenoNapok : [0],
      napok: (l.menetrend.napok && typeof l.menetrend.napok === "object") ? l.menetrend.napok : {},
      stopper: { kezdet: (l.menetrend.stopper && l.menetrend.stopper.kezdet) || null,
                 inditva: (l.menetrend.stopper && l.menetrend.stopper.inditva) || null },
      nyitottNapok: Array.isArray(l.menetrend.nyitottNapok) ? l.menetrend.nyitottNapok : [],
      csukottNapok: Array.isArray(l.menetrend.csukottNapok) ? l.menetrend.csukottNapok : [],
      mutatMind: !!l.menetrend.mutatMind,
      tetelek: (l.menetrend.tetelek || []).map((t, j) => ({
        ...t,                          /* ismeretlen mezők megmaradnak */
        id: t.id || ("mt" + j),
        modul: t.modul || "",
        cim: t.cim || "",
        perc: typeof t.perc === "number" ? t.perc : 15,
        tipus: t.tipus || "o",
        kesz: !!t.kesz,
        keszDatum: t.keszDatum || null,
        kihagyva: !!t.kihagyva,
        /* melyik leckéhez (és azon belül melyik gyakorlathoz) tartozik — a kettő együtt pipálódik */
        leckeId: t.leckeId || null,
        gyakorlatId: t.gyakorlatId || null
      }))
    } : null,
    ketirany: !!l.ketirany,          /* szótár: oda-vissza is játszható */
    rejtett: !!l.rejtett,            /* nem látszik az oldalsávban, csak hivatkozásból */
    kulcsszavak: Array.isArray(l.kulcsszavak) ? l.kulcsszavak.map(String) : [],
    /* ászana-gyakorlási napló: pózonként dátumos bejegyzések (jegyzet, élvezet, nehézség) */
    gyakNaplo: (l.gyakNaplo && typeof l.gyakNaplo === "object") ? l.gyakNaplo : {},
    letrehozva: l.letrehozva || most(),
    modositva: l.modositva || l.letrehozva || most()
  };
}

function szovegEscape(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ===== DÁTUM ===== */
const IDO    = new Intl.DateTimeFormat("hu-HU", { hour:"2-digit", minute:"2-digit" });
const NAPFMT = new Intl.DateTimeFormat("hu-HU", { month:"short", day:"numeric" });
const EV     = new Intl.DateTimeFormat("hu-HU", { year:"numeric", month:"numeric", day:"numeric" });

function napKezdet(d){ const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); }

function rovidDatum(iso){
  const d = new Date(iso), ma = napKezdet(new Date()), az = napKezdet(d);
  if (az === ma) return IDO.format(d);
  if (az === ma - NAP) return "Tegnap";
  if (d.getFullYear() === new Date().getFullYear()) return NAPFMT.format(d);
  return EV.format(d);
}

/* mikor jön vissza — emberi nyelven */
function esedekesSzoveg(iso){
  const most_ = Date.now(), mikor = new Date(iso).getTime();
  if (mikor <= most_) return "esedékes";
  const napok = Math.ceil((napKezdet(mikor) - napKezdet(most_)) / NAP);
  if (napok <= 0) return "ma";
  if (napok === 1) return "holnap";
  if (napok < 7) return napok + " nap múlva";
  if (napok < 30) return Math.round(napok/7) + " hét múlva";
  return Math.round(napok/30) + " hónap múlva";
}

/* ===== SEGÉDEK ===== */
function most(){ return new Date().toISOString(); }
function ujAzonosito(elotag){
  return (elotag || "b") + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function aktualis(){ return leckek.find(l => l.id === kivalasztottId) || null; }

function esedekesE(k){ return new Date(k.kovetkezo).getTime() <= Date.now(); }
function leckeEsedekes(l){ return l.kerdesek.filter(k => !k.csakParosito && !k.tukor && esedekesE(k)).length; }
/* a napi ismétlésbe csak a tananyag számít bele — a játékokat magadtól indítod */
function ismetlesbeSzamit(l){
  if (l.rejtett) return false;
  return gyokerMappaNeve(l) === "Tananyag";
}
function osszesEsedekes(){
  return leckek.reduce((n, l) => n + (ismetlesbeSzamit(l) ? leckeEsedekes(l) : 0), 0);
}

/* a napi emlékeztetőbe csak a rövid távú teendők számítanak bele */
function nyitottGyakorlatok(l){ return (l.gyakorlatok || []).filter(g => !g.kesz && !g.hosszuTav).length; }
function osszesNyitottGyakorlat(){ return leckek.reduce((n, l) => n + nyitottGyakorlatok(l), 0); }
function elsoNyitottGyakorlatLecke(){
  return leckek.find(l => nyitottGyakorlatok(l) > 0) || null;
}

/* kurzuskövetelmények haladása: hány kész, hányból */
function kovetelmenyAllas(){
  let kesz = 0, osszes = 0;
  for (const l of leckek)
    for (const g of (l.gyakorlatok || []))
      if (g.hosszuTav){ osszes++; if (g.kesz) kesz++; }
  return { kesz, osszes };
}

function mappaLeckei(mappaId){
  return leckek.filter(l => !l.rejtett && l.mappaId === mappaId).sort((a,b) => a.sorrend - b.sorrend);
}

/* Melyik gyökérmappa alá tartozik a lecke? Almappákkal ez már nem a közvetlen
   szülő neve — fel kell sétálni a láncon. */
function gyokerMappaNeve(l){
  let m = mappak.find(x => x.id === (l && l.mappaId));
  const latott = new Set();
  while (m && m.szuloId && !latott.has(m.id)){
    latott.add(m.id);
    m = mappak.find(x => x.id === m.szuloId);
  }
  return m ? m.nev : "";
}

/* egy mappa közvetlen almappái, sorrendben */
function almappak(mappaId){
  return mappak.filter(m => m.szuloId === mappaId).sort((a,b) => a.sorrend - b.sorrend);
}

/* hány lecke van a mappában és minden alatta lévő mappában */
function mappaLeckeSzam(mappaId){
  return mappaLeckei(mappaId).length +
         almappak(mappaId).reduce((n, m) => n + mappaLeckeSzam(m.id), 0);
}

/* Az üres almappák nem kerülnek az oldalsávba — a tananyag ütemterve szerint
   mind létezik, de csak akkor bukkan elő, amikor kerül bele lecke. Így nem
   kell végiggörgetni negyven üres soron. */
function mappaLatszik(m){
  return !m.szuloId || mappaLeckeSzam(m.id) > 0;
}

/* ===== MŰVELETEK ===== */
function ujMappa(){
  const m = { id: ujAzonosito("m"), nev: "Új mappa", sorrend: mappak.length, szuloId: null };
  mappak.push(m);
  if (!nyitottMappak.includes(m.id)) nyitottMappak.push(m.id);
  mentAzonnal(); rajzolLista();
  /* a friss mappanév azonnal átírható */
  const elem = document.querySelector('.mappa[data-id="' + m.id + '"] .nev');
  if (elem){ elem.contentEditable = "true"; elem.focus(); document.execCommand("selectAll", false, null); }
}

function ujLecke(mappaId){
  if (!mappak.length) ujMappa();
  const cel = mappaId || (aktualis() && aktualis().mappaId) || mappak[0].id;
  const l = rendbeTeszLecke({
    mappaId: cel, cim: "", html: "", kerdesek: [],
    sorrend: mappaLeckei(cel).length
  }, 0);
  leckek.push(l);
  if (!nyitottMappak.includes(cel)) nyitottMappak.push(cel);
  kivalasztottId = l.id;
  aktivFul = "vazlat";
  gyakorlasSor = null;
  mentAzonnal(); rajzol();
  $("leckeCim").focus();
}


function ujKerdes(){
  const l = aktualis(); if (!l) return;
  l.kerdesek.push({
    id: ujAzonosito("k"), kerdes: "", valasz: "",
    lepcso: 0, kovetkezo: most(), utolso: null
  });
  l.modositva = most();
  mentAzonnal(); rajzolKerdesek(); rajzolLista();
}

function oldalsavValt(){
  oldalsavNyitva = !oldalsavNyitva;
  $("lap").classList.toggle("osszecsukott", !oldalsavNyitva);
  mentAzonnal();
}

function mappaValt(id){
  const i = nyitottMappak.indexOf(id);
  if (i >= 0) nyitottMappak.splice(i, 1); else nyitottMappak.push(id);
  mentAzonnal(); rajzolLista();
}

/* ===== ISMÉTLÉS ===== */
function valaszol(kerdes, ment_e){
  kerdes.utolso = most();
  if (ment_e){
    kerdes.lepcso = Math.min(kerdes.lepcso + 1, LEPCSOK.length - 1);
    naplozHaladast(true);
  } else {
    /* nem nullázunk: egy rossz nap ne törölje a hetek munkáját */
    /* a 3 napos és az 1 hetes lépcsőről csak egyet esik (3 nap → 1 nap, 1 hét → 3 nap) */
    const esik = (kerdes.lepcso === 2 || kerdes.lepcso === 3) ? 1 : 2;
    kerdes.lepcso = Math.max(0, kerdes.lepcso - esik);
  }
  kerdes.kovetkezo = new Date(Date.now() + LEPCSOK[kerdes.lepcso]).toISOString();
  mentAzonnal();
}

/* ===== RAJZOLÁS ===== */
/* a szerkesztőben hagyott kurzor elengedése — ne villogjon ott, ahol nem írsz */
function kurzortElenged(){
  const mezo = $("tartalom");
  if (document.activeElement === mezo) mezo.blur();
  const kijeloles = window.getSelection && window.getSelection();
  if (kijeloles && kijeloles.rangeCount && mezo.contains(kijeloles.anchorNode)) kijeloles.removeAllRanges();
}

function rajzol(){ rajzolLista(); rajzolFo(); rajzolVisszaSav(); frissitVisszaNyilat(); }

function rajzolLista(){
  const doboz = $("lista");
  doboz.innerHTML = "";
  rajzolHaladast();

  /* esedékes ismétlés fent */
  const db = osszesEsedekes();
  if (db > 0){
    const e = document.createElement("div");
    e.className = "esedekes";
    e.onclick = () => inditGyakorlas(null);
    const fo = document.createElement("div");
    fo.className = "fo"; fo.textContent = "Ma ismételni — " + db + " kérdés";
    const alsor = document.createElement("div");
    alsor.className = "alsor";
    alsor.textContent = db > ISMETLES_ADAG ? ("kattints — " + ISMETLES_ADAG + " kártyás adagokban megy")
                                           : "kattints a gyakorlás indításához";
    e.appendChild(fo); e.appendChild(alsor);
    doboz.appendChild(e);
  }

  /* még el nem végzett gyakorlatok — emlékeztető */
  const gyDb = osszesNyitottGyakorlat();
  if (gyDb > 0){
    const e = document.createElement("div");
    e.className = "esedekes";
    e.style.background = "linear-gradient(100deg, rgba(255,150,90,.24), rgba(255,90,164,.22) 70%)";
    e.onclick = () => gyakorlatokListaNyit();
    const fo = document.createElement("div");
    fo.className = "fo";
    fo.style.color = "#c2521f";
    fo.textContent = gyDb === 1 ? "1 gyakorlat vár rád" : gyDb + " gyakorlat vár rád";
    const alsor = document.createElement("div");
    alsor.className = "alsor";
    alsor.textContent = "kattints — mind egy lapon";
    e.appendChild(fo); e.appendChild(alsor);
    doboz.appendChild(e);
  }

  if (!mappak.length && !leckek.length){
    const u = document.createElement("div");
    u.className = "ures-lista";
    u.textContent = "Még nincs lecke.\nKezdd egy mappával, aztán jöhet az első lecke.";
    u.style.whiteSpace = "pre-line";
    doboz.appendChild(u);
    return;
  }

  const rendezettMappak = mappak.filter(m => !m.szuloId).sort((a,b) => a.sorrend - b.sorrend);
  for (const m of rendezettMappak) doboz.appendChild(mappaElem(m));

  /* mappa nélkül maradt leckék */
  const arvak = leckek.filter(l => !l.rejtett && !mappak.some(m => m.id === l.mappaId));
  if (arvak.length){
    const cim = document.createElement("div");
    cim.className = "csoportcim"; cim.textContent = "Besorolatlan";
    doboz.appendChild(cim);
    for (const l of arvak) doboz.appendChild(leckeElem(l));
  }
}

function mappaElem(m, melyseg){
  melyseg = melyseg || 0;
  const nyitva = nyitottMappak.includes(m.id);
  const doboz = document.createElement("div");
  doboz.className = "mappa" + (nyitva ? " nyitva" : "") + (melyseg ? " almappa" : "");
  doboz.dataset.id = m.id;

  const fej = document.createElement("div");
  fej.className = "mappa-fej";
  fej.onclick = e => { if (e.target.classList.contains("nev") && e.target.isContentEditable) return; mappaValt(m.id); };

  const nyil = document.createElement("span");
  nyil.className = "nyil"; nyil.textContent = "▶";
  fej.appendChild(nyil);

  const nev = document.createElement("span");
  nev.className = "nev"; nev.textContent = m.nev;
  nev.ondblclick = e => {
    e.stopPropagation();
    nev.contentEditable = "true"; nev.focus();
    document.execCommand("selectAll", false, null);
  };
  nev.onblur = () => {
    nev.contentEditable = "false";
    const uj = nev.textContent.trim();
    if (uj && uj !== m.nev){ m.nev = uj; mentAzonnal(); }
    else nev.textContent = m.nev;
  };
  nev.onkeydown = e => {
    if (e.key === "Enter"){ e.preventDefault(); nev.blur(); }
    if (e.key === "Escape"){ nev.textContent = m.nev; nev.blur(); }
  };
  fej.appendChild(nev);

  const sajat = mappaLeckei(m.id);
  const alattiak = almappak(m.id).filter(mappaLatszik);
  const db = document.createElement("span");
  db.className = "db"; db.textContent = mappaLeckeSzam(m.id) || "";
  fej.appendChild(db);

  doboz.appendChild(fej);

  const tartalom = document.createElement("div");
  tartalom.className = "mappa-tartalom";
  if (!sajat.length && !alattiak.length){
    const u = document.createElement("div");
    u.className = "tetel-also"; u.style.padding = "4px 12px 8px";
    u.textContent = "üres";
    tartalom.appendChild(u);
  }
  /* előbb az almappák, utána a mappába közvetlenül tett leckék */
  for (const a of alattiak) tartalom.appendChild(mappaElem(a, melyseg + 1));
  for (const l of sajat) tartalom.appendChild(leckeElem(l));
  doboz.appendChild(tartalom);

  return doboz;
}

function leckeElem(l){
  /* oldalsávból választva új útra indulunk */
  const t = document.createElement("div");
  t.className = "tetel" + (l.id === kivalasztottId ? " kivalasztott" : "");
  t.onclick = () => {
    kurzortElenged();
    kivalasztottId = l.id; gyakorlasSor = null; aktivFul = "vazlat";
    gyakorlatokNyitva = false;
    rajzol();
  };

  const cim = document.createElement("div");
  cim.className = "tetel-cim";
  const sz = document.createElement("span");
  sz.className = "szoveg";
  sz.textContent = l.cim.trim() || "Cím nélküli lecke";
  cim.appendChild(sz);

  const esed = leckeEsedekes(l);
  /* a pötty teendőt jelez — a játékok kiegészítők, azoknál nem kell */
  if (esed > 0 && ismetlesbeSzamit(l)){
    const p = document.createElement("span");
    p.className = "pont"; p.title = esed + " kérdés esedékes";
    cim.appendChild(p);
  }
  t.appendChild(cim);

  const also = document.createElement("div");
  also.className = "tetel-also";
  const kdb = l.kerdesek.filter(k => !k.tukor).length;
  const gyoker = gyokerMappaNeve(l);
  const lesznekKerdesek = gyoker === "Tananyag" || gyoker === "Játék";
  also.textContent = kdb ? (kdb + " kérdés" + (esed ? " · " + esed + " esedékes" : ""))
                         : (lesznekKerdesek ? "nincs kérdés" : "");
  t.appendChild(also);

  return t;
}

/* a „Játék" mappában játéknak hívjuk, máshol gyakorlásnak */
function gyakorlasNeve(l){
  return gyokerMappaNeve(l) === "Játék" ? "Játék" : "Gyakorlás";
}

function rajzolFo(){
  const l = aktualis();
  const szerk = $("szerkeszto"), ures = $("uresen"), gy = $("gyakorlasNezet");
  const gl = $("gyakorlatokNezet");

  if (gyakorlatokNyitva){
    szerk.classList.add("rejtve");
    ures.classList.add("rejtve");
    gy.classList.add("rejtve");
    gl.classList.remove("rejtve");
    rajzolGyakorlatLista();
    return;
  }
  gl.classList.add("rejtve");

  if (gyakorlasSor && gyakorlasSor.parosito){
    szerk.classList.add("rejtve");
    ures.classList.add("rejtve");
    gy.classList.remove("rejtve");
    rajzolParositot();
    return;
  }
  if (gyakorlasSor){
    szerk.classList.add("rejtve");
    ures.classList.add("rejtve");
    gy.classList.remove("rejtve");
      rajzolGyakorlas();
    return;
  }
  gy.classList.add("rejtve");

  if (!l){
    szerk.classList.add("rejtve");
    ures.classList.remove("rejtve");
    return;
  }
  szerk.classList.remove("rejtve");
  ures.classList.add("rejtve");

  if ($("leckeCim").value !== l.cim) $("leckeCim").value = l.cim;
  const kdoboz = $("fejlecKulcsszavak");
  kdoboz.innerHTML = "";
  for (const sz of (l.kulcsszavak || [])){
    const e = document.createElement("div");
    e.textContent = sz;
    kdoboz.appendChild(e);
  }

  /* a két fül csak a tananyagnál kell — ott van szöveg IS, kérdés IS */
  const fulesE = gyokerMappaNeve(l) === "Tananyag";
  if (!fulesE) aktivFul = "vazlat";
  $("fulSor").classList.toggle("rejtve", !fulesE);
  $("fulVazlat").classList.toggle("aktiv", aktivFul === "vazlat");
  $("fulKerdesek").classList.toggle("aktiv", aktivFul === "kerdesek");

  const vazlat = aktivFul === "vazlat";
  $("vazlatNezet").classList.toggle("rejtve", !vazlat);
  $("kerdesNezet").classList.toggle("rejtve", vazlat);
  $("vazlatNezet").style.display = vazlat ? "flex" : "none";

  /* a menetrend a szövegszerkesztő helyett a saját nézetét kapja */
  const menetrendE = !!l.menetrend;
  $("tartalom").classList.toggle("rejtve", menetrendE);
  $("jatekIndito").classList.toggle("rejtve", menetrendE);
  $("gyakBlokk").classList.toggle("rejtve", menetrendE);
  if (!menetrendE) $("menetrendNezet").classList.add("rejtve");

  if (vazlat){
    const mezo = $("tartalom");
    if (tisztaHtml() !== l.html){
      /* új tartalom: a szerkesztő ne tartsa magán a villogó kurzort */
      if (document.activeElement === mezo) mezo.blur();
      mezo.innerHTML = l.html;
      vedettSzerkezetek(mezo);
      /* amiből kitörölted a tartalmat, az ne legyen nyitogatható */
      mezo.querySelectorAll("li.nyilo").forEach(x => {
        const test = x.querySelector(".test");
        /* a gyakorlási napló miatt a pózlap akkor is nyitható marad, ha a szövegét kitörölted */
        if (!test || (!test.textContent.replace(/\s|\u00a0/g, "") && !test.querySelector("[data-naplo]"))){
          const fej = x.querySelector(".fej");
          if (fej) x.innerHTML = fej.innerHTML;
          x.classList.remove("nyilo", "nyitva");
        }
      });
      /* minden lenyitható szakasz az alapállapotába kerül:
         data-alap="csukva" → csukva, minden más → nyitva */
      mezo.querySelectorAll("section.csukhato").forEach(x => {
        x.classList.toggle("nyitva", x.dataset.alap !== "csukva");
      });
    }
    frissitCsoportGombok();
    rajzolGyakNaplok();
    rajzolJatekInditot();
    rajzolGyakorlatok();
    frissitOrak();
    frissitOrarend();
    rajzolMenetrend();
  } else {
    rajzolKerdesek();
  }
}

/* A generált szerkezeteket nem lehet belülről elgépelni: táblázat, galéria,
   szótár, gombsorok, órarend. A szöveg és a felsorolások szabadon szerkeszthetők,
   és ezek a blokkok egészben továbbra is törölhetők. */
/* amit szerkesztéskor nem lehet szétszedni vagy kitörölni */
const VEDETT_TORLES = "img, figure, table, ul.kvizracs, li.nyilo, .fej, .test, [data-naplo], .szakasz-gombok, " +
                      ".leckelink, .utlink, .ora-blokk, .idozona, .orarend-allapot, [data-gyakorlat], [data-tukor], [data-csoport]";
/* ezeknek a belsejébe sem lehet belenyúlni (a .test-ben és a táblázatcellákban lévő szöveg viszont szerkeszthető) */
const VEDETT_EGESZ = "img, [data-naplo], .fej, .szakasz-gombok, .leckelink, .utlink, .ora-blokk, [data-gyakorlat], [data-tukor], [data-csoport]";
const VEDETT = "figure.abra, table, .pozracs, .szotar, .ugras-sor, .szakasz-gombok, .idozona," +
               " .ora-blokk, .orarend-allapot, section.csukhato > h2, .leckelink, .utlink";

function vedettSzerkezetek(mezo){
  for (const e of mezo.querySelectorAll(VEDETT)) e.setAttribute("contenteditable", "false");
}

/* a szövegbe ágyazott csoportgombokra ráírjuk, hány kártya tartozik hozzájuk */
/* ===== ÁSZANA-GYAKORLÁSI NAPLÓ — a pózlapokon, [data-naplo="póz"] helyőrzőben ===== */
let naploUrlapNyitva = null;

function rajzolGyakNaplok(){
  const l = aktualis(); if (!l) return;
  for (const h of $("tartalom").querySelectorAll("[data-naplo]")) rajzolGyakNaplo(l, h);
}

function rajzolGyakNaplo(l, h){
  const poz = h.dataset.naplo;
  h.contentEditable = "false";
  h.innerHTML = "";
  /* ne a lecke szövegszerkesztője kapja a gépelést */
  for (const ev of ["input","keydown","keyup","paste"]) h.addEventListener(ev, e => e.stopPropagation());
  const lista = (l.gyakNaplo[poz] || []).slice().reverse();

  const fej = document.createElement("div"); fej.className = "gn-fej";
  const cim = document.createElement("b"); cim.textContent = "Gyakorlási napló" + (lista.length ? " · " + lista.length : "");
  fej.appendChild(cim);
  if (naploUrlapNyitva !== poz){
    const uj = document.createElement("button"); uj.className = "gn-uj"; uj.textContent = "+ bejegyzés";
    uj.onclick = e => { e.stopPropagation(); naploUrlapNyitva = poz; rajzolGyakNaplo(l, h); };
    fej.appendChild(uj);
  }
  h.appendChild(fej);

  if (naploUrlapNyitva === poz){
    const f = document.createElement("div"); f.className = "gn-urlap";
    const jegyzet = document.createElement("textarea");
    jegyzet.placeholder = "Mi volt nehéz, mit élveztél, hogy érezted magad benne?";
    f.appendChild(jegyzet);

/* A lecke csoportjai: a fogalomcsaládok, plusz amit a kártya maga megnevez
   (kerdes.csoport) — így egy témakör egyben gyakorolható. */
function csoportLista(lecke){
  const ki = [];
  for (const cs of Object.keys(CSALADOK)){
    const tagok = CSALADOK[cs].map(t => kerdesNeve(lecke, t)).filter(Boolean);
    if (tagok.length) ki.push({ nev: cs, tagok, csalad: true });
  }
  const sajat = new Map();
  for (const k of (lecke.kerdesek || [])){
    if (!k.csoport || k.csakParosito || k.tukor) continue;
    if (!sajat.has(k.csoport)) sajat.set(k.csoport, []);
    sajat.get(k.csoport).push(k);
  }
  for (const [nev, tagok] of sajat) ki.push({ nev, tagok, fent: tagok.some(k => k.csoportFent) });
  return ki;
}

/* csak egy csoport kártyáival játszunk */
function inditCsoportot(lecke, csoport){
  const cs = csoportLista(lecke).find(x => x.nev === csoport);
  if (!cs || !cs.tagok.length) return;
  const tetelek = cs.tagok.map(k => ({ lecke: lecke, kerdes: k }));
  gyakorlasSor = { tetelek, mutato: 0, valaszLatszik: false, jo: 0, rossz: 0, cim: csoport };
  rajzolFo();
}

/* ===================== MENETREND =====================
   A menetrend nem fix naptár: a tételek egy sorrendezett lista, és a napokra
   bontás mindig újraszámolódik abból, ami még nyitva van. Ami ma kimarad,
   magától átkerül holnapra — nincs "lemaradtam" állapot, csak arrébb csúszik. */

let mrStopperIdozito = null;
let mrUtolsoMentes = 0;

const MR_NAPNEV = ["vasárnap","hétfő","kedd","szerda","csütörtök","péntek","szombat"];
const MR_NAPROVID = ["V","H","K","Sze","Cs","P","Szo"];
const MR_HONAP = ["január","február","március","április","május","június",
                  "július","augusztus","szeptember","október","november","december"];

function menetrendLecke(){ return leckek.find(l => l.menetrend) || null; }

function mrKulcs(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" +
         String(d.getDate()).padStart(2,"0");
}

/* mennyi időt mértél az adott napon — percben */
function mrMertPerc(mr, kulcs){ return Math.round((mr.napok[kulcs] || 0) / 60); }

/* A te tempód: a mért idő és a kipipált becslés aránya. 1,0 alatt gyorsabb vagy
   a becslésnél, felette lassabb. Csak akkor él, ha van elég mért nap. */
function mrTempo(mr){
  let mert = 0, becsult = 0, napok = 0;
  const becslesNaponta = {};
  for (const t of mr.tetelek)
    if (t.kesz && t.keszDatum){
      const k = mrKulcs(new Date(t.keszDatum));
      becslesNaponta[k] = (becslesNaponta[k] || 0) + t.perc;
    }
  for (const k in becslesNaponta){
    const m = mrMertPerc(mr, k);
    if (m > 10 && becslesNaponta[k] > 10){ mert += m; becsult += becslesNaponta[k]; napok++; }
  }
  if (napok < 2 || becsult < 60) return { szorzo: 1, napok: napok };
  return { szorzo: Math.max(0.5, Math.min(3, mert / becsult)), napok: napok };
}

function mrPihenoE(mr, d){ return mr.pihenoNapok.includes(d.getDay()); }

/* A nyitott tételek szétosztása a mai naptól kezdve. A ma már kipipáltak
   elfogyasztják a mai keretet — ezért rövidül a mai lista, ahogy haladsz. */
function mrTervez(mr){
  const tempo = mrTempo(mr);
  const keret = mr.percNap / tempo.szorzo;      /* ennyi BECSÜLT perc fér egy napba */
  const maKulcs = mrKulcs(new Date());

  const maKesz = mr.tetelek.filter(t => t.kesz && t.keszDatum && mrKulcs(new Date(t.keszDatum)) === maKulcs);
  const maElhasznalt = maKesz.reduce((n,t) => n + t.perc, 0);
  const nyitott = mr.tetelek.filter(t => !t.kesz && !t.kihagyva);

  const napok = [];
  let d = new Date(); d.setHours(0,0,0,0);
  let elso = true, i = 0;

  while (i < nyitott.length && napok.length < 400){
    if (mrPihenoE(mr, d) && !elso){ d = new Date(d.getTime() + NAP); continue; }
    let szabad = keret - (elso ? maElhasznalt : 0);
    if (elso && mrPihenoE(mr, d)) szabad = 0;
    const lista = elso ? maKesz.slice() : [];
    let hasznalt = 0;
    while (i < nyitott.length && (hasznalt === 0 || hasznalt + nyitott[i].perc <= szabad + 20)){
      if (szabad <= 10) break;
      lista.push(nyitott[i]); hasznalt += nyitott[i].perc; i++;
      if (hasznalt >= szabad) break;
    }
    napok.push({ datum: new Date(d), kulcs: mrKulcs(d), tetelek: lista,
                 perc: lista.filter(t => !t.kesz).reduce((n,t)=>n+t.perc,0),
                 maiNap: elso });
    elso = false;
    d = new Date(d.getTime() + NAP);
  }

  /* ha minden nyitott elfogyott, de ma volt kipipálva valami, a mai nap akkor is látszik */
  if (!napok.length){
    const most_ = new Date(); most_.setHours(0,0,0,0);
    napok.push({ datum: most_, kulcs: maKulcs, tetelek: maKesz, perc: 0, maiNap: true });
  }
  return { napok, tempo, keret, maElhasznalt };
}

/* ===== STOPPER ===== */
function mrStopperFutE(mr){ return !!(mr.stopper && mr.stopper.kezdet); }

function mrEltelt(mr){
  if (!mrStopperFutE(mr)) return 0;
  return Math.max(0, Math.round((Date.now() - mr.stopper.kezdet) / 1000));
}

function mrStopperIndit(){
  const l = menetrendLecke(); if (!l) return;
  l.menetrend.stopper = { kezdet: Date.now(), inditva: Date.now() };
  mrUtolsoMentes = Date.now();
  napotJelol();
  mentAzonnal();
  mrIdozitoIndit();
  rajzolMenetrend();
}

/* a mért másodperceket átvezetjük a mai napra, és a stoppert innen folytatjuk */
function mrStopperRogzit(mr){
  const eltelt = mrEltelt(mr);
  if (eltelt <= 0) return;
  const k = mrKulcs(new Date());
  mr.napok[k] = (mr.napok[k] || 0) + eltelt;
  mr.stopper.kezdet = Date.now();
}

function mrStopperLeallit(){
  const l = menetrendLecke(); if (!l) return;
  mrStopperRogzit(l.menetrend);
  l.menetrend.stopper = { kezdet: null };
  l.modositva = most();
  mentAzonnal();
  mrIdozitoLeallit();
  rajzolMenetrend();
}

function mrIdozitoIndit(){
  mrIdozitoLeallit();
  mrStopperIdozito = setInterval(() => {
    const l = menetrendLecke();
    if (!l || !mrStopperFutE(l.menetrend)){ mrIdozitoLeallit(); return; }
    /* egy nyitva felejtett stopper se számoljon egész éjszakát */
    const ind = l.menetrend.stopper.inditva;
    if (ind && Date.now() - ind > 4*3600*1000){ mrStopperLeallit(); return; }
    /* fél percenként kiírjuk, hogy váratlan kilépésnél se vesszen el az idő */
    if (Date.now() - mrUtolsoMentes > 30000){
      mrStopperRogzit(l.menetrend);
      mrUtolsoMentes = Date.now();
      mentAzonnal();
    }
    const kijelzo = $("mrOra");
    if (kijelzo) kijelzo.textContent = mrIdoSzoveg(mrMaiMp(l.menetrend));
  }, 1000);
}

function mrIdozitoLeallit(){
  if (mrStopperIdozito){ clearInterval(mrStopperIdozito); mrStopperIdozito = null; }
}

function mrMaiMp(mr){ return (mr.napok[mrKulcs(new Date())] || 0) + mrEltelt(mr); }

function mrIdoSzoveg(mp){
  const o = Math.floor(mp/3600), p = Math.floor((mp%3600)/60), m = mp%60;
  return String(o).padStart(2,"0") + ":" + String(p).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}

/* ha az app futó stopperrel állt le, óvatosan folytatjuk — egy elfelejtett
   stopper ne írjon jóvá éjszakákat */
function mrStopperHelyreallit(){
  const l = menetrendLecke(); if (!l || !mrStopperFutE(l.menetrend)) return;
  const eltelt = mrEltelt(l.menetrend);
  if (eltelt > 4*3600){ l.menetrend.stopper = { kezdet: null }; mentAzonnal(); return; }
  mrUtolsoMentes = Date.now();
  mrIdozitoIndit();
}

/* ===== RAJZOLÁS ===== */
let mrKeszNyitva = false, mrPotloNyitva = false;

function rajzolMenetrend(){
  const l = aktualis();
  const doboz = $("menetrendNezet");
  if (!doboz) return;
  if (!l || !l.menetrend){ doboz.classList.add("rejtve"); return; }
  doboz.classList.remove("rejtve");
  const mr = l.menetrend;
  const terv = mrTervez(mr);
  doboz.innerHTML = "";

  const el = (osztaly, szulo, szoveg) => {
    const e = document.createElement("div");
    if (osztaly) e.className = osztaly;
    if (szoveg !== undefined) e.textContent = szoveg;
    if (szulo) szulo.appendChild(e);
    return e;
  };

  /* — stopper — */
  const fut = mrStopperFutE(mr);
  const st = el("mr-stopper" + (fut ? " fut" : ""), doboz);
  const oraDoboz = el("", st);
  const ora = el("mr-ora", oraDoboz, mrIdoSzoveg(mrMaiMp(mr)));
  ora.id = "mrOra";
  el("mr-ora-alatt", oraDoboz, fut ? "fut — a tanulásod mérése" : "ma mért tanulóidő");
  el("mr-terkitolto", st);

  const gomb = document.createElement("button");
  gomb.className = "mr-nagygomb" + (fut ? " leallit" : "");
  gomb.textContent = fut ? "■  Végeztem" : "▶  Tanulás indítása";
  gomb.onclick = () => fut ? mrStopperLeallit() : mrStopperIndit();
  st.appendChild(gomb);

  /* — elfelejtetted elindítani? utólag beírható — */
  const potlo = el("mr-potlo", doboz);
  if (!mrPotloNyitva){
    const nyito = el("mr-potlo-nyito", potlo, "+ elfelejtettem elindítani — idő utólag");
    nyito.onclick = () => { mrPotloNyitva = true; rajzolMenetrend(); };
  } else {
    const nap = document.createElement("select");
    for (let i = 0; i < 14; i++){
      const d = new Date(Date.now() - i * NAP);
      const o = document.createElement("option");
      o.value = mrKulcs(d);
      o.textContent = (i === 0 ? "ma" : i === 1 ? "tegnap" : MR_HONAP[d.getMonth()] + " " + d.getDate() + ".") +
                      " · " + MR_NAPNEV[d.getDay()] + " · eddig " + idoSzoveg(mrMertPerc(mr, mrKulcs(d)));
      nap.appendChild(o);
    }
    potlo.appendChild(nap);
    const perc = document.createElement("input");
    perc.type = "number"; perc.min = "5"; perc.max = "600"; perc.step = "5"; perc.value = "60";
    potlo.appendChild(perc);
    potlo.appendChild(document.createTextNode("perc"));
    const hozza = document.createElement("button");
    hozza.className = "mr-potlo-gomb"; hozza.textContent = "hozzáadom";
    hozza.onclick = () => {
      const v = parseInt(perc.value, 10);
      if (!(v > 0 && v <= 600)) return;
      mr.napok[nap.value] = (mr.napok[nap.value] || 0) + v * 60;
      mrPotloNyitva = false; l.modositva = most(); mentAzonnal(); rajzolMenetrend();
    };
    potlo.appendChild(hozza);
    const megse = el("mr-potlo-nyito", potlo, "mégse");
    megse.onclick = () => { mrPotloNyitva = false; rajzolMenetrend(); };
  }

  /* — összegzés — */
  const osszes = mr.tetelek.filter(t => !t.kihagyva);
  const kesz = osszes.filter(t => t.kesz);
  const hatraPerc = osszes.filter(t => !t.kesz).reduce((n,t)=>n+t.perc,0);
  const vege = terv.napok.length ? terv.napok[terv.napok.length-1].datum : new Date();
  const mind = mr.tetelek.reduce((n,t)=> n + (t.kihagyva ? 0 : t.perc), 0);

  const o = el("mr-osszegzo", doboz);
  const cel = el("mr-cel", o);
  if (!hatraPerc) cel.innerHTML = "Kész vagy az egész kurzussal. ✦";
  else cel.innerHTML = "Ha tartod a tempót, <b>" + vege.getFullYear() + ". " +
       MR_HONAP[vege.getMonth()] + " " + vege.getDate() + "-án</b> végzel.";

  const sav = el("mr-sav", o);
  const belso = document.createElement("i");
  belso.style.width = Math.round((mind ? (mind - hatraPerc) / mind : 1) * 100) + "%";
  sav.appendChild(belso);

  const ad = el("mr-adatok", o);
  ad.innerHTML =
    "<span><b>" + kesz.length + " / " + osszes.length + "</b> tétel kész</span>" +
    "<span>hátra: <b>" + idoSzoveg(hatraPerc) + "</b></span>" +
    "<span><b>" + terv.napok.filter(n=>n.perc>0).length + "</b> tanulónap</span>" +
    (terv.tempo.napok >= 2
      ? "<span>a tempód: <b>" + (terv.tempo.szorzo <= 1
          ? "a becslés " + terv.tempo.szorzo.toFixed(2).replace(".",",") + "-szerese, gyorsabb vagy"
          : "a becslés " + terv.tempo.szorzo.toFixed(2).replace(".",",") + "-szerese") + "</b></span>"
      : "<span>a tempódat 2 mért nap után számolom</span>");

  /* — beállítás — */
  const b = el("mr-beallit", o);
  b.appendChild(document.createTextNode("napi keret:"));
  const mezo = document.createElement("input");
  mezo.type = "number"; mezo.min = "15"; mezo.max = "600"; mezo.step = "15";
  mezo.value = mr.percNap;
  mezo.onchange = () => {
    const v = parseInt(mezo.value, 10);
    if (v >= 15 && v <= 600){ mr.percNap = v; l.modositva = most(); mentAzonnal(); rajzolMenetrend(); }
  };
  b.appendChild(mezo);
  b.appendChild(document.createTextNode("perc · pihenőnap:"));
  const napPipa = el("mr-nap-pipa", b);
  for (let i = 0; i < 7; i++){
    const n = (i + 1) % 7;                       /* hétfővel kezdve */
    const sp = document.createElement("span");
    sp.textContent = MR_NAPROVID[n];
    sp.title = MR_NAPNEV[n];
    if (mr.pihenoNapok.includes(n)) sp.classList.add("piheno");
    sp.onclick = () => {
      mr.pihenoNapok = mr.pihenoNapok.includes(n)
        ? mr.pihenoNapok.filter(x => x !== n)
        : mr.pihenoNapok.concat(n);
      if (mr.pihenoNapok.length >= 7) mr.pihenoNapok = [];   /* mind pihenő: az nem terv */
      l.modositva = most(); mentAzonnal(); rajzolMenetrend();
    };
    napPipa.appendChild(sp);
  }

  /* — már kész (a korábbi napokon) — */
  const maKulcs = mrKulcs(new Date());
  const regebbiKesz = mr.tetelek.filter(t => t.kesz && !(t.keszDatum && mrKulcs(new Date(t.keszDatum)) === maKulcs))
                               .sort((a,b) => (b.keszDatum||"").localeCompare(a.keszDatum||""));
  if (regebbiKesz.length){
    const kd = el("mr-nap mr-mar-kesz" + (mrKeszNyitva ? " nyitva" : ""), doboz);
    const kf = el("mr-nap-fej", kd);
    el("mr-nap-nyil", kf, "›");
    el("mr-nap-datum", kf, "Már kész");
    el("mr-nap-perc", kf, regebbiKesz.length + " tétel ✓");
    kf.onclick = () => { mrKeszNyitva = !mrKeszNyitva; rajzolMenetrend(); };
    const kt = el("mr-nap-torzs", kd);
    for (const t of regebbiKesz) kt.appendChild(mrTetelElem(l, mr, t));
  }

  /* — napok — */
  if (!hatraPerc && !terv.napok.some(n => n.tetelek.length)){
    el("mr-kesz-uzenet", doboz, "Nincs több hátra. ✦");
    return;
  }

  const hatar = mr.mutatMind ? terv.napok.length : Math.min(terv.napok.length, 10);
  terv.napok.slice(0, hatar).forEach((nap, i) => {
    const nyitva = mr.nyitottNapok.includes(nap.kulcs) || (i < 2 && !mr.csukottNapok.includes(nap.kulcs));
    const d = el("mr-nap" + (nap.maiNap ? " ma" : "") + (nyitva ? " nyitva" : ""), doboz);

    const fej = el("mr-nap-fej", d);
    el("mr-nap-nyil", fej, "›");
    const dt = nap.datum;
    el("mr-nap-datum", fej,
       MR_HONAP[dt.getMonth()] + " " + dt.getDate() + ". " + MR_NAPNEV[dt.getDay()]);
    if (nap.maiNap) el("mr-nap-cimke", fej, nap.perc ? "ma" : "mai adag kész");
    else if (mrKulcs(new Date(Date.now() + NAP)) === nap.kulcs) el("mr-nap-cimke", fej, "holnap");
    el("mr-nap-perc", fej, nap.perc ? idoSzoveg(nap.perc) : "kész ✓");

    fej.onclick = () => {
      if (nyitva){
        mr.nyitottNapok = mr.nyitottNapok.filter(x => x !== nap.kulcs);
        if (!mr.csukottNapok.includes(nap.kulcs)) mr.csukottNapok.push(nap.kulcs);
      } else {
        mr.csukottNapok = mr.csukottNapok.filter(x => x !== nap.kulcs);
        if (!mr.nyitottNapok.includes(nap.kulcs)) mr.nyitottNapok.push(nap.kulcs);
      }
      ment(); rajzolMenetrend();
    };

    const torzs = el("mr-nap-torzs", d);
    for (const t of nap.tetelek) torzs.appendChild(mrTetelElem(l, mr, t));
  });

  if (terv.napok.length > hatar){
    const tov = document.createElement("button");
    tov.className = "mr-tovabb";
    tov.textContent = "további " + (terv.napok.length - hatar) + " nap mutatása";
    tov.onclick = () => { mr.mutatMind = true; rajzolMenetrend(); };
    doboz.appendChild(tov);
  } else if (mr.mutatMind && terv.napok.length > 10){
    const tov = document.createElement("button");
    tov.className = "mr-tovabb";
    tov.textContent = "csak a következő napok";
    tov.onclick = () => { mr.mutatMind = false; rajzolMenetrend(); };
    doboz.appendChild(tov);
  }
}

/* egy menetrend-tétel kipipálása — a hozzá kötött gyakorlat is vele megy */
function mrTetelPipal(t, kesz){
  t.kesz = kesz;
  t.keszDatum = kesz ? most() : null;
  if (kesz) t.kihagyva = false;
  if (t.gyakorlatId){
    const lecke = leckek.find(x => x.id === t.leckeId);
    const g = lecke && (lecke.gyakorlatok || []).find(x => x.id === t.gyakorlatId);
    if (g){ g.kesz = kesz; g.keszDatum = t.keszDatum; }
  }
}

/* a leckéhez kötött menetrend-tételek */
function mrKapcsolt(leckeId){
  const m = menetrendLecke();
  return m ? m.menetrend.tetelek.filter(t => t.leckeId === leckeId) : [];
}

function mrTetelElem(l, mr, t){
  const e = document.createElement("div");
  e.className = "mr-tetel" + (t.kesz ? " kesz" : "") + (t.kihagyva ? " kihagyva" : "");
  e.dataset.tipus = t.tipus;

  const pipa = document.createElement("div");
  pipa.className = "mr-pipa";
  pipa.textContent = t.kesz ? "✓" : "";
  pipa.title = t.kesz ? "kipipálva — kattints a visszavonáshoz" : "kész";
  pipa.onclick = () => {
    mrTetelPipal(t, !t.kesz);
    l.modositva = most();
    mentAzonnal(); rajzolMenetrend();
  };
  e.appendChild(pipa);

  const torzs = document.createElement("div");
  torzs.className = "mr-torzs";
  const cim = document.createElement("div");
  cim.className = "mr-cim"; cim.textContent = t.cim;
  if (t.leckeId && leckek.some(x => x.id === t.leckeId)){
    cim.classList.add("link");
    cim.title = "a lecke megnyitása";
    cim.onclick = () => leckereUgrik(t.leckeId);
  }
  torzs.appendChild(cim);
  const also = document.createElement("div");
  also.className = "mr-also";
  const mod = document.createElement("span");
  mod.className = "mr-modul"; mod.textContent = t.modul;
  also.appendChild(mod);
  const perc = document.createElement("span");
  perc.textContent = t.perc + " perc";
  also.appendChild(perc);
  torzs.appendChild(also);
  e.appendChild(torzs);

  /* kihagyás: nem kész, de nem is kell — végleg kikerül a tervből */
  const kih = document.createElement("span");
  kih.className = "mr-kihagy";
  kih.textContent = t.kihagyva ? "vissza" : "kihagyom";
  kih.title = t.kihagyva ? "vissza a menetrendbe" : "ez nem kell — vedd ki a tervből";
  kih.onclick = () => {
    t.kihagyva = !t.kihagyva;
    if (t.kihagyva) t.kesz = false;
    l.modositva = most();
    mentAzonnal(); rajzolMenetrend();
  };
  e.appendChild(kih);

  return e;
}

function rajzolGyakorlatok(){
  const l = aktualis();
  const doboz = $("gyakBlokk");
  doboz.innerHTML = "";
  /* a szövegbe helyezett teendő-helyőrzők kiürítése */
  for (const h of $("tartalom").querySelectorAll("[data-gyakorlat]")){
    h.innerHTML = "";
    h.contentEditable = "false";
  }
  if (!l) return;

  /* a menetrendben ehhez a leckéhez tartozó tételek — itt is kipipálhatók */
  /* a kipipált tételek egy nap után eltűnnek a leckéből — a Menetrend „Már kész” részéből visszavonhatók */
  const regiKesz = x => x.kesz && x.keszDatum && Date.now() - new Date(x.keszDatum).getTime() > NAP;
  const menetrendbol = l.menetrend ? [] : mrKapcsolt(l.id).filter(t => !t.gyakorlatId && !regiKesz(t));
  for (const mt of menetrendbol){
    const t = document.createElement("div");
    t.className = "gyak-tetel menetrendi" + (mt.kesz ? " kesz" : "");
    const pipa = document.createElement("div");
    pipa.className = "gyak-pipa";
    pipa.textContent = mt.kesz ? "✓" : "";
    pipa.title = mt.kesz ? "kipipálva — kattints a visszavonáshoz" : "kész — kipipálom a Menetrendben";
    pipa.onclick = () => {
      mrTetelPipal(mt, !mt.kesz);
      const m = menetrendLecke(); if (m) m.modositva = most();
      mentAzonnal(); rajzolGyakorlatok(); rajzolLista();
    };
    t.appendChild(pipa);
    const torzs = document.createElement("div");
    torzs.className = "gyak-torzs";
    const cim = document.createElement("div");
    cim.className = "gyak-cim"; cim.textContent = mt.cim;
    torzs.appendChild(cim);
    const also = document.createElement("div");
    also.className = "gyak-also";
    also.textContent = "Menetrend · " + mt.perc + " perc";
    torzs.appendChild(also);
    t.appendChild(torzs);
    doboz.appendChild(t);
  }

  if (!l.gyakorlatok || !l.gyakorlatok.length) return;

  for (const g of l.gyakorlatok){
    if (!g.hosszuTav && regiKesz(g)) continue;
    const t = document.createElement("div");
    t.className = "gyak-tetel" + (g.kesz ? " kesz" : "") + (g.hosszuTav ? " hosszu" : "");

    const pipa = document.createElement("div");
    pipa.className = "gyak-pipa";
    pipa.textContent = g.kesz ? "✓" : "";
    pipa.title = g.kesz ? "kipipálva — kattints a visszavonáshoz" : "kipipálás";
    pipa.onclick = () => {
      g.kesz = !g.kesz;
      g.keszDatum = g.kesz ? most() : null;
      if (g.cel > 0) g.halad = g.kesz ? g.cel : 0;
      for (const mt of mrKapcsolt(l.id)) if (mt.gyakorlatId === g.id){
        mt.kesz = g.kesz; mt.keszDatum = g.keszDatum; if (g.kesz) mt.kihagyva = false;
      }
      l.modositva = most();
      mentAzonnal(); rajzolGyakorlatok(); rajzolLista();
    };
    t.appendChild(pipa);

    const torzs = document.createElement("div");
    torzs.className = "gyak-torzs";

    const cim = document.createElement("div");
    cim.className = "gyak-cim";
    cim.contentEditable = "true"; cim.spellcheck = true;
    cim.textContent = g.cim;
    cim.oninput = () => { g.cim = cim.textContent; l.modositva = most(); ment(); };
    torzs.appendChild(cim);

    const also = document.createElement("div");
    also.className = "gyak-also";

    /* számlálós teendő: − 12 / 30 + */
    if (g.cel > 0){
      const szamlalo = document.createElement("span");
      szamlalo.className = "gyak-szamlalo";

      const le = document.createElement("button");
      le.className = "szam-gomb"; le.textContent = "−";
      le.onclick = () => allitHalad(l, g, -1);

      const allas = document.createElement("b");
      allas.textContent = g.halad + " / " + g.cel;

      const fel = document.createElement("button");
      fel.className = "szam-gomb"; fel.textContent = "+";
      fel.onclick = () => allitHalad(l, g, 1);

      szamlalo.appendChild(le); szamlalo.appendChild(allas); szamlalo.appendChild(fel);
      also.appendChild(szamlalo);

      const sav = document.createElement("span");
      sav.className = "gyak-sav";
      const belso = document.createElement("i");
      belso.style.width = Math.round(Math.min(g.halad / g.cel, 1) * 100) + "%";
      sav.appendChild(belso);
      also.appendChild(sav);
    }

    if (g.url){
      const helyi = g.url.startsWith("/") || g.url.startsWith("~") || g.url.startsWith("file://");
      const link = document.createElement("span");
      link.className = "gyak-link";
      link.textContent = helyi ? ("📄 " + fajlNev(g.url)) : "▶ megnyitás";
      link.title = g.url;
      link.onclick = () => megnyitKivul(g.url);
      also.appendChild(link);
    }

    /* a nyers útvonal csak szerkesztés közben látszik — különben elég a fájlnév */
    if (g.linkSzerkeszt){
      const url = document.createElement("span");
      url.className = "gyak-url";
      url.contentEditable = "true"; url.spellcheck = false;
      url.textContent = g.url;
      url.oninput = () => { g.url = url.textContent.trim(); l.modositva = most(); ment(); };
      url.onblur = () => { g.linkSzerkeszt = false; rajzolGyakorlatok(); };
      also.appendChild(url);
      setTimeout(() => url.focus(), 0);
    } else {
      const hozzaad = document.createElement("span");
      hozzaad.className = "gyak-torolG";
      hozzaad.textContent = g.url ? "csere" : "+ link";
      hozzaad.onclick = () => { g.linkSzerkeszt = true; rajzolGyakorlatok(); };
      also.appendChild(hozzaad);
    }

    const kitolto = document.createElement("span");
    kitolto.style.flex = "1";
    also.appendChild(kitolto);

    if (g.kesz && g.keszDatum){
      const mikor = document.createElement("span");
      mikor.textContent = "kész · " + rovidDatum(g.keszDatum);
      also.appendChild(mikor);
    }

    /* törlés két lépésben — a link mellett ülő egykattintásos törlés adatvesztést okozott */
    const torolG = document.createElement("span");
    torolG.className = "gyak-torolG torol-tetel";
    torolG.textContent = g.torlesVar ? "biztos?" : "×";
    torolG.title = g.torlesVar ? "kattints újra a törléshez" : "teendő törlése";
    if (g.torlesVar) torolG.classList.add("megerosites");
    torolG.onclick = () => {
      if (!g.torlesVar){
        g.torlesVar = true;
        rajzolGyakorlatok();
        setTimeout(() => { g.torlesVar = false; rajzolGyakorlatok(); }, 3500);
        return;
      }
      l.gyakorlatok = l.gyakorlatok.filter(x => x.id !== g.id);
      l.modositva = most();
      mentAzonnal(); rajzolGyakorlatok(); rajzolLista();
    };
    also.appendChild(torolG);

    torzs.appendChild(also);
    t.appendChild(torzs);

    /* ha a szövegben van hozzá helyőrző, oda kerül — különben a lecke tetejére */
    const helyorzo = $("tartalom").querySelector('[data-gyakorlat="' + g.id + '"]');
    if (helyorzo) helyorzo.appendChild(t);
    else doboz.appendChild(t);
  }
}

function allitHalad(l, g, irany){
  g.halad = Math.max(0, Math.min(g.cel, g.halad + irany));
  const eddigKesz = g.kesz;
  g.kesz = g.halad >= g.cel;
  if (g.kesz && !eddigKesz) g.keszDatum = most();
  if (!g.kesz) g.keszDatum = null;
  l.modositva = most();
  mentAzonnal(); rajzolGyakorlatok(); rajzolLista();
}

function ujGyakorlat(){
  const l = aktualis(); if (!l) return;
  if (!l.gyakorlatok) l.gyakorlatok = [];
  l.gyakorlatok.push({ id: ujAzonosito("g"), cim: "Gyakorlat", url: "", kesz: false, keszDatum: null });
  l.modositva = most();
  mentAzonnal(); rajzolGyakorlatok(); rajzolLista();
}

/* ===== SZÖVEGBE ÁGYAZOTT LINKEK (táblázatban is működnek) ===== */
function linkKotesek(){
  const mezo = $("tartalom");
  mezo.addEventListener("click", e => {
    /* lenyitás a nyolc ág sorain */
    const agSor = e.target.closest("tr.ag-sor");
    if (agSor){
      const nev = agSor.dataset.kinyit;
      const al = mezo.querySelector('tr.al-sor[data-szulo="' + nev + '"]');
      if (al){
        const nyit = al.classList.contains("rejtve");
        al.classList.toggle("rejtve", !nyit);
        agSor.classList.toggle("nyitva", nyit);
        return;
      }
    }
    const szakasz = e.target.closest("#tartalom section.csukhato > h2");
    if (szakasz){ szakasz.parentElement.classList.toggle("nyitva"); return; }
    const fej = e.target.closest(".alista li.nyilo > .fej, .kvizracs li.nyilo > .fej");
    if (fej){ fej.parentElement.classList.toggle("nyitva"); return; }
    const abra = e.target.closest("#tartalom figure.abra");
    if (abra){
      e.preventDefault();
      const kep = abra.querySelector("img");
      const fel = abra.querySelector("figcaption");
      nagyitoEgy(kep && kep.src, fel && fel.textContent);
      return;
    }
    const galeriaKep = e.target.closest(".pozracs figure");
    if (galeriaKep){
      e.preventDefault();
      const racs = galeriaKep.closest(".pozracs");
      const mind = Array.from(racs.querySelectorAll("figure"));
      nagyitoNyit(racs, mind.indexOf(galeriaKep));
      return;
    }
    const leckeLink = e.target.closest("[data-lecke]");
    if (leckeLink){
      e.preventDefault();
      leckereUgrik(leckeLink.dataset.lecke, leckeLink.dataset.horgony || "");
      return;
    }
    const par = e.target.closest("[data-parosito]");
    if (par){
      e.preventDefault();
      const l = aktualis();
      if (l) inditParositot(l, par.dataset.parosito);
      return;
    }
    const tuk = e.target.closest("[data-tukor]");
    if (tuk){
      e.preventDefault();
      const l = aktualis();
      if (l) inditTukor(l, tuk.dataset.tukor);
      return;
    }
    const csop = e.target.closest("[data-csoport]");
    if (csop){
      e.preventDefault();
      const l = aktualis();
      if (l) inditCsoportot(l, csop.dataset.csoport);
      return;
    }
    const ugras = e.target.closest("[data-ugras]");
    if (ugras){
      e.preventDefault();
      const c = mezo.querySelector('[data-horgony="' + ugras.dataset.ugras + '"]');
      if (c) c.scrollIntoView({ block: "start", behavior: "smooth" });
      return;
    }
    const cel = e.target.closest(".utlink");
    if (!cel) return;
    e.preventDefault();
    megnyitKivul(cel.dataset.ut || cel.textContent.trim());
  });
}

/* a hátlapon: kik a testvérei, és hol nézhet utána */
function rajzolCsaladot(kartya, tetel){
  const nev = (tetel.kerdes.kerdes || "").trim();
  if (!nev) return;
  const csaladok = csaladjai(nev);
  if (!csaladok.length) return;
  const cs = csaladok[0];

  const doboz = document.createElement("div");
  doboz.className = "csalad";

  const cim = document.createElement("div");
  cim.className = "csalad-cim"; cim.textContent = cs;
  doboz.appendChild(cim);

  sor.className = "csalad-sor";

    g.className = "testver" + (tag === nev ? " ez" : "");
    g.textContent = tag;
    const van = kerdesNeve(tetel.lecke, tag);
    if (!van && tag !== nev){ g.classList.add("hianyzik"); g.title = "nincs kártya ehhez"; }
    else if (tag !== nev){
      g.onclick = () => {                       /* ugrás a testvér kártyájára, a játékon belül */
        const i = gyakorlasSor.tetelek.findIndex(t => (t.kerdes.kerdes || "").trim() === tag);
        if (i >= 0){ gyakorlasSor.mutato = i; gyakorlasSor.valaszLatszik = true; rajzolGyakorlas(); }
        else {
          gyakorlasSor.tetelek.splice(gyakorlasSor.mutato + 1, 0, { lecke: tetel.lecke, kerdes: van });
          gyakorlasSor.mutato++; gyakorlasSor.valaszLatszik = true; rajzolGyakorlas();
        }
      };
    }
    sor.appendChild(g);
  }
  doboz.appendChild(sor);

  kartya.appendChild(doboz);
}

/* ===== JUTALOM: virágoskert a játék végén ===== */
const SZIROM_SZINEK = [
  ["#ff5aa4","#ffd0e6"], ["#a06cff","#e2d4ff"], ["#4fa8ff","#cfe6ff"],
  ["#ff9142","#ffe0c4"], ["#3fbf8f","#c9f0e2"], ["#e0455e","#ffd2d8"],
  ["#f2c14e","#fff0c9"], ["#6b5ce7","#ddd8ff"],
];

/* Szétszórt virágcsokor: szárak nélkül, pillangókkal és csillanásokkal.
   Minden elem a vászonon BELÜL marad — a sugarát beleszámítjuk a helyébe. */
const UNNEP_DB = 29, PILLANGO_DB = 2;

function szorasSvg(db){
  const szel = 640, mag = 300;
  const elemek = [];

  const kever = (n) => {
    const t = [];
    for (let i = 1; i <= n; i++) t.push(i);
    for (let i = t.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [t[i], t[j]] = [t[j], t[i]];
    }
    return t;
  };
  const viragok = kever(UNNEP_DB);

  /* Valódi szórás: véletlen hely, és csak akkor fogadjuk el, ha nem fedi túlságosan
     a korábbiakat. Ha sokadszorra sem talál helyet, engedünk a távolságból. */
  function helyet(meret){
    for (let proba = 0; proba < 160; proba++){
      const lazit = 1 - Math.min(.45, proba / 220);
      const f = meret / 2;
      const x = f + 2 + Math.random() * (szel - meret - 4);
      const y = f + 2 + Math.random() * (mag - meret - 4);
      let jo = true;
      for (const e of elemek){
        const tav = Math.hypot(x - e.x, y - e.y);
        if (tav < (meret + e.meret) * 0.42 * lazit){ jo = false; break; }
      }
      if (jo) return { x, y };
    }
    return { x: szel/2, y: mag/2 };
  }

  for (let i = 0; i < db; i++){
    const meret = 62 + Math.random() * 52;              /* 62–114 px */
    const h = helyet(meret);
    elemek.push({ tipus: "virag", kep: "unnep" + viragok[i % viragok.length],
                  x: h.x, y: h.y, meret, fordul: (Math.random() - .5) * 50,
                  keses: i * 0.11 });
  }

  const pdb = db >= 8 ? 3 : (db >= 5 ? 2 : 1);
  for (let i = 0; i < pdb; i++){
    const meret = 44 + Math.random() * 26;
    const h = helyet(meret);
    elemek.push({ tipus: "pillango", kep: "pillango" + ((i % PILLANGO_DB) + 1),
                  x: h.x, y: h.y, meret, fordul: (Math.random() - .5) * 44,
                  keses: 0.5 + i * 0.18 });
  }

  /* a nagyobbak hátulra, hogy a kisebbek ne tűnjenek el mögöttük */
  elemek.sort((a, b) => b.meret - a.meret);

  let ki = "";
  for (const e of elemek){
    const f = e.meret / 2;
    ki += '<g class="bimbo" style="animation-delay:' + e.keses.toFixed(2) +
          's; transform-origin:' + Math.round(e.x) + 'px ' + Math.round(e.y) + 'px">' +
          '<image href="kepek/' + e.kep + '.png" x="' + Math.round(e.x - f) + '" y="' +
          Math.round(e.y - f) + '" width="' + Math.round(e.meret) + '" height="' + Math.round(e.meret) +
          '" transform="rotate(' + e.fordul.toFixed(1) + ' ' + Math.round(e.x) + ' ' + Math.round(e.y) +
          ')" preserveAspectRatio="xMidYMid meet"/></g>';
  }
  return '<svg viewBox="0 0 ' + szel + ' ' + mag + '" preserveAspectRatio="xMidYMid meet">' + ki + '</svg>';
}

function kertSvg(db){ return szorasSvg(db); }

function rajzolJutalmat(kartya, gy){
  /* a nap első befejezett köre után jár a virág — mint a Duolingón */
  setTimeout(napiKoszones, 900);
  const osszes = gy.tetelek.length;
  const arany = osszes ? gy.jo / osszes : 0;
  /* minél több ment, annál több virág nyílik ki: 6 → 20 */
  const virag = Math.max(6, Math.min(20, Math.round(6 + arany * 14)));

  const kert = document.createElement("div");
  kert.className = "kert";
  kert.innerHTML = kertSvg(virag);
  kartya.appendChild(kert);
  /* ha bármiért elmaradna a kinyílás, ettől a virágok mindenképp láthatóvá válnak */
  setTimeout(() => kert.classList.add("kesz"), 3000);

  const cim = document.createElement("div");
  cim.className = "unnep-cim";
  cim.textContent = arany === 1 ? "Hibátlan!" : (arany >= .7 ? "Szép munka!" : "Végigcsináltad!");
  kartya.appendChild(cim);

  const alcim = document.createElement("div");
  alcim.className = "unnep-alcim";
  alcim.style.whiteSpace = "pre-line";
  if (gy.tetelek.some(t => t.kerdes.valasztos)){
    const sz = Math.round(arany * 100);
    alcim.textContent = gy.jo + " / " + osszes + " jó · " + sz + "%\n" +
      (sz >= 80 ? "Ez átmenne a vizsgán (80% kell) ✦" : "A vizsgához 80% kell — ami nem ment, az újra előjön.");
    kartya.appendChild(alcim);
    return;
  }
  alcim.textContent = osszes + " kártya · ment " + gy.jo + " · nem ment " + gy.rossz +
    (gy.rossz ? "\nAmi nem ment, azt ma újra előhozza." : "\nEzeket egy ideig nem kell nézned.");
  kartya.appendChild(alcim);
}

  "Yama": ["Ahimsa","Satya","Asteya","Brahmacharya","Aparigraha"],

                  "Manipura Chakra","Swadisthana Chakra","Muladhara Chakra"],

};

function csaladjai(nev){
  return Object.keys(CSALADOK).filter(cs => CSALADOK[cs].indexOf(nev) >= 0);
}

/* egy fogalom kártyája a megadott leckében */
/* a lecke fő játéka: ami nincs külön csoportban — azoknak saját gombjuk van */
function foKartyak(lecke){
  const mind = (lecke.kerdesek || []).filter(k => !k.csakParosito && !k.tukor);
  const csoportnelkuli = mind.filter(k => !k.csoport);
  /* ha minden kártya csoportba tartozik, a nagy gomb az egészet játssza */
  return csoportnelkuli.length ? csoportnelkuli : mind;
}

function kerdesNeve(lecke, nev){
  return (lecke.kerdesek || []).find(k => (k.kerdes || "").trim() === nev) || null;
}

/* ===== HALADÁS: mennyit tanultál ===== */
let utolsoValaszIdeje = 0;

function maiKulcs(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}

/* Egy megválaszolt kártya: gyűjtjük a darabszámot és a ráfordított időt.
   A két válasz közti szünetet 2 percnél tovább nem számoljuk — az már nem tanulás. */
/* a megnyitás önmagában is tanulás — a széria ettől is nő */
function napotJelol(){
  const kulcs = maiKulcs();
  if (!haladas[kulcs]) haladas[kulcs] = { ment: 0, mp: 0 };
  if (!haladas[kulcs].nyitva){ haladas[kulcs].nyitva = true; mentAzonnal(); }
}

function naplozHaladast(ment){
  const kulcs = maiKulcs();
  if (!haladas[kulcs]) haladas[kulcs] = { ment: 0, mp: 0 };
  if (ment) haladas[kulcs].ment++;
  const most_ = Date.now();
  if (utolsoValaszIdeje){
    haladas[kulcs].mp += Math.min(120, Math.round((most_ - utolsoValaszIdeje) / 1000));
  }
  utolsoValaszIdeje = most_;
}

function szeriaHossza(){
  const d = new Date();
  let db = 0;
  for (let i = 0; i < 400; i++){
    const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
              String(d.getDate()).padStart(2, "0");
    const h = haladas[k];
    const van = !!h && (h.ment > 0 || h.nyitva);
    if (van) db++;
    else if (i > 0) break;          /* a mai nap még lehet üres, az nem szakítja meg */
    d.setDate(d.getDate() - 1);
  }
  return db;
}

function osszesPerc(){
  let mp = 0;
  for (const k in haladas) mp += haladas[k].mp || 0;
  return Math.round(mp / 60);
}

function idoSzoveg(perc){
  if (perc < 60) return perc + " perc";
  const o = Math.floor(perc / 60), p = perc % 60;
  return o + " óra" + (p ? " " + p + " perc" : "");
}

function napiVirag(){
  const ma = maiKulcs();
  if (!haladas.napiVirag || haladas.napiVirag.nap !== ma){
    haladas.napiVirag = { nap: ma, i: 1 + Math.floor(Math.random() * UNNEP_DB) };
  }
  return "kepek/unnep" + haladas.napiVirag.i + ".png";
}

function rajzolHaladast(){
  const doboz = $("haladas");
  if (!doboz) return;
  const ma = haladas[maiKulcs()] || { ment: 0, mp: 0 };
  const szeria = szeriaHossza();
  const ossz = osszesPerc();

  doboz.innerHTML = "";
  const kep = document.createElement("img");
  kep.className = "haladas-virag"; kep.src = napiVirag(); kep.alt = "";
  doboz.appendChild(kep);

  const jobb = document.createElement("div");
  jobb.className = "haladas-szoveg";

  const fo = document.createElement("div");
  fo.className = "fo";
  fo.textContent = szeria;                /* csak a szám — a virág mondja meg, miről van szó */
  jobb.appendChild(fo);

  const reszek = [];
  if (ma.ment) reszek.push("ma " + ma.ment + " kártya");
  if (ossz) reszek.push(idoSzoveg(ossz));
  const alsor = document.createElement("div");
  alsor.className = "alsor";
  alsor.textContent = reszek.length ? reszek.join(" · ") : "ma még nem gyakoroltál";
  jobb.appendChild(alsor);

  doboz.appendChild(jobb);
}

/* ===== PÁROSÍTÓ JÁTÉK: húzd a magyar szót a megfelelő angol alá ===== */
function inditParositot(lecke, csoport){
  /* a párosító a saját kártyáiból dolgozik: fent az angol, lent a magyar */
  const sajat = (lecke.kerdesek || []).filter(k => k.csoport === csoport && k.csakParosito);
  const parok = sajat.map(k => {
    const sorok = (k.valasz || "").split("\n").map(x => x.trim()).filter(Boolean);
    return { jobb: (k.kerdes || "").trim(), bal: sorok[0] || "", also: sorok[1] || "" };
  }).filter(x => x.bal && x.jobb);
  if (parok.length < 2) return;
  gyakorlasSor = { parosito: true, parok, cim: csoport, kesz: 0, hiba: 0 };
  rajzolFo();
}

function keverve(t){
  const m = t.slice();
  for (let i = m.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [m[i], m[j]] = [m[j], m[i]];
  }
  return m;
}

function rajzolParositot(){
  const gy = gyakorlasSor;
  const doboz = $("gyKartya"); doboz.innerHTML = "";
  const sav = $("gySav"); sav.innerHTML = "";
  $("gyHalado").style.width = Math.round(gy.kesz / gy.parok.length * 100) + "%";
  $("gySzamlalo").textContent = gy.kesz + " / " + gy.parok.length;

  const kartya = document.createElement("div");
  kartya.className = "gy-belso";
  doboz.appendChild(kartya);

  if (gy.kesz >= gy.parok.length){
    rajzolJutalmat(kartya, { tetelek: gy.parok, jo: gy.parok.length - gy.hiba, rossz: gy.hiba });
    const sor = document.createElement("div"); sor.className = "gy-gombsor";
    sor.appendChild(gomb("gy-gomb fo", "Vissza a leckéhez", () => { gyakorlasSor = null; rajzol(); }));
    sor.appendChild(gomb("gy-gomb halk", "Még egyszer", () => {
      gyakorlasSor = { parosito: true, parok: gy.parok, cim: gy.cim, kesz: 0, hiba: 0 };
      rajzolFo();
    }));
    sav.appendChild(sor);
    return;
  }

  kartya.appendChild(szoveges("gy-sugo", gy.cim));
  kartya.appendChild(szoveges("gy-kerdes kicsi", "Húzd a szót a párja alá"));

  const tabla = document.createElement("div");
  tabla.className = "par-tabla";

  const celsor = document.createElement("div");
  celsor.className = "par-celok";
  for (const p of keverve(gy.parok)){
    const cel = document.createElement("div");
    cel.className = "par-cel"; cel.dataset.par = p.jobb;
    const c = document.createElement("div"); c.className = "par-cimke"; c.textContent = p.jobb;
    const h = document.createElement("div"); h.className = "par-hely";
    cel.appendChild(c); cel.appendChild(h);
    celsor.appendChild(cel);
  }
  tabla.appendChild(celsor);

  const keszlet = document.createElement("div");
  keszlet.className = "par-keszlet";
  for (const p of keverve(gy.parok)){
    const chip = document.createElement("div");
    chip.className = "par-chip"; chip.dataset.par = p.jobb;
    chip.textContent = p.bal;
    if (p.also){
      const a = document.createElement("small");
      a.textContent = p.also;
      chip.appendChild(a);
    }
    keszlet.appendChild(chip);
  }
  tabla.appendChild(keszlet);
  kartya.appendChild(tabla);
  parositoKotesek(tabla);

  sav.appendChild(gomb("gy-gomb halk", "Kilépés", () => { gyakorlasSor = null; rajzol(); }));
  sav.appendChild(szoveges("gy-sugo", "húzd a helyére — vagy kattints a szóra, aztán a helyére"));
}

function parositoKotesek(tabla){
  let fogott = null, arnyek = null, dx = 0, dy = 0;

  const helyre = (chip, cel) => {
    const gy = gyakorlasSor;
    if (!cel || cel.dataset.par !== chip.dataset.par){
      chip.classList.remove("valasztva");
      chip.classList.add("rossz");
      gy.hiba++;
      setTimeout(() => chip.classList.remove("rossz"), 450);
      return;
    }
    chip.classList.remove("valasztva");
    chip.classList.add("jo");
    cel.querySelector(".par-hely").appendChild(chip);
    cel.classList.add("kesz");
    gy.kesz++;
    if (gy.kesz >= gy.parok.length) setTimeout(rajzolParositot, 520);
  };

  tabla.addEventListener("mousedown", e => {
    const chip = e.target.closest(".par-chip");
    if (!chip || chip.classList.contains("jo")) return;
    e.preventDefault();
    const r = chip.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    arnyek = chip.cloneNode(true);
    arnyek.className = "par-chip huzott";
    arnyek.style.width = r.width + "px";
    arnyek.style.left = r.left + "px"; arnyek.style.top = r.top + "px";
    document.body.appendChild(arnyek);
    chip.classList.add("huzas-kozben");
    fogott = chip;
  });

  document.addEventListener("mousemove", e => {
    if (!arnyek) return;
    arnyek.style.left = (e.clientX - dx) + "px";
    arnyek.style.top = (e.clientY - dy) + "px";
    const alatta = document.elementFromPoint(e.clientX, e.clientY);
    for (const c of tabla.querySelectorAll(".par-cel")) c.classList.remove("celzott");
    const cel = alatta && alatta.closest && alatta.closest(".par-cel");
    if (cel && !cel.classList.contains("kesz")) cel.classList.add("celzott");
  });

  document.addEventListener("mouseup", e => {
    if (!fogott) return;
    const chip = fogott; fogott = null;
    chip.classList.remove("huzas-kozben");
    if (arnyek){ arnyek.remove(); arnyek = null; }
    for (const c of tabla.querySelectorAll(".par-cel")) c.classList.remove("celzott");
    const alatta = document.elementFromPoint(e.clientX, e.clientY);
    const cel = alatta && alatta.closest && alatta.closest(".par-cel");
    if (cel && !cel.classList.contains("kesz")) helyre(chip, cel);
  });

  /* kattintós út: szó kijelölése, majd a hely */
  tabla.addEventListener("click", e => {
    const chip = e.target.closest(".par-chip");
    if (chip && !chip.classList.contains("jo")){
      const volt = tabla.querySelector(".par-chip.valasztva");
      if (volt && volt !== chip) volt.classList.remove("valasztva");
      chip.classList.toggle("valasztva");
      return;
    }
    const cel = e.target.closest(".par-cel");
    const kijelolt = tabla.querySelector(".par-chip.valasztva");
    if (cel && kijelolt && !cel.classList.contains("kesz")) helyre(kijelolt, cel);
  });
}

/* ===== KERESÉS a leckék szövegében és a kártyákon ===== */
let talalatLista = [], talalatHol = 0;

function keresoNyit(kezdo){
  const kicsi = $("keresoMezo").getBoundingClientRect();
  const sav = $("keresoSav"), tal = $("keresoTalalatok");
  const bal = Math.round(kicsi.left);
  const szeles = Math.max(240, Math.round(window.innerWidth - bal * 2));  /* jobbról ugyanannyi */
  const magas = Math.round(kicsi.height);                 /* pontosan olyan vékony marad */

  sav.style.left = bal + "px";
  sav.style.top = Math.round(kicsi.top) + "px";
  sav.style.height = magas + "px";

  tal.style.left = bal + "px";
  tal.style.width = szeles + "px";
  tal.style.top = Math.round(kicsi.top + magas + 10) + "px";
  tal.style.bottom = "18px";

  $("keresoReteg").classList.remove("rejtve");
  /* a kis mező szélességéről indul, onnan nyúlik ki — kényszerített újraszámolással,
     hogy az animáció biztosan elinduljon */
  sav.style.transition = "none";
  sav.style.width = Math.round(kicsi.width) + "px";
  void sav.offsetWidth;
  sav.style.transition = "";
  sav.style.width = szeles + "px";

  const m = $("keresoNagy");
  if (typeof kezdo === "string") m.value = kezdo;
  m.focus(); m.select();

}

/* HTML → olvasható szöveg, hogy ne a jelölőkben keressünk */
function csupaszSzoveg(html){
  const d = document.createElement("div");
  d.innerHTML = html || "";
  for (const x of d.querySelectorAll("script, style")) x.remove();
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}

function kornyezet(szoveg, hol, minta){
  const elo = Math.max(0, hol - 48);
  const utan = Math.min(szoveg.length, hol + minta.length + 68);
  const resz = (elo > 0 ? "…" : "") + szoveg.slice(elo, utan) + (utan < szoveg.length ? "…" : "");
  const eltolas = hol - elo + (elo > 0 ? 1 : 0);
  return { resz, eltolas };
}

function keresoFut(){
  const minta = $("keresoNagy").value.trim();
  const valaszbanIs = $("keresoValaszban").checked;
  const doboz = $("keresoTalalatok");
  doboz.innerHTML = "";
  talalatLista = []; talalatHol = 0;
  if (minta.length < 2){
    doboz.innerHTML = '<div class="kereso-ures">Írj legalább két betűt.</div>';
    return;
  }
  const kicsi = lapit(minta);

  for (const l of leckek){
    const sajat = [];

    const szoveg = csupaszSzoveg(l.html);
    const egysz = lapit(szoveg);
    let hol = egysz.indexOf(kicsi), db = 0;
    while (hol >= 0 && db < 3){
      sajat.push({ tipus: "szöveg", lecke: l, ...kornyezet(szoveg, hol, minta), minta });
      hol = egysz.indexOf(kicsi, hol + kicsi.length); db++;
    }

    for (const k of (l.kerdesek || [])){
      const hol1 = lapit(k.kerdes).indexOf(kicsi);
      const hol2 = valaszbanIs ? lapit(k.valasz).indexOf(kicsi) : -1;
      if (hol1 < 0 && hol2 < 0) continue;
      const forras = hol1 >= 0 ? k.kerdes : k.valasz;
      const h = hol1 >= 0 ? hol1 : hol2;
      sajat.push({ tipus: "kártya", lecke: l, kerdes: k, ...kornyezet(forras, h, minta), minta });
      if (sajat.length > 12) break;
    }

    if (!sajat.length) continue;
    const cim = document.createElement("div");
    cim.className = "kereso-lecke";
    cim.textContent = l.cim.trim() + (l.rejtett ? " · rejtett" : "");
    doboz.appendChild(cim);
    for (const t of sajat){
      const g = document.createElement("button");
      g.className = "kereso-talalat";
      const elo = t.resz.slice(0, t.eltolas);
      const kiemelt = t.resz.substr(t.eltolas, minta.length);
      const utan = t.resz.slice(t.eltolas + minta.length);
      g.innerHTML = '<span class="tipus">' + t.tipus + '</span>' +
        szovegEscape(elo) + "<mark>" + szovegEscape(kiemelt) + "</mark>" + szovegEscape(utan);
      g.onclick = () => talalatraUgrik(t);
      doboz.appendChild(g);
      talalatLista.push({ elem: g, adat: t });
    }
  }
  if (!talalatLista.length){
    doboz.innerHTML = '<div class="kereso-ures">Erre nincs találat.</div>';
    return;
  }
  talalatKijelol(0);
}

function talalatKijelol(i){
  if (!talalatLista.length) return;
  talalatHol = (i + talalatLista.length) % talalatLista.length;
  talalatLista.forEach((t, n) => t.elem.classList.toggle("kijelolt", n === talalatHol));
  talalatLista[talalatHol].elem.scrollIntoView({ block: "nearest" });
}

function talalatraUgrik(t){
  keresoZar();
  if (t.tipus === "kártya"){
    kivalasztottId = t.lecke.id; aktivFul = "kerdesek"; gyakorlasSor = null; rajzol();
    return;
  }
  kurzortElenged();
  kivalasztottId = t.lecke.id; aktivFul = "vazlat"; gyakorlasSor = null; rajzol();
  setTimeout(() => kiemelEsOdagorget(t.minta), 80);
}

/* a találat megkeresése a megnyitott leckében, kiemelve pár másodpercre */
function kiemelEsOdagorget(minta){
  const mezo = $("tartalom");
  const kicsi = lapit(minta);
  const seta = document.createTreeWalker(mezo, NodeFilter.SHOW_TEXT);
  let csomo;
  while ((csomo = seta.nextNode())){
    const hol = lapit(csomo.nodeValue).indexOf(kicsi);
    if (hol < 0) continue;
    const tart = document.createRange();
    tart.setStart(csomo, Math.min(hol, csomo.nodeValue.length));
    tart.setEnd(csomo, Math.min(hol + minta.length, csomo.nodeValue.length));
    const jel = document.createElement("span");
    jel.className = "talalat-kiemel";
    try { tart.surroundContents(jel); } catch(e){ return; }
    jel.scrollIntoView({ block: "center", behavior: "smooth" });
    setTimeout(() => {
      const szulo = jel.parentNode;
      if (!szulo) return;
      while (jel.firstChild) szulo.insertBefore(jel.firstChild, jel);
      szulo.removeChild(jel); szulo.normalize();
    }, 2600);
    return;
  }
}
