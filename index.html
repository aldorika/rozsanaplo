<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Rózsanapló</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rózsanapló">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6d9ec">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  /* bi paletta: magenta -> lila -> azúr */
  --magenta:  #ff5aa4;
  --lila:     #a06cff;
  --azur:     #4fa8ff;
  --cian:     #6ee9ff;

  --lap:      #fbeef6;
  --tinta:    #33203a;
  --halk:     #8a6f8c;
  --halkabb:  #ab90ad;
  --valaszto: rgba(120, 80, 140, .16);
  --kijelol:  #d1418a;
}

*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; overflow:hidden; }

body{
  font:14px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  color:var(--tinta);
  background:
    radial-gradient(60% 50% at 12% 8%,  rgba(255,143,196,.75), transparent 62%),
    radial-gradient(55% 48% at 88% 16%, rgba(168,120,255,.6),  transparent 62%),
    radial-gradient(60% 52% at 78% 92%, rgba(96,166,255,.55),  transparent 64%),
    radial-gradient(50% 44% at 18% 88%, rgba(255,190,230,.6),  transparent 62%),
    linear-gradient(150deg, #f6d9ec 0%, #e6cdf2 45%, #d3d9f5 100%);
  -webkit-user-select:none; user-select:none;
}

.kulso{ height:100vh; display:flex; flex-direction:column; padding:30px 16px 16px; }

.lap{
  position:relative; flex:1; min-height:0; display:flex;
  border-radius:20px; overflow:hidden;
  background:linear-gradient(168deg, #fdf4fa 0%, var(--lap) 46%, #f0eafc 78%, #e8effb 100%);
  box-shadow:
    0 22px 60px rgba(120,60,140,.24),
    0 0 0 1px rgba(255,255,255,.65),
    0 0 30px rgba(255,255,255,.4) inset;
}

/* ===================== A VILÁG: kollázs ===================== */
.vilag{ position:absolute; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.mu{ position:absolute; }

/* színfoltok, amik lassan sodródnak */
.folt{ position:absolute; border-radius:50%; filter:blur(50px); will-change:transform; }
.f1{ width:44%; height:50%; left:-10%;  top:-14%;    background:radial-gradient(circle, rgba(255,110,180,.8), transparent 68%); opacity:.6; animation:sodrodas1 52s ease-in-out infinite; }
.f2{ width:50%; height:54%; right:-14%; top:-10%;    background:radial-gradient(circle, rgba(150,96,255,.72), transparent 68%); opacity:.58; animation:sodrodas2 64s ease-in-out infinite; }
.f3{ width:54%; height:56%; right:-12%; bottom:-18%; background:radial-gradient(circle, rgba(70,150,255,.6), transparent 68%);  opacity:.55; animation:sodrodas3 58s ease-in-out infinite; }
.f4{ width:36%; height:40%; left:14%;   bottom:-16%; background:radial-gradient(circle, rgba(255,160,210,.6), transparent 70%); opacity:.5;  animation:sodrodas2 46s ease-in-out infinite reverse; }
@keyframes sodrodas1{ 0%,100%{ transform:translate(0,0) scale(1) } 50%{ transform:translate(4%,3%) scale(1.12) } }
@keyframes sodrodas2{ 0%,100%{ transform:translate(0,0) scale(1) } 50%{ transform:translate(-5%,4%) scale(1.09) } }
@keyframes sodrodas3{ 0%,100%{ transform:translate(0,0) scale(1) } 50%{ transform:translate(3%,-4%) scale(1.14) } }

/* tépett szélű papírcsík a bal oldalon */
.papir{ left:-14px; top:-2%; width:334px; height:106%; opacity:.9; transform:rotate(-.45deg); filter:drop-shadow(6px 0 12px rgba(120,70,140,.14)); }

/* tintafoltok */
.tintafolt{ mix-blend-mode:multiply; }
.tf1{ right:3%;  top:-4%;   width:330px; height:270px; opacity:.3; }
.tf2{ right:19%; bottom:2%; width:290px; height:230px; opacity:.26; }
.tf3{ left:30%;  top:-8%;   width:250px; height:200px; opacity:.2;  }
.tf4{ right:40%; bottom:-6%; width:210px; height:170px; opacity:.17; }

/* préselt virág, kromatikus széllel */
.virag{ right:-128px; top:-142px; width:470px; height:470px; transform:rotate(13deg); opacity:.66; animation:lelegzet 30s ease-in-out infinite; }
.virag2{ right:9%; bottom:-136px; width:320px; height:320px; transform:rotate(-26deg); opacity:.34; animation:lelegzet 38s ease-in-out infinite reverse; }
.virag3{ left:16%; top:-92px; width:210px; height:210px; transform:rotate(-8deg); opacity:.26; }
@keyframes lelegzet{ 0%,100%{ opacity:.5 } 50%{ opacity:.78 } }

/* pillangók */
.pillango{ animation:szall 24s ease-in-out infinite; }
.p1{ width:200px; height:180px; right:24%; top:20%; opacity:.66; transform:rotate(-8deg); }
.p2{ width:136px; height:122px; right:7%;  bottom:24%; opacity:.6; transform:rotate(19deg); animation-duration:31s; animation-direction:reverse; }
.p3{ width:96px;  height:86px;  left:39%;  bottom:9%;  opacity:.48; transform:rotate(-14deg); animation-duration:37s; }
@keyframes szall{
  0%,100%{ translate:0 0; rotate:0deg }
  33%    { translate:-16px -20px; rotate:-4deg }
  66%    { translate:12px -9px; rotate:3deg }
}

/* nyomdai foltok: raszter, kocka, milliméterpapír */
.raszter{ opacity:.3; }
.r1{ width:112px; height:112px; left:24%;  top:1%;    transform:rotate(-8deg); }
.r2{ width:96px;  height:96px;  right:13%; bottom:13%; transform:rotate(11deg); }
.r3{ width:78px;  height:78px;  left:31%;  bottom:20%; transform:rotate(4deg); }

.kocka{ opacity:.2; }
.k1{ width:104px; height:104px; right:1.5%; top:3%;   transform:rotate(-6deg); }
.k2{ width:86px;  height:86px;  left:25.5%; bottom:2%; transform:rotate(9deg); }

.racs{ opacity:.2; }
.g1{ width:150px; height:114px; left:26.5%; bottom:26%; transform:rotate(3deg); }
.g2{ width:120px; height:96px;  right:2%; bottom:40%; transform:rotate(-5deg); }

/* kromatikus spirálcsomók — csak két sarokban, nem körben */
.spiral{ opacity:.8; }
.sp1{ left:-46px; top:-56px;   width:310px; height:310px; }
.sp2{ left:-34px; bottom:-52px; width:280px; height:280px; transform:rotate(-24deg) scaleY(-1); }
.sp3{ right:128px; top:-34px;   width:210px; height:210px; transform:scaleX(-1) rotate(16deg); opacity:.6; }

/* kézírás-firka és csillaglánc */
.kezirat{ opacity:.45; }
.h1{ right:11%; bottom:33%; width:250px; height:90px;  transform:rotate(-8deg); }
.h2{ left:28%;  top:11%;    width:190px; height:70px;  transform:rotate(4deg); }

.lanc{ opacity:.62; }
.l1{ right:3%;  top:34%;  width:70px;  height:230px; }
.l2{ left:30%;  top:50%;  width:60px;  height:180px; transform:rotate(12deg); opacity:.4; }

/* szövegtöredékek a papírcsíkon */
.szam{ opacity:.3; }
.n1{ left:1.6%; top:33%;   width:96px; height:56px; transform:rotate(-90deg); }
.n2{ left:1.2%; bottom:26%; width:110px; height:60px; transform:rotate(-90deg); }
.n3{ right:4%;  bottom:20%; width:104px; height:52px; transform:rotate(-4deg); opacity:.22; }

/* szkennelt fénycsíkok */
.csik{ position:absolute; top:-4%; height:108%; opacity:.3; mix-blend-mode:screen; }
.c1{ left:47%; width:34px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); }
.c2{ left:95%; width:16px; background:linear-gradient(90deg, transparent, rgba(190,240,255,.8), transparent); }
.c3{ left:18%; width:22px; background:linear-gradient(90deg, transparent, rgba(255,220,245,.7), transparent); }

/* csillanások */
.szikra{ position:absolute; animation:pislog 6s ease-in-out infinite; }
@keyframes pislog{ 0%,100%{ opacity:.22; scale:.8 } 50%{ opacity:1; scale:1.15 } }
.sz1{ width:30px; height:30px; left:21%; top:9%;    animation-delay:0s }
.sz2{ width:16px; height:16px; left:35%; top:20%;   animation-delay:1.4s }
.sz3{ width:36px; height:36px; right:19%; top:15%;  animation-delay:.6s }
.sz4{ width:20px; height:20px; right:4%;  top:47%;  animation-delay:2.2s }
.sz5{ width:28px; height:28px; left:36%;  bottom:7%; animation-delay:1.1s }
.sz6{ width:15px; height:15px; right:31%; bottom:9%; animation-delay:3s }
.sz7{ width:22px; height:22px; right:26%; top:33%;  animation-delay:2.6s }
.sz8{ width:18px; height:18px; left:25%;  bottom:29%; animation-delay:.3s }
.sz9{ width:25px; height:25px; right:9%;  bottom:12%; animation-delay:4.1s }
.sz10{ width:13px; height:13px; left:44%; top:38%;  animation-delay:5.2s }

/* szemcse: szkennelt papír */
.zaj{
  position:absolute; inset:0; opacity:.09; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='z'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23z)'/></svg>");
}

/* ===================== OLDALSÁV ===================== */
.oldalsav{
  position:relative; z-index:3;
  width:286px; flex:none; display:flex; flex-direction:column; min-height:0;
  background:linear-gradient(180deg, rgba(255,240,250,.5), rgba(246,232,252,.5));
  -webkit-backdrop-filter:blur(16px) saturate(1.3);
  backdrop-filter:blur(16px) saturate(1.3);
  border-right:1px solid var(--valaszto);
  padding:56px 0 22px;
  overflow:hidden;
  transition:width .24s ease, opacity .18s ease;
}
.lap.osszecsukott .oldalsav{ width:0; opacity:0; border-right-width:0; }

.eszkozsor{ display:flex; align-items:center; gap:6px; padding:2px 26px 10px 56px; }
.eszkozsor .cimke{
  flex:1; font-size:11px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; white-space:nowrap;
  background:linear-gradient(96deg, var(--magenta), var(--lila) 55%, var(--azur));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

.eszkoz{
  width:26px; height:26px; flex:none; display:flex; align-items:center; justify-content:center;
  border:none; border-radius:7px; cursor:pointer; color:#8f3f84;
  background:rgba(255,255,255,.5);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  box-shadow:0 1px 4px rgba(120,60,140,.1);
  transition:background .12s ease, color .12s ease, transform .12s ease;
}
.eszkoz:hover{ background:rgba(255,255,255,.85); transform:translateY(-1px); }
.eszkoz svg{ width:16px; height:16px; }

.lista{
  flex:1; overflow-y:auto; overflow-x:hidden; padding:0 16px 4px 38px;
  -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 24px), transparent 100%);
}
.lista::-webkit-scrollbar{ width:6px; }
.lista::-webkit-scrollbar-thumb{ background:linear-gradient(var(--magenta), var(--azur)); border-radius:99px; }

/* esedékes ismétlés jelző az oldalsáv tetején */
.esedekes{
  margin:0 4px 8px; padding:10px 12px; border-radius:11px; cursor:pointer;
  background:linear-gradient(100deg, rgba(255,90,164,.22), rgba(160,108,255,.22) 60%, rgba(79,168,255,.2));
  box-shadow:0 2px 12px rgba(180,90,190,.18);
  transition:transform .12s ease, box-shadow .12s ease;
}
.esedekes:hover{ transform:translateY(-1px); box-shadow:0 5px 16px rgba(180,90,190,.26); }
.esedekes .fo{ font-size:13px; font-weight:700; color:var(--kijelol); }
.esedekes .alsor{ font-size:11.5px; color:var(--halk); margin-top:1px; }

/* mappa */
.mappa{ margin-bottom:2px; }
.mappa-fej{
  display:flex; align-items:center; gap:6px; cursor:pointer;
  padding:7px 10px 7px 6px; border-radius:9px; transition:background .12s ease;
}
.mappa-fej:hover{ background:rgba(255,255,255,.45); }
.mappa-fej .nyil{ flex:none; width:12px; font-size:9px; color:#a97ec6; transition:transform .16s ease; }
.mappa.nyitva > .mappa-fej .nyil{ transform:rotate(90deg); }
.mappa-fej .nev{
  flex:1; font-size:10.5px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
  color:#9a6fbe; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.mappa-fej .db{ flex:none; font-size:10px; color:#b79ccb; }
.mappa > .mappa-tartalom{ display:none; padding-left:8px; }
/* almappa: halkabb, kisebb betű, hogy a szülő mappa maradjon a főcím */
.mappa.almappa > .mappa-fej{ padding:5px 10px 5px 4px; }
.mappa.almappa > .mappa-fej .nev{
  font-size:10px; letter-spacing:.7px; text-transform:none; font-weight:700; color:#b08ace;
}
.mappa.almappa > .mappa-fej .nyil{ font-size:8px; color:#c0a0d6; }
.mappa.almappa > .mappa-fej .db{ font-size:9.5px; }
.mappa.almappa > .mappa-tartalom{ padding-left:10px; border-left:1px solid rgba(160,110,190,.18); margin-left:8px; }
.mappa.nyitva > .mappa-tartalom{ display:block; }

/* lecke sor */
.tetel{ position:relative; padding:8px 12px 9px; border-radius:10px; cursor:pointer; margin-bottom:2px; transition:background .14s ease; }
.tetel:hover{ background:rgba(255,255,255,.5); }
.tetel.kivalasztott{
  background:linear-gradient(100deg, rgba(255,90,164,.2), rgba(160,108,255,.2) 55%, rgba(79,168,255,.18));
  box-shadow:0 2px 14px rgba(180,90,190,.16);
}
.tetel.kivalasztott::before{
  content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0;
  background:linear-gradient(var(--magenta), var(--lila), var(--azur));
}
.tetel.kivalasztott .tetel-cim{ color:var(--kijelol); }

.tetel-cim{
  font-size:13.5px; font-weight:600; line-height:1.4; color:var(--tinta);
  overflow:hidden; white-space:nowrap; display:flex; align-items:center; gap:6px;
}
.tetel-cim .szoveg{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.tetel-cim .pont{
  flex:none; width:7px; height:7px; border-radius:50%;
  background:linear-gradient(var(--magenta), var(--lila));
  box-shadow:0 0 6px rgba(255,90,164,.7);
}
.tetel-also{ font-size:11.5px; color:var(--halk); line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }

.ures-lista{ padding:24px 14px; font-size:13px; color:var(--halk); text-align:center; line-height:1.7; font-style:italic; }

.lab-gomb{
  flex:1; font:inherit; font-size:11.5px; color:#8f3f84; cursor:pointer;
  border:1px dashed rgba(150,95,140,.4); background:rgba(255,255,255,.35);
  border-radius:8px; padding:6px 4px; transition:background .12s ease, border-color .12s ease;
}
.lab-gomb:hover{ background:rgba(255,255,255,.7); border-color:var(--magenta); }

/* ===================== ÍRÓ OLDAL ===================== */
.iras{ position:relative; z-index:3; flex:1; min-width:0; display:flex; flex-direction:column; padding:52px 0 34px; }

.iras-eszkozsor{ display:flex; align-items:center; gap:4px; padding:2px 70px 0 48px; height:30px; }
.iras-eszkozsor .terkitolto{ flex:1; }
#csillag.aktiv{ color:var(--magenta); filter:drop-shadow(0 0 6px rgba(255,90,164,.7)); }
.lap.osszecsukott #oldalsavGomb{ color:var(--magenta); }

.datumsor{ text-align:center; font-size:11px; color:#a07cb4; padding:0 40px 16px; letter-spacing:.6px; }

/* lecke címe */
.cimsor{ display:flex; align-items:flex-start; gap:18px; padding:2px 70px 0 50px; position:relative; }
#leckeCim{
  margin-bottom:6px; flex:0 1 auto; min-width:160px; max-width:46%;
  font:inherit; font-size:25px; font-weight:600; color:var(--tinta);
  background:none; border:none; outline:none; width:100%; padding:0;
  -webkit-user-select:text; user-select:text;
}
#leckeCim::placeholder{ color:#b48fc0; font-style:italic; font-weight:400; }

/* fülek */
.fulek{ display:flex; gap:4px; padding:4px 70px 8px 50px; align-items:center; }
.ful{
  font:inherit; font-size:12.5px; cursor:pointer; color:#8a5fa8;
  background:rgba(255,255,255,.4); border:none; border-radius:8px; padding:5px 13px;
  transition:background .12s ease, color .12s ease;
}
.ful:hover{ background:rgba(255,255,255,.75); }
.ful.aktiv{
  background:linear-gradient(100deg, var(--magenta), var(--lila));
  color:#fff; box-shadow:0 2px 10px rgba(180,90,190,.3);
}
.fulek .terkitolto{ flex:1; }

/* szerkesztő eszközsor */
.szerkeszto-sor{ display:flex; gap:4px; padding:0 70px 8px 50px; flex-wrap:wrap; }
.sz-gomb{
  font:inherit; font-size:11.5px; cursor:pointer; color:#8f3f84;
  background:rgba(255,255,255,.5); border:1px solid rgba(150,95,140,.22);
  border-radius:7px; padding:4px 9px; transition:background .12s ease;
}
.sz-gomb:hover{ background:rgba(255,255,255,.9); }

/* a vázlat maga */
#tartalom{
  outline:none; min-height:120px;
  caret-color:var(--magenta);
  padding:2px 70px 28px 50px;
  font-size:14.5px; line-height:1.68; color:var(--tinta);
  word-wrap:break-word;
  -webkit-user-select:text; user-select:text;
}
#tartalom:empty::before{ content:attr(data-uzenet); color:#b48fc0; font-style:italic; }

#tartalom h2{ font-size:17px; font-weight:700; margin:20px 0 6px; color:var(--kijelol); }
#tartalom > h2:first-child, #tartalom > h3:first-child{ margin-top:2px; }
#tartalom > .idozona.athelyezve + h2{ margin-top:2px; }
#tartalom h3{ font-size:29px; font-weight:700; margin:26px 0 8px; color:#8a5fa8; line-height:1.25; }
#tartalom p{ margin:0 0 9px; }
#tartalom ul, #tartalom ol{ margin:0 0 10px; padding-left:22px; }
#tartalom li{ margin-bottom:3px; }
#tartalom strong{ color:#7c2f74; }
#tartalom table{
  border-collapse:collapse; margin:10px 0 16px; width:100%;
  background:rgba(255,255,255,.45); border-radius:9px; overflow:hidden;
}
#tartalom th, #tartalom td{
  border:1px solid rgba(150,95,140,.22); padding:7px 10px; text-align:left; vertical-align:top;
  font-size:13.5px;
}
#tartalom th{
  background:linear-gradient(100deg, rgba(255,90,164,.18), rgba(160,108,255,.18));
  font-weight:700; color:#7c2f74;
}
#tartalom td:focus, #tartalom th:focus{ outline:2px solid rgba(255,90,164,.5); outline-offset:-2px; }
#tartalom blockquote{
  margin:10px 0; padding:6px 14px; border-left:3px solid var(--lila);
  color:var(--halk); font-style:italic;
}

/* ===================== GYAKORLATOK ===================== */
/* a teendők és a vázlat EGY görgethető dobozban vannak */
#vazlatGorgo{
  flex:1; min-height:0; overflow-y:auto;
}
#vazlatGorgo::-webkit-scrollbar{ width:6px; }
#vazlatGorgo::-webkit-scrollbar-thumb{ background:linear-gradient(var(--lila), var(--azur)); border-radius:99px; }

#gyakBlokk{ padding:0 70px 4px 50px; }
.gyak-tetel{
  display:flex; align-items:flex-start; gap:10px;
  background:rgba(255,255,255,.5); border:1px solid rgba(150,95,140,.18);
  border-left:3px solid var(--magenta);
  border-radius:10px; padding:10px 13px; margin-bottom:7px;
}
.gyak-tetel.kesz{ border-left-color:#3fbf8f; opacity:.62; }
.gyak-pipa{
  flex:none; width:19px; height:19px; margin-top:1px; cursor:pointer;
  border-radius:6px; border:1.6px solid #c58ad8; background:rgba(255,255,255,.7);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; color:#fff; transition:background .12s ease, border-color .12s ease;
}
.gyak-pipa:hover{ border-color:var(--magenta); }
.gyak-tetel.kesz .gyak-pipa{ background:linear-gradient(140deg,#3fbf8f,#4fa8ff); border-color:#3fbf8f; }
.gyak-torzs{ flex:1; min-width:0; -webkit-user-select:text; user-select:text; }
.gyak-cim{ font-size:13.5px; font-weight:600; color:var(--tinta); outline:none; }
.gyak-tetel.kesz .gyak-cim{ text-decoration:line-through; color:var(--halk); }
.gyak-also{ display:flex; align-items:center; gap:9px; margin-top:3px; font-size:11.5px; color:#b193c4; flex-wrap:wrap; }
.gyak-link{
  color:#8a5fa8; text-decoration:none; font-weight:600;
  border-bottom:1px solid rgba(138,95,168,.4); cursor:pointer;
}
.gyak-link:hover{ color:var(--kijelol); border-bottom-color:var(--kijelol); }
.gyak-url{
  font-size:11.5px; color:#a486b8; outline:none; min-width:120px;
  -webkit-user-select:text; user-select:text;
}
.gyak-url:empty::before{ content:"illeszd be ide a videó linkjét…"; color:#c9aed4; font-style:italic; }
.gyak-torolG{ cursor:pointer; color:#c9aed4; }
.gyak-torolG:hover{ color:var(--kijelol); }
/* a törlés halvány és elkülönül, hogy ne lehessen véletlenül eltalálni */
.torol-tetel{
  margin-left:10px; padding:1px 7px; border-radius:6px; font-size:13px; line-height:1.3;
  opacity:.35; transition:opacity .12s ease, background .12s ease;
}
.gyak-tetel:hover .torol-tetel{ opacity:.75; }
.torol-tetel:hover{ background:rgba(255,90,164,.14); opacity:1; }
.torol-tetel.megerosites{
  opacity:1; font-size:11px; font-weight:600; color:#fff;
  background:linear-gradient(100deg, var(--magenta), var(--lila)); padding:2px 8px;
}

/* számlálós teendő */
.gyak-szamlalo{ display:inline-flex; align-items:center; gap:6px; }
.gyak-szamlalo b{ font-size:12px; color:#7c4f9c; min-width:44px; text-align:center; }
.szam-gomb{
  width:18px; height:18px; line-height:1; font-size:13px; cursor:pointer;
  border:1px solid rgba(150,95,140,.3); background:rgba(255,255,255,.7);
  border-radius:5px; color:#8f3f84; padding:0;
  display:flex; align-items:center; justify-content:center;
}
.szam-gomb:hover{ background:#fff; border-color:var(--magenta); }
.gyak-sav{
  display:inline-block; width:76px; height:5px; border-radius:99px;
  background:rgba(150,95,140,.18); overflow:hidden;
}
.gyak-sav i{ display:block; height:100%; background:linear-gradient(90deg, var(--magenta), var(--azur)); }

/* kurzuskövetelmény halványabb keret */
.gyak-tetel.hosszu{ border-left-color:#9a8fd8; }

/* szövegbe ágyazott megnyitható link (táblázatban is) */
.utlink{
  color:#8a3fa0; cursor:pointer; font-weight:600; white-space:nowrap;
  border-bottom:1px solid rgba(138,63,160,.35);
  padding:1px 3px; border-radius:4px;
  transition:background .12s ease, color .12s ease;
}
.utlink:hover{ background:rgba(255,90,164,.14); color:var(--kijelol); border-bottom-color:var(--kijelol); }
.utlink::before{ content:"↗ "; opacity:.6; font-weight:400; }
.utlink[data-tipus="fajl"]::before{ content:"📄 "; }
.utlink[data-tipus="mappa"]::before{ content:"📁 "; }

/* szövegbe ágyazott, egérrel megjelenő infó */
.tipp{
  cursor:help; font-weight:600; color:#8a3fa0;
  border-bottom:1px dashed rgba(138,63,160,.5);
  transition:background .12s ease;
}
.tipp:hover{ background:rgba(255,90,164,.12); }

.tippablak{
  position:absolute; z-index:12; max-width:330px; pointer-events:none;
  padding:11px 14px; border-radius:11px;
  background:linear-gradient(160deg, #fdf4fa, #f4e9fb);
  box-shadow:0 10px 34px rgba(110,45,110,.3), 0 0 0 1px rgba(255,255,255,.7);
  opacity:0; transform:translateY(4px);
  transition:opacity .14s ease, transform .14s ease;
}
.tippablak.latszik{ opacity:1; transform:translateY(0); }
.tippablak .tipp-cim{
  font-size:12.5px; font-weight:700; margin-bottom:4px;
  background:linear-gradient(96deg, var(--magenta), var(--lila));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.tippablak .tipp-szoveg{ font-size:12.5px; line-height:1.6; color:#6b4a78; }

/* kereső */
.kereso-mezo{
  width:100%; font:inherit; font-size:12.5px; color:var(--tinta);
  background:rgba(255,255,255,.5); border:1px solid rgba(170,120,200,.28);
  border-radius:10px; padding:6px 11px; outline:none;
  transition:background .14s ease, border-color .14s ease;
}
.kereso-mezo::placeholder{ color:#b48fc0; }
.kereso-mezo:hover{ background:rgba(255,255,255,.72); }

.kereso-reteg{
  position:fixed; inset:0; z-index:80;
  background:rgba(52,24,62,.5); backdrop-filter:blur(12px);
}
.kereso-reteg.rejtve{ display:none !important; }

/* a sáv ott kezdődik, ahol a kis mező volt, és onnan nyúlik ki — végig ugyanolyan vékonyan */
.kereso-sav{
  position:absolute; display:flex; align-items:center; gap:10px;
  padding:0 6px 0 13px; border-radius:11px; box-sizing:border-box;
  background:rgba(255,255,255,.94);
  box-shadow:0 6px 26px rgba(60,20,80,.3);
  transition:width .26s cubic-bezier(.3,.9,.3,1);
  overflow:hidden;
}
.kereso-nagy{
  flex:1; min-width:0; font:inherit; font-size:14px; font-weight:600; color:var(--tinta);
  background:none; border:none; outline:none;
}
.kereso-nagy::placeholder{ color:#c0a0cc; font-weight:400; }
.kereso-pipa{
  font-size:11px; color:#8a5fa8; display:flex; align-items:center; gap:4px;
  cursor:pointer; white-space:nowrap; flex:none;
}
.kereso-pipa input{ margin:0; transform:scale(.85); }
.kereso-zar{
  flex:none; width:22px; height:22px; border:none; border-radius:50%; cursor:pointer;
  font-size:16px; line-height:1; color:#8a5fa8; background:rgba(160,110,200,.16); padding:0;
}
.kereso-zar:hover{ background:rgba(160,110,200,.3); }

.kereso-talalatok{
  position:absolute; overflow-y:auto; padding:4px 0 30px; box-sizing:border-box;
}
.kereso-lecke{
  margin:0 0 6px; font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase;
  color:#ffd9ef; padding-top:14px;
}
.kereso-talalat{
  display:block; width:100%; text-align:left; font:inherit; cursor:pointer; border:none;
  margin:0 0 5px; padding:9px 14px; border-radius:11px;
  background:rgba(255,255,255,.86); color:var(--tinta); font-size:13.5px; line-height:1.5;
}
.kereso-talalat:hover, .kereso-talalat.kijelolt{ background:#fff; box-shadow:0 3px 14px rgba(60,20,80,.2); }
.kereso-talalat .tipus{
  font-size:10.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
  color:#b07ac8; margin-right:7px;
}
.kereso-talalat mark{ background:rgba(255,200,90,.55); color:inherit; border-radius:3px; padding:0 2px; }
.kereso-ures{ color:#f0dcf5; font-size:14px; padding:18px 2px; }
#tartalom .talalat-kiemel{ background:rgba(255,200,90,.5); border-radius:4px; }

/* kulcsszavak a lecke elején — gondolatjeles felsorolás */
#tartalom .kulcslista{
  list-style:none; margin:2px 0 16px; padding:0;
}
#tartalom .kulcslista li{
  font-size:19px; font-weight:800; color:#7c2f74; line-height:1.45; letter-spacing:-.2px;
}
#tartalom .kulcslista li::before{ content:"– "; color:#c9aad8; font-weight:400; }

/* A FONTOS SZÓ a szövegben: nagyobb és egyetlen, a címtől eltérő színnel. */
#tartalom .kulcs{
  font-size:1.32em; font-weight:800; color:#7c2f74; letter-spacing:-.2px;
  line-height:1.15;
}
/* táblázatban soha — ott szétesne a sorok magassága */
#tartalom table .kulcs{ font-size:1em; font-weight:700; letter-spacing:0; }




/* napi üdvözlés: egy virág és a széria */
.koszones{
  position:fixed; inset:0; z-index:75; display:flex; align-items:center; justify-content:center;
  background:rgba(60,30,70,.34); backdrop-filter:blur(8px); cursor:pointer;
}
.koszones-doboz{
  text-align:center; padding:34px 46px 30px; border-radius:26px;
  background:linear-gradient(150deg,#fff6fb,#f5e8ff 65%,#e9f2ff);
  box-shadow:0 24px 70px rgba(80,30,110,.34), 0 0 0 1px rgba(255,255,255,.75) inset;
}
.koszones-virag{ width:150px; height:150px; object-fit:contain; display:block; margin:0 auto 14px;
  animation:kinyil .9s cubic-bezier(.2,.9,.25,1.1) both; }
.koszones-fo{ font-size:27px; font-weight:700; color:var(--tinta); line-height:1.25; }
.koszones-alcim{ margin-top:8px; font-size:14.5px; color:#8a6a9c; }

/* halk haladás-sor az oldalsáv alján */
.haladas{
  flex:none; display:flex; align-items:center; gap:9px;
  padding:8px 18px 15px; -webkit-user-select:none; user-select:none;
}
.haladas-virag{ width:42px; height:42px; object-fit:contain; flex:none; }
.haladas-szoveg{ min-width:0; }
.haladas-szoveg .fo{
  font-size:27px; font-weight:800; color:#c2408f; line-height:1; letter-spacing:-.5px;
}
.haladas-szoveg .alsor{ font-size:11px; color:#a97ec6; line-height:1.45; margin-top:2px; }

/* élő időzóna-doboz */
.idozona{
  display:flex; gap:14px; align-items:stretch; flex-wrap:wrap;
  margin:10px 0 16px; padding:13px 16px; border-radius:12px;
  background:linear-gradient(100deg, rgba(255,255,255,.78), rgba(255,255,255,.62));
  box-shadow:0 2px 12px rgba(180,90,190,.14), 0 0 0 1px rgba(170,120,200,.22);
}
.idozona-cella{ min-width:112px; }
.idozona-cimke{ font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#8a5aa8; }
.idozona-ora{ font-size:23px; font-weight:700; color:var(--tinta); line-height:1.25; font-variant-numeric:tabular-nums; }
.idozona-nap{ font-size:11.5px; color:#6b4a78; }
.idozona-elt{
  margin-left:auto; align-self:center; text-align:right;
  font-size:12.5px; line-height:1.5; color:#7c4f9c;
}
.idozona-elt b{ font-size:16px; color:var(--kijelol); }

/* még le nem töltött forrás */
.forras-hianyzik{
  color:#b79ccb; font-style:italic;
  border-bottom:1px dotted rgba(183,156,203,.6);
}
.forras-hianyzik::before{ content:"○ "; opacity:.7; }

/* nagy indítógomb a vázlat tetején */
#jatekIndito{ padding:0 70px 14px 50px; }
#jatekIndito:empty{ padding:0; }
/* a lecke címével egy szinten, jobbra: a gyakorló gombok egymás alatt */
#fentiGyakorlok{
  flex:none; display:flex; flex-direction:column; align-items:stretch; gap:5px; padding:0;
}
/* kulcsszavak a cím jobb oldalán, gondolatjeles felsorolásban */
#fejlecKulcsszavak{
  flex:1 1 auto; text-align:left; align-self:flex-start;
  padding-top:3px; white-space:nowrap; min-width:0;
}
#fejlecKulcsszavak:empty{ display:none; }
#fejlecKulcsszavak div{
  font-size:17px; font-weight:800; color:#7c2f74; line-height:1.4; letter-spacing:-.2px;
}
#fejlecKulcsszavak div::before{ content:"– "; color:#c9aad8; font-weight:400; }
#fejlecOrak{ flex:none; }
#fejlecOrak:empty{ display:none; }
#fentiGyakorlok:empty{ display:none; }
.fenti-gomb{
  display:flex; align-items:baseline; gap:8px; min-width:192px; justify-content:space-between;
  padding:5px 14px; border:none; cursor:pointer; border-radius:10px; font:inherit; color:#fff;
  background:linear-gradient(100deg,#7b5fd0,#b06ad0);
  box-shadow:0 3px 14px rgba(140,80,180,.26);
  transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
}
.fenti-gomb + .fenti-gomb{ background:linear-gradient(100deg,#c265c9,#e0679f); }
.fenti-gomb:hover{ transform:translateY(-2px); box-shadow:0 6px 20px rgba(140,80,180,.36); filter:brightness(1.06); }
.fenti-gomb .fg-nev{ font-size:13.5px; font-weight:700; }
.fenti-gomb .fg-db{ font-size:11.5px; opacity:.8; }
.nagy-inditó{
  width:100%; font:inherit; font-size:16px; font-weight:700; color:#fff; cursor:pointer;
  border:none; border-radius:14px; padding:16px 20px;
  background:linear-gradient(100deg, var(--magenta), var(--lila) 55%, var(--azur));
  box-shadow:0 5px 20px rgba(180,90,190,.36), 0 1px 0 rgba(255,255,255,.35) inset;
  transition:transform .13s ease, box-shadow .13s ease;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.nagy-inditó:hover{ transform:translateY(-2px); box-shadow:0 9px 28px rgba(180,90,190,.46), 0 1px 0 rgba(255,255,255,.35) inset; }
.nagy-inditó:active{ transform:translateY(0); }
.nagy-inditó .alcim{ font-size:12.5px; font-weight:500; opacity:.85; }

/* ===== JUTALOM: kinyíló virágok ===== */
.kert{ width:100%; max-width:640px; margin:0 auto; line-height:0; }
.kert svg{ width:100%; height:auto; display:block; overflow:hidden; }

.szar{ stroke-dasharray:150; stroke-dashoffset:150; animation:szarNo .9s ease-out forwards; }
@keyframes szarNo{ from{ stroke-dashoffset:150 } to{ stroke-dashoffset:0 } }

.bimbo{ transform-origin:center; opacity:0; animation:kinyil .8s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes kinyil{
  0%  { opacity:0; transform:scale(.05) rotate(-40deg) }
  55% { opacity:1; transform:scale(1.16) rotate(6deg) }
  100%{ opacity:1; transform:scale(1) rotate(0deg) }
}
.level-be{ transform-origin:center; opacity:0; animation:levelNo .6s ease-out forwards; }
@keyframes levelNo{ from{opacity:0;transform:scale(.2)} to{opacity:1;transform:scale(1)} }

.szikra-fel{ animation:szikrazik 1.6s ease-in-out infinite; transform-origin:center; }
@keyframes szikrazik{ 0%,100%{opacity:.25;transform:scale(.7)} 50%{opacity:1;transform:scale(1.15)} }

.unnep-cim{
  font-size:24px; font-weight:700; line-height:1.3;
  background:linear-gradient(100deg, var(--magenta), var(--lila) 55%, var(--azur));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.unnep-alcim{ font-size:14px; color:#6b4a78; line-height:1.7; }

/* biztosíték: ha az animáció nem fut le, ettől akkor is láthatóvá válik */
.kert.kesz .bimbo, .kert.kesz .level-be{ opacity:1 !important; animation:none !important; }
.kert.kesz .szar{ stroke-dashoffset:0 !important; animation:none !important; }
.kert.kesz .szikra-fel{ opacity:1 !important; }

@media (prefers-reduced-motion: reduce){
  .szar, .bimbo, .level-be, .szikra-fel{ animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; }
}

/* lenyitható sor a nyolc ág táblázatában */
#tartalom tr.ag-sor{ cursor:pointer; }
#tartalom tr.ag-sor:hover td{ background:rgba(255,255,255,.6); }
/* nyitható sor: halk nyíl — ha több fogalom van alatta, csillag jelzi */
#tartalom tr.ag-sor td:nth-child(2)::after{
  content:" ▸"; margin-left:6px; color:#c3a3d6; font-size:11px; display:inline-block;
  transition:transform .2s ease, color .2s ease, text-shadow .2s ease;
}
#tartalom tr.ag-sor.nyitva td:nth-child(2)::after{ transform:rotate(90deg); color:#a07ec0; }
#tartalom tr.ag-sor[data-tobb] td:nth-child(2)::after{
  content:" ✦"; margin-left:7px; color:#e08ac8; font-size:15px;
  text-shadow:0 0 7px rgba(255,150,210,.7), 0 0 14px rgba(255,200,120,.35);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1), color .2s ease, text-shadow .2s ease;
}
#tartalom tr.ag-sor[data-tobb]:hover td:nth-child(2)::after{ color:#ff6fb5; }
#tartalom tr.ag-sor[data-tobb].nyitva td:nth-child(2)::after{
  transform:rotate(72deg) scale(1.25); color:#ffb347;
  text-shadow:0 0 10px rgba(255,190,90,.85);
}
#tartalom tr.al-sor.rejtve{ display:none; }
#tartalom tr.al-sor td{ background:rgba(160,108,255,.07); padding:4px 14px 10px 30px; }

/* lenyitott tartalom: felsorolás, nem táblázat — és nem kisebb betűvel */
.alista{ list-style:none; margin:6px 0 2px; padding:0; }
.alista li{
  margin:0 0 7px; padding:7px 12px 8px 14px; border-radius:9px; overflow:hidden;
  background:rgba(255,255,255,.62); border-left:3px solid #a48cff;
  font-size:14px; line-height:1.55;
}
.alista .nev{ font-weight:700; color:#7c2f74; }
.alista .ertek{ color:var(--tinta); }
.alista .cimke{
  display:inline-block; min-width:58px; font-size:11px; font-weight:700;
  letter-spacing:.6px; text-transform:uppercase; color:#b08ace;
}
.alista .szinpont{
  display:inline-block; width:11px; height:11px; border-radius:50%;
  vertical-align:-1px; margin-right:6px; box-shadow:0 0 0 2px rgba(255,255,255,.8);
}

/* táblázatcsoport: az ingyenes e-könyvek más színnel, mint a megvásárolható könyvek */
#tartalom tr.csoportfej td{
  font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase;
  padding:9px 14px 6px; border:none;
}
#tartalom tr.ingyen td{ background:rgba(120,210,190,.16); }
#tartalom tr.ingyen:hover td{ background:rgba(120,210,190,.26); }
#tartalom tr.csoportfej.ingyen td{ color:#2f8f7f; background:none; }
#tartalom tr.csoportfej.vasarolt td{ color:#a3689c; background:none; }
#tartalom tr.ingyen .megnyit{ white-space:normal; }

/* lenyitható szakasz a leckében: a cím kattintható, alatta a tartalom */
#tartalom section.csukhato{
  margin:18px 0; border-radius:12px; background:rgba(255,255,255,.42);
  border:1px solid rgba(164,140,255,.22); overflow:hidden;
}
#tartalom section.csukhato > h2{
  margin:0; padding:11px 14px; cursor:pointer; font-size:17px;
}
#tartalom section.csukhato > h2:hover{ background:rgba(255,255,255,.55); }
#tartalom section.csukhato > h2::after{
  content:"▸"; float:right; color:#b58ad0; font-size:14px; font-weight:400;
  display:inline-block; transition:transform .16s ease;
}
#tartalom section.csukhato.nyitva > h2::after{ transform:rotate(90deg); }
#tartalom section.csukhato > .szakasz{ display:none; padding:0 14px 12px; }
#tartalom section.csukhato.nyitva > .szakasz{ display:block; }

/* csakra-virág a színpont helyett */
.alista .csvirag{
  display:block; float:left; width:76px; height:76px; object-fit:contain;
  margin:2px 14px 4px 0;
}
.alista li.nyilo > .fej::after{ position:relative; z-index:1; }
.alista li.nyilo > .fej{ overflow:hidden; }
.alista li.nyilo > .test{ clear:both; }

/* lenyitható elem a felsorolásban — táblázat nélkül */
.alista li.nyilo{ padding:0; overflow:hidden; }
.alista li.nyilo > .fej{ display:block; cursor:pointer; padding:7px 12px 8px 14px; }
.alista li.nyilo > .fej:hover{ background:rgba(255,255,255,.55); }
.alista li.nyilo > .fej::after{
  content:"▸"; float:right; color:#b58ad0; font-size:12px;
  display:inline-block; transition:transform .16s ease; margin-left:8px;
}
.alista li.nyilo.nyitva > .fej::after{ transform:rotate(90deg); }
.alista li.nyilo > .test{ display:none; padding:2px 14px 10px 14px; border-top:1px solid rgba(164,140,255,.22); }
.alista li.nyilo.nyitva > .test{ display:block; }
.alista li.nyilo > .test p{ margin:8px 0 0; }
.alista li.nyilo > .test .pozsor{ margin:7px 0 0; padding:0; list-style:none; }
.alista li.nyilo > .test .pozsor li{
  display:inline-block; margin:0 5px 5px 0; padding:3px 9px; border-radius:20px;
  background:rgba(164,140,255,.14); border:none; border-left:none; font-size:12.5px;
}
.alista li.nyilo > .test .kerdes-magamnak{
  margin-top:9px; font-style:italic; color:#9a6bb5; font-size:13.5px;
}

/* kattintható kép-rács: pózonként egy lenyitható lap, mint az .alista .nyilo — csak rácsban */
#tartalom .kvizracs{
  list-style:none; margin:14px 0; padding:0; display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px;
}
#tartalom .kvizracs li.nyilo{
  padding:0; overflow:hidden; border-radius:14px; background:rgba(255,255,255,.4);
}
#tartalom .kvizracs li.nyilo.nyitva{ grid-column:1 / -1; }
#tartalom .kvizracs li.nyilo > .fej{
  display:block; cursor:pointer; padding:10px; text-align:center;
}
#tartalom .kvizracs li.nyilo > .fej:hover{ background:rgba(255,255,255,.6); }
#tartalom .kvizracs li.nyilo > .fej::after{ content:none; }
#tartalom .kvizracs li.nyilo > .fej img{
  width:100%; height:auto; max-height:none; object-fit:contain; border-radius:10px; display:block;
}
#tartalom .kvizracs li.nyilo > .fej span{
  display:block; margin-top:8px; font-weight:700; font-size:14px; color:#7c2f74;
}
#tartalom .kvizracs li.nyilo > .test{
  display:none; padding:4px 16px 16px; border-top:1px solid rgba(164,140,255,.22);
}
#tartalom .kvizracs li.nyilo.nyitva > .test{ display:block; }

.gy-naplo{ width:min(640px, 94%); box-sizing:border-box; text-align:left; margin-left:auto; margin-right:auto; }
#tartalom .gyak-naplo, .gy-naplo{ margin-top:14px; padding:12px 14px; border-radius:12px; background:rgba(255,255,255,.55); border:1px solid rgba(164,140,255,.25); }
#tartalom .gn-fej, .gy-naplo .gn-fej{ display:flex; align-items:center; gap:12px; }
#tartalom .gn-fej b, .gy-naplo .gn-fej b{ color:#7c2f74; font-size:14px; }
#tartalom .gn-uj, #tartalom .gn-ment, .gy-naplo .gn-uj, .gy-naplo .gn-ment{ font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; border:none; border-radius:8px; padding:5px 12px; color:#fff; background:linear-gradient(100deg, var(--lila), var(--azur)); }
#tartalom .gn-megse, .gy-naplo .gn-megse{ font:inherit; font-size:12.5px; cursor:pointer; border:none; background:none; color:var(--halk); text-decoration:underline; }
#tartalom .gn-urlap, .gy-naplo .gn-urlap{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
#tartalom .gn-urlap textarea, .gy-naplo .gn-urlap textarea{ font:inherit; font-size:14px; min-height:70px; padding:8px 10px; border-radius:10px; border:1px solid rgba(164,140,255,.35); background:rgba(255,255,255,.85); color:var(--tinta); resize:vertical; }
#tartalom .gn-csuszka, .gy-naplo .gn-csuszka{ display:flex; align-items:center; gap:10px; font-size:13px; color:#6b4a78; }
#tartalom .gn-csuszka span, .gy-naplo .gn-csuszka span{ width:74px; } #tartalom .gn-csuszka input, .gy-naplo .gn-csuszka input{ flex:1; max-width:260px; accent-color:#b06ad0; }
#tartalom .gn-gombok, .gy-naplo .gn-gombok{ display:flex; gap:12px; align-items:center; }
#tartalom .gn-bejegyzes, .gy-naplo .gn-bejegyzes{ margin-top:10px; padding-top:8px; border-top:1px solid rgba(164,140,255,.2); }
#tartalom .gn-felso, .gy-naplo .gn-felso{ font-size:12px; color:var(--halk); }
#tartalom .gn-jegyzet, .gy-naplo .gn-jegyzet{ font-size:14px; line-height:1.55; color:var(--tinta); margin-top:2px; }
#tartalom .kvizracs li.nyilo > .test p{ margin:10px 0 0; line-height:1.55; }
#tartalom .kvizracs li.nyilo > .test p b{ color:#7c2f74; }

/* a különálló témák saját színt kapnak, hogy lássd: ez már más történet */
#tartalom h3[data-szin]{ padding-left:16px; border-left:6px solid; }
#tartalom h3[data-szin="rozsa"]{ border-color:#ff7ab8; color:#d1418a; }
#tartalom h3[data-szin="lila"]{ border-color:#a48cff; color:#7b5fd0; }
#tartalom h3[data-szin="kek"]{ border-color:#7cc0ff; color:#4f86c6; }
#tartalom h3[data-szin="turkiz"]{ border-color:#74d6f0; color:#3f9ab5; }
#tartalom h3[data-szin="menta"]{ border-color:#8fe0dd; color:#3f9a96; }

.ugras-sor{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px; }
.ugras{
  font:inherit; font-size:12.5px; cursor:pointer; color:#7c4f9c;
  background:rgba(255,255,255,.7); border:1px solid rgba(150,95,140,.26);
  border-radius:999px; padding:6px 14px; transition:all .12s ease;
}
.ugras:hover{ background:#fff; border-color:var(--magenta); color:var(--kijelol); transform:translateY(-1px); }
.ugras b{ color:#a97ec6; font-weight:600; margin-left:3px; }

/* ===== FOGALOMCSALÁDOK ===== */
.csalad{ margin-top:4px; max-width:560px; }
.csalad-cim{
  font-size:11px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase;
  color:#a97ec6; margin-bottom:6px;
}
.csalad-sor{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; }
.testver{
  font:inherit; font-size:12px; cursor:pointer; color:#7c4f9c;
  background:rgba(255,255,255,.7); border:1px solid rgba(150,95,140,.24);
  border-radius:999px; padding:3px 11px; transition:all .12s ease;
}
.testver:hover{ background:#fff; border-color:var(--magenta); color:var(--kijelol); }
.testver.ez{
  background:linear-gradient(100deg, var(--magenta), var(--lila)); color:#fff;
  border-color:transparent; font-weight:600;
}
.testver.hianyzik{ opacity:.45; font-style:italic; }
.csalad-link{
  margin-top:8px; font-size:12.5px; color:#8a3fa0; cursor:pointer; font-weight:600;
  border-bottom:1px solid rgba(138,63,160,.35); display:inline-block;
}
.csalad-link:hover{ color:var(--kijelol); border-bottom-color:var(--kijelol); }

/* visszatérő sáv, ha a játékból néztünk meg valamit */
.vissza-sav{
  position:absolute; left:50%; bottom:20px; transform:translateX(-50%); z-index:11;
  display:flex; align-items:center; gap:12px;
  padding:10px 18px; border-radius:999px;
  background:linear-gradient(100deg, var(--magenta), var(--lila));
  box-shadow:0 6px 22px rgba(180,90,190,.42);
  color:#fff; font-size:13px; font-weight:600; cursor:pointer;
}
.vissza-sav:hover{ transform:translateX(-50%) translateY(-2px); }
.vissza-sav .halk{ font-weight:400; opacity:.85; font-size:12px; }
.vissza-sav.rejtve{ display:none !important; }

/* csoportonkénti indítók */
.csoport-cim{
  padding:10px 70px 4px 50px; font-size:11px; font-weight:700;
  letter-spacing:1.4px; text-transform:uppercase; color:#a97ec6;
}
.csoport-inditok{ display:flex; flex-wrap:wrap; gap:7px; padding:2px 70px 8px 50px; }
/* a beírt válasz ítélete */
.gy-itelet{
  margin:10px auto 2px; padding:7px 18px; border-radius:20px; font-size:15px; font-weight:700;
  display:inline-block;
}
.gy-itelet.jo{ color:#2b8f6a; background:rgba(80,200,150,.2); }
.gy-itelet.nem{ color:#c2408f; background:rgba(255,120,180,.18); }
.gy-itelet b{ font-weight:700; font-style:italic; }

/* az időeltolódás a lecke címe mellett */
#tartalom .idozona.athelyezve{ display:none; }
#fejlecOrak .idozona.fejlecben{
  margin:0; padding:7px 14px 6px; gap:14px; font-size:13px;
  background:rgba(255,255,255,.82);
  box-shadow:0 2px 12px rgba(150,90,170,.14), 0 0 0 1px rgba(170,120,200,.24);
}
#fejlecOrak .idozona.fejlecben .idozona-cella{ min-width:96px; }
#fejlecOrak .idozona.fejlecben .idozona-cimke{ color:#7c4f9c; letter-spacing:.8px; }
#fejlecOrak .idozona.fejlecben .idozona-ora{ font-size:19px; color:#4a2a55; }
#fejlecOrak .idozona.fejlecben .idozona-nap{ color:#6b4a78; }
#fejlecOrak .idozona.fejlecben .idozona-elt{ margin-left:8px; color:#5f3a78; font-size:12px; }
#fejlecOrak .idozona.fejlecben .idozona-elt b{ font-size:15px; color:#c2408f; }

/* élő óra figyelmeztetés */
.ora-ertesito{
  position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
  background:rgba(60,30,70,.42); backdrop-filter:blur(7px);
}
.oe-doboz{
  min-width:340px; max-width:440px; padding:26px 28px 22px; text-align:center;
  border-radius:22px; background:linear-gradient(150deg,#fff6fb,#f3e6ff 70%,#e8f1ff);
  box-shadow:0 20px 60px rgba(80,30,110,.36), 0 0 0 1px rgba(255,255,255,.7) inset;
}
.oe-fejlec{
  font-size:12px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase;
  color:#c2408f; margin-bottom:10px;
}
.oe-cim{ font-size:23px; font-weight:700; color:var(--tinta); line-height:1.3; }
.oe-mikor{ margin-top:6px; font-size:14px; color:#8a6a9c; }
.oe-gombok{ display:flex; gap:8px; justify-content:center; margin-top:20px; }
.oe-gomb{
  font:inherit; font-size:14px; font-weight:700; cursor:pointer; border:none;
  border-radius:12px; padding:9px 20px; transition:transform .13s ease, filter .13s ease;
}
.oe-gomb.fo{ color:#fff; background:linear-gradient(100deg,var(--magenta),var(--lila)); }
.oe-gomb.halk{ color:#8a5fa8; background:rgba(255,255,255,.75); }
.oe-gomb:hover{ transform:translateY(-1px); filter:brightness(1.06); }

/* nagyító: a pózgaléria képei nagyban, lapozhatóan */
.nagyito{
  position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; padding:64px 92px 28px;
  background:rgba(60,30,70,.58); backdrop-filter:blur(10px);
}
.nagyito.rejtve{ display:none !important; }
.nagyito img{
  max-width:min(70vw, 760px); max-height:calc(100vh - 230px); min-height:0;
  object-fit:contain;
  background:rgba(255,255,255,.92); border-radius:20px; padding:18px;
  box-shadow:0 18px 60px rgba(60,20,80,.4);
}
/* a felirat a kép ALATT áll, saját sötét alapon — kis ablakban sem lóg rá */
.nagyito-cim{
  flex:none; text-align:center; color:#fff; font-size:19px; font-weight:700; line-height:1.35;
  padding:9px 20px; border-radius:16px; background:rgba(48,20,62,.62);
  box-shadow:0 6px 20px rgba(40,10,60,.3);
}
.nagyito-cim span{
  display:block; font-size:15px; font-weight:400; font-style:italic; opacity:.9;
  margin-top:2px; max-width:min(720px, 82vw); white-space:normal; line-height:1.5;
}
.nagyito-cim{ max-width:min(760px, 88vw); }
.nagyito-nyil.rejtve{ display:none !important; }
.nagyito-nyil, .nagyito-zar{
  position:absolute; border:none; cursor:pointer; color:#fff; font:inherit;
  background:rgba(255,255,255,.16); border-radius:50%;
  transition:background .14s ease, transform .14s ease;
}
.nagyito-nyil{ width:52px; height:52px; font-size:32px; line-height:1; top:50%; transform:translateY(-50%); }
.nagyito-nyil.bal{ left:4vw; } .nagyito-nyil.jobb{ right:4vw; }
.nagyito-nyil:hover, .nagyito-zar:hover{ background:rgba(255,255,255,.3); }
.nagyito-zar{ width:40px; height:40px; font-size:24px; line-height:1; top:24px; right:26px; }
#tartalom .pozracs img{ cursor:zoom-in; }

/* két félgomb: a szótár két iránya */
.ketfele{ display:flex; gap:10px; }
.nagy-inditó.fel{
  flex:1; flex-direction:column; align-items:center; gap:2px; padding:12px 14px;
}
.nagy-inditó.fel .alcim{ font-size:12px; opacity:.82; }
.nagy-inditó.fel:last-child{ background:linear-gradient(100deg,#c265c9,#e0679f 60%,#ff9a6b); }
.gy-iras.rovid{ min-height:64px; width:min(460px, 88%); text-align:center; font-size:19px; }

/* szótár a lecke oldalán */
#tartalom .szotar{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(215px, 1fr));
  gap:3px 18px; margin:12px 0 6px;
}
#tartalom .szotar div{
  padding:4px 10px; border-radius:8px; font-size:13.5px; line-height:1.45;
  background:rgba(255,255,255,.42);
}
#tartalom .szotar b{ color:#7c2f74; font-weight:700; }
#tartalom .szotar span{ color:#6b4a78; }

/* hivatkozás egy másik leckére a szövegben */
#tartalom .leckelink{
  display:inline-block; cursor:pointer; font-size:12.5px; font-weight:700;
  color:#fff; border-radius:20px; padding:4px 12px; white-space:nowrap;
  background:linear-gradient(100deg,#5fb8a8,#4fa8ff);
  box-shadow:0 2px 8px rgba(80,150,180,.24);
  transition:transform .13s ease, box-shadow .13s ease, filter .13s ease;
}
#tartalom .leckelink::before{ content:"↗ "; opacity:.7; font-weight:400; }
#tartalom .leckelink:hover{ transform:translateY(-1px); box-shadow:0 4px 13px rgba(80,150,180,.34); filter:brightness(1.07); }

/* gyakorló gombok a szakasz címe mellett */
#tartalom .szakasz-gombok{
  display:inline-flex; flex-wrap:wrap; gap:6px; margin-left:14px; vertical-align:middle; max-width:100%;
}
/* a gombok szövege is törhet, ha keskeny az ablak — sose lógjon ki oldalra */
#tartalom .szakasz-gombok .leckelink{ white-space:normal; }
#tartalom{ overflow-wrap:break-word; }
#tartalom .gy-csoport{
  font:inherit; font-size:12px; font-weight:700; letter-spacing:.2px;
  color:#fff; border:none; cursor:pointer; border-radius:20px; padding:4px 12px;
  background:linear-gradient(100deg,#7b5fd0,#b06ad0);
  box-shadow:0 2px 8px rgba(140,80,180,.24);
  transition:transform .13s ease, box-shadow .13s ease, filter .13s ease;
}
#tartalom .gy-csoport.valaszolj{ background:linear-gradient(100deg,#c265c9,#e0679f); }
#tartalom .gy-csoport:hover{ transform:translateY(-1px); box-shadow:0 4px 13px rgba(140,80,180,.34); filter:brightness(1.07); }
#tartalom .gy-csoport b{ font-weight:700; opacity:.72; margin-left:5px; }
#tartalom .gy-csoport.ures{ display:none; }
/* záróvizsga: feleletválasztós */
.vl-hu{ font-size:14px; color:var(--halk); font-style:italic; margin-top:-6px; max-width:640px; }
.vl-lista{ width:min(560px, 92%); display:flex; flex-direction:column; gap:8px; margin-top:6px; }
.vl-gomb{ font:inherit; cursor:pointer; text-align:left; border-radius:12px; padding:11px 16px;
  background:rgba(255,255,255,.72); border:1px solid rgba(164,140,255,.34); color:var(--tinta);
  display:flex; flex-direction:column; gap:2px; }
.vl-gomb:hover{ background:rgba(255,255,255,.95); border-color:#c08ae0; }
.vl-gomb.jo{ background:rgba(63,191,143,.16); border-color:#3fbf8f; }
.vl-gomb.rossz{ background:rgba(255,90,120,.13); border-color:#e0607a; }
.vl-gomb.halvany{ opacity:.55; }
.vl-en{ font-size:15px; font-weight:600; }
.vl-hu-kis{ font-size:12.5px; color:var(--halk); }
.vl-itelet{ font-size:15px; font-weight:700; }
.vl-itelet.jo{ color:#2c9c72; } .vl-itelet.nem{ color:#d1418a; }
.vl-magyarazat{ font-size:14px; color:#6b4a78; max-width:560px; line-height:1.55; }
#tartalom .gy-csoport.tukor{ background:linear-gradient(100deg,#e0679f,#f08ab8); }
#tartalom h3 .szakasz-gombok{ font-size:14px; }
.tukor-iras{ min-height:170px; }
.tukor-regiek{ width:min(640px, 92%); margin:6px auto 0; text-align:left; display:flex; flex-direction:column; gap:10px; }
.tukor-regiek-cim{ font-size:12px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; color:#8a5fa8; }
.tukor-regi{ padding:10px 14px; border-radius:12px; background:rgba(255,255,255,.55); box-shadow:0 2px 12px rgba(180,90,190,.1); }
.tukor-datum{ font-size:11.5px; color:var(--halk); margin-bottom:3px; }
.tukor-szoveg{ font-size:14.5px; line-height:1.6; color:var(--tinta); }

/* pózgaléria a lecke oldalán */
#tartalom .pozracs{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(158px, 1fr));
  gap:12px; margin:14px 0 8px;
}
#tartalom .pozracs figure{
  margin:0; text-align:center; padding:8px 7px 11px; border-radius:13px;
  background:rgba(255,255,255,.52); border:1px solid rgba(164,140,255,.18);
}
#tartalom .pozracs img{
  width:100%; height:116px; object-fit:contain; border-radius:9px; display:block;
}
#tartalom .pozracs figcaption{ margin-top:7px; line-height:1.35; }
#tartalom .pozracs .ang{ display:block; font-weight:700; color:#7c2f74; font-size:13px; }
#tartalom .pozracs .szan{ display:block; font-size:12.5px; color:#6b4a78; font-style:italic; margin-top:1px; }

/* kiemelt témakör: külön gomb közvetlenül a nagy játék-gomb alatt */
.kiemelt-gomb{
  display:flex; align-items:baseline; justify-content:center; gap:10px;
  width:100%; margin:8px 0 2px; padding:12px 18px; border:none; cursor:pointer;
  border-radius:14px; font:inherit; color:#fff;
  background:linear-gradient(100deg,#7b5fd0,#b06ad0 55%,#e0679f);
  box-shadow:0 4px 18px rgba(140,80,180,.3);
  transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
}
.kiemelt-gomb:hover{ transform:translateY(-2px); box-shadow:0 7px 22px rgba(140,80,180,.4); filter:brightness(1.06); }
.kiemelt-gomb .kg-nev{ font-size:16px; font-weight:700; letter-spacing:.2px; }
.kiemelt-gomb .kg-db{ font-size:13px; opacity:.8; }

/* gépelős válasz a kártyán */
.gy-iras{
  width:min(640px, 92%); min-height:130px; margin:14px auto 2px; display:block;
  padding:12px 14px; border-radius:14px; font:inherit; font-size:15.5px; line-height:1.6;
  color:var(--tinta); background:rgba(255,255,255,.72);
  border:1px solid rgba(164,140,255,.34); resize:vertical;
  -webkit-user-select:text; user-select:text;
  box-shadow:inset 0 1px 4px rgba(150,90,170,.1);
}
.gy-iras:focus{ outline:none; border-color:#c08ae0; background:rgba(255,255,255,.9); }
.gy-iras::placeholder{ color:#b79ac6; }

/* munkafüzet-kártya: egy póz, több önálló kérdés-válasz mező egymás alatt */
.gy-reszek{ width:min(640px, 94%); display:flex; flex-direction:column; gap:18px; margin:4px auto 0; text-align:left; }
.gy-resz{ padding-bottom:14px; border-bottom:1px solid rgba(164,140,255,.22); }
.gy-resz:last-child{ border-bottom:none; }
.gy-resz-cim{ font-size:13px; font-weight:700; letter-spacing:.3px; color:#8a5fa8; text-transform:uppercase; margin-bottom:2px; }
.gy-resz-kerdes{ font-size:16px; font-weight:600; color:var(--tinta); margin-bottom:8px; }
.gy-resz-iras{ width:100%; margin:0 0 2px; }
.gy-resz-valasz{
  margin-top:8px; font-size:14.5px; line-height:1.6; color:#6b4a78; white-space:pre-line;
  padding:10px 14px; border-radius:10px;
  background:rgba(255,255,255,.55); box-shadow:0 2px 12px rgba(180,90,190,.1);
}

.csoport-gomb{
  font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; color:#fff;
  border:none; border-radius:999px; padding:7px 15px;
  box-shadow:0 2px 10px rgba(150,90,170,.22);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.csoport-gomb:hover{ transform:translateY(-2px); box-shadow:0 5px 16px rgba(150,90,170,.34); filter:brightness(1.06); }
.csoport-gomb b{ font-weight:700; opacity:.75; margin-left:4px; }

/* ===== ÓRAREND-RÁCS ===== */
.orarend-allapot{
  display:flex; gap:16px; flex-wrap:wrap; align-items:center;
  margin:10px 0 14px; padding:12px 16px; border-radius:12px;
  background:linear-gradient(100deg, rgba(63,191,143,.16), rgba(79,168,255,.14));
  box-shadow:0 2px 12px rgba(80,150,180,.14), 0 0 0 1px rgba(255,255,255,.5);
  font-size:13px;
}
.orarend-allapot .cimke{ font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#5a9e8a; }
.orarend-allapot .fo{ font-size:15px; font-weight:700; color:var(--tinta); }
.orarend-allapot .mikor{ font-size:12px; color:var(--halk); }
.orarend-allapot.semmi{ background:rgba(255,255,255,.4); }

table.orarend{ table-layout:fixed; width:100%; }
table.orarend th{ font-size:11px; letter-spacing:.5px; padding:6px 4px; text-align:center; }
table.orarend td{ vertical-align:top; padding:5px 5px; font-size:11.5px; line-height:1.4; }
table.orarend td:empty{ background:rgba(255,255,255,.18); }

.ora-blokk{ padding:5px 6px; border-radius:8px; transition:background .2s ease, box-shadow .2s ease; }
.ora-ido{ font-weight:700; color:#7c2f74; display:block; }
.ora-ny{ font-size:10px; color:#b193c4; display:block; }
.ora-cim{ display:block; color:var(--tinta); margin:2px 0 1px; }
.ora-ki{ font-size:10.5px; color:var(--halk); display:block; }
.ora-blokk .utlink{ font-size:10.5px; padding:0 2px; }

/* most fut */
.ora-blokk.most{
  background:linear-gradient(140deg, rgba(63,191,143,.3), rgba(79,168,255,.24));
  box-shadow:0 0 0 2px rgba(63,191,143,.55), 0 3px 14px rgba(63,191,143,.3);
}
.ora-blokk.most .ora-ido::after{ content:" ● most"; color:#2c9c72; font-size:10px; }
/* következő */
.ora-blokk.kovetkezo{
  background:linear-gradient(140deg, rgba(255,90,164,.22), rgba(160,108,255,.2));
  box-shadow:0 0 0 2px rgba(255,90,164,.45);
}
.ora-blokk.kovetkezo .ora-ido::after{ content:" ▸ következő"; color:var(--kijelol); font-size:10px; }

/* ===================== SÚGÓ (GYIK) ===================== */
.sugo-gomb{
  position:absolute; right:26px; bottom:22px; z-index:9;
  width:34px; height:34px; border-radius:50%; cursor:pointer; border:none;
  font:inherit; font-size:16px; font-weight:700; color:#fff;
  background:linear-gradient(140deg, var(--magenta), var(--lila));
  box-shadow:0 3px 14px rgba(180,90,190,.35);
  transition:transform .14s ease, box-shadow .14s ease;
}
.sugo-gomb:hover{ transform:translateY(-2px) scale(1.06); box-shadow:0 6px 20px rgba(180,90,190,.45); }

.sugo-fatyol{
  position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
  background:rgba(80,40,90,.28);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.sugo-fatyol.rejtve{ display:none !important; }
.sugo-ablak{
  width:min(760px, 84%); max-height:82%; display:flex; flex-direction:column;
  background:linear-gradient(168deg, #fdf4fa, #f6ecfb);
  border-radius:16px; box-shadow:0 20px 60px rgba(110,45,110,.34), 0 0 0 1px rgba(255,255,255,.6);
  overflow:hidden;
}
.sugo-fej{
  display:flex; align-items:center; gap:10px; padding:16px 20px 12px;
  border-bottom:1px solid rgba(150,95,140,.16);
}
.sugo-fej h3{
  margin:0; flex:1; font-size:15px; font-weight:700; letter-spacing:.4px;
  background:linear-gradient(96deg, var(--magenta), var(--lila) 55%, var(--azur));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.sugo-kereso{
  font:inherit; font-size:12.5px; padding:5px 10px; width:190px;
  border:1px solid rgba(150,95,140,.25); border-radius:8px; outline:none;
  background:rgba(255,255,255,.7); color:var(--tinta);
}
.sugo-kereso:focus{ border-color:var(--magenta); }
.sugo-torzs{
  overflow-y:auto; padding:6px 20px 20px;
  -webkit-user-select:text; user-select:text;
}
.sugo-torzs::-webkit-scrollbar{ width:6px; }
.sugo-torzs::-webkit-scrollbar-thumb{ background:linear-gradient(var(--lila), var(--azur)); border-radius:99px; }

.gyik{ border-bottom:1px solid rgba(150,95,140,.12); }
.gyik.rejtve{ display:none; }
.gyik-k{
  display:flex; gap:8px; align-items:flex-start; cursor:pointer;
  padding:11px 4px; font-size:13.5px; font-weight:600; color:var(--tinta);
}
.gyik-k .nyil{ flex:none; color:#b07ad0; font-size:10px; margin-top:3px; transition:transform .16s ease; }
.gyik.nyitva .gyik-k .nyil{ transform:rotate(90deg); }
.gyik-v{ display:none; padding:0 4px 13px 22px; font-size:13px; line-height:1.65; color:#6b4a78; }
.gyik.nyitva .gyik-v{ display:block; }
.gyik-v strong{ color:#7c2f74; }
.gyik-nincs{ padding:22px 4px; text-align:center; color:var(--halk); font-style:italic; font-size:13px; }

/* ===================== KÉRDÉSEK ===================== */
.kerdesek{
  flex:1; min-height:0; overflow-y:auto; padding:2px 70px 28px 50px;
  -webkit-user-select:text; user-select:text;
}
.kerdesek::-webkit-scrollbar{ width:6px; }
.kerdesek::-webkit-scrollbar-thumb{ background:linear-gradient(var(--lila), var(--azur)); border-radius:99px; }

.kerdes-kartya{
  background:rgba(255,255,255,.45); border:1px solid rgba(150,95,140,.16);
  border-radius:11px; padding:11px 14px; margin-bottom:8px;
}
.kerdes-kartya.esedekes-jel{ border-color:rgba(255,90,164,.5); box-shadow:0 0 0 1px rgba(255,90,164,.2); }
.kerdes-fej{ display:flex; align-items:baseline; gap:8px; }
.kerdes-sorszam{ flex:none; font-size:11px; font-weight:700; color:#c58ad8; min-width:18px; }
.kerdes-szoveg{ flex:1; font-size:14px; font-weight:600; color:var(--tinta); outline:none; }
.kerdes-valasz{ font-size:13.5px; color:var(--halk); margin:5px 0 0 26px; line-height:1.6; outline:none; }
.kerdes-valasz:empty::before{ content:"válasz…"; color:#c9aed4; font-style:italic; }
.kerdes-labjegyzet{ display:flex; align-items:center; gap:8px; margin:6px 0 0 26px; font-size:11px; color:#b193c4; }
.kerdes-labjegyzet .torolK{ cursor:pointer; color:#c78ab4; }
.kerdes-labjegyzet .torolK:hover{ color:var(--kijelol); }
.lepcso-jel{
  display:inline-block; height:5px; border-radius:99px; min-width:5px;
  background:linear-gradient(90deg, var(--magenta), var(--azur));
}

/* kártyakép — a fotó kap fehér alátétet, a rajz és a kollázs nem */
.gy-kep.kiser{ max-width:min(900px, 62vh); max-height:62vh; opacity:1; }
.gy-kep{
  max-width:min(300px, 38vh); max-height:38vh; border-radius:14px;
  background:rgba(255,255,255,.65); padding:8px;
  box-shadow:0 6px 26px rgba(150,90,170,.22);
}
/* átlátszó hátterű rajz: keret nélkül, szabadon */
.gy-kep.szabad{
  background:none; padding:0; box-shadow:none; border-radius:0;
  max-width:min(440px, 50vh); max-height:50vh;
}
/* álló képek (csakratáblák): keret nélkül, magasra engedve */
.gy-kep.tabla{
  background:none; padding:0; box-shadow:0 8px 30px rgba(60,20,80,.22);
  border-radius:14px; max-width:min(360px, 40vh); max-height:44vh;
}
/* eltérés a kurzus anyagától — figyelmeztető blokk */
#tartalom blockquote.megjegyzes-blokk{
  border-left-color:#e8a33c; background:rgba(255,200,120,.16);
  color:#8a5a20; font-style:normal; font-size:13.5px;
}
#tartalom blockquote.megjegyzes-blokk strong{ color:#b0701f; }

/* ábra a vázlatban, magyarázó felirattal */
#tartalom figure.abra{
  float:right; width:300px; max-width:42%; margin:2px 0 14px 24px;
  text-align:center; cursor:zoom-in;
}
/* a következő szakasz ne csússzon a kép mellé */
#tartalom h2, #tartalom h3{ clear:both; }
#tartalom figure.abra:hover img{ box-shadow:0 8px 30px rgba(120,60,140,.3); transform:translateY(-2px); }
#tartalom figure.abra img{ transition:transform .14s ease, box-shadow .14s ease; }
#tartalom figure.abra img{
  width:100%; height:auto; display:block; border-radius:14px;
  box-shadow:0 6px 24px rgba(120,60,140,.18);
}
#tartalom figure.abra figcaption{
  margin-top:8px; font-size:13px; line-height:1.55; color:#6b4a78; text-align:left;
}
#tartalom figure.abra figcaption strong{ color:#7c2f74; }

/* párosító játék */
.gy-kerdes.kicsi{ font-size:17px; font-weight:600; color:#8a5fa8; margin-bottom:14px; }
.par-tabla{ width:min(760px, 94%); margin:0 auto; }
.par-celok{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
.par-cel{
  flex:0 0 auto; min-width:150px; padding:10px 12px 8px; border-radius:14px;
  background:rgba(255,255,255,.55); border:2px dashed rgba(164,140,255,.42);
  transition:background .14s ease, border-color .14s ease, transform .14s ease;
}
.par-cel.celzott{ background:rgba(255,255,255,.9); border-color:var(--magenta); transform:translateY(-2px); }
.par-cel.kesz{ border-style:solid; border-color:rgba(80,200,150,.5); background:rgba(180,240,215,.4); }
.par-cimke{ font-size:17px; font-weight:800; color:#7c2f74; text-align:center; }
.par-hely{ min-height:40px; display:flex; align-items:center; justify-content:center; margin-top:6px; }

.par-keszlet{
  display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
  margin-top:26px; padding-top:20px; border-top:1px dashed rgba(164,140,255,.35);
  min-height:52px;
}
.par-chip{
  font-size:16px; font-weight:700; color:#fff; cursor:grab; user-select:none;
  padding:9px 18px; border-radius:22px;
  background:linear-gradient(100deg, var(--magenta), var(--lila));
  box-shadow:0 3px 14px rgba(180,90,190,.3);
  transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
}
.par-chip small{ display:block; font-size:12px; font-weight:600; opacity:.82; margin-top:1px; }
.par-chip:hover{ transform:translateY(-2px); filter:brightness(1.06); }
.par-chip.valasztva{ outline:3px solid #ffd06b; outline-offset:2px; }
.par-chip.huzas-kozben{ opacity:.25; }
.par-chip.huzott{
  position:fixed; z-index:90; pointer-events:none; cursor:grabbing;
  transform:scale(1.06) rotate(-2deg); box-shadow:0 10px 30px rgba(120,40,140,.4);
}
.par-chip.jo{
  cursor:default; background:linear-gradient(100deg,#4ec49a,#3fa9c4);
  box-shadow:0 2px 10px rgba(60,180,150,.3);
}
.par-chip.rossz{ animation:par-razas .45s ease; }
@keyframes par-razas{
  0%,100%{ transform:translateX(0) }
  20%{ transform:translateX(-7px) } 40%{ transform:translateX(7px) }
  60%{ transform:translateX(-5px) } 80%{ transform:translateX(5px) }
}

/* felfedés után: szó + bélyegkép egy sorban, alatta középen a válasz */
.gy-fejsor{
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin-bottom:6px; flex-wrap:wrap;
}
.gy-belyegkep{
  width:86px; height:86px; object-fit:cover; border-radius:14px; flex:none;
  box-shadow:0 5px 20px rgba(60,20,80,.2);
}
.gy-szo{ font-size:30px; font-weight:700; color:var(--tinta); line-height:1.15; }
.gy-belso.valasz-latszik .gy-valasz{ margin-top:4px; }

/* felfedés után a kép összébb húzódik, hogy a válasz is elférjen görgetés nélkül */
.gy-belso.valasz-latszik .gy-kep.tabla{ max-width:min(250px, 27vh); max-height:30vh; }
.gy-belso.valasz-latszik .gy-kep.szabad{ max-width:min(300px, 34vh); max-height:34vh; }
.gy-belso.valasz-latszik .gy-kep.kollazs{ max-height:48vh; }
.gy-belso.valasz-latszik .gy-kep.kiser{ max-height:42vh; }

/* a 8 ág kollázslapjai: keret nélkül és jóval nagyobban */
.gy-kep.kollazs{
  background:none; padding:0; box-shadow:none; border-radius:18px;
  max-width:min(1100px, 76vh); max-height:76vh;
}
.kerdes-belyeg{
  width:44px; height:44px; object-fit:contain; flex:none; border-radius:8px;
  background:rgba(255,255,255,.6); padding:2px;
}
.valasz-sorok{ display:flex; flex-direction:column; gap:3px; }
.valasz-sorok .fo{ font-size:21px; font-weight:700; color:var(--tinta); }
.valasz-sorok .fo2{ font-size:19px; font-weight:700; color:#7c2f74; }
.valasz-sorok .mellek{ font-size:15px; color:#6b4a78; }
.valasz-sorok .halk{ font-size:14px; color:var(--halk); }
.valasz-sorok .megjegyzes{
  font-size:11.5px; line-height:1.5; color:#b07a3c; font-style:italic;
  max-width:420px; margin-top:4px; text-align:left;
  background:rgba(255,200,120,.16); border-radius:8px; padding:6px 10px;
}
.valasz-sorok .kiejt{ font-size:13.5px; color:var(--halk); font-style:italic; }

/* ===================== GYAKORLÁS ===================== */
.gyakorlas{
  flex:1; min-height:0; display:flex; flex-direction:column;
  padding:2px 34px 12px 30px;
}
.gy-fejlec{ display:flex; align-items:center; gap:10px; margin-bottom:6px; flex:none; }
.gy-halado{ flex:1; height:5px; border-radius:99px; background:rgba(255,255,255,.5); overflow:hidden; }
.gy-halado i{ display:block; height:100%; background:linear-gradient(90deg, var(--magenta), var(--lila), var(--azur)); transition:width .3s ease; }
.gy-szamlalo{ font-size:11.5px; color:var(--halk); flex:none; }

.gy-kartya{
  flex:1; min-height:0; overflow-y:auto;
  display:flex;                      /* a belső dobozt margin:auto igazítja középre */
  padding:8px 18px 14px;
  -webkit-user-select:text; user-select:text;
}
.gy-kartya::-webkit-scrollbar{ width:6px; }
.gy-kartya::-webkit-scrollbar-thumb{ background:linear-gradient(var(--lila), var(--azur)); border-radius:99px; }

/* margin:auto — így ha a tartalom magasabb a doboznál, felül sem vágódik le */
.gy-belso{
  margin:auto; width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  text-align:center; gap:14px;
}
.gy-kerdes{ font-size:27px; font-weight:700; line-height:1.35; color:var(--tinta); max-width:640px; letter-spacing:.2px; }
.gy-valasz{
  font-size:15.5px; line-height:1.6; color:#6b4a78; max-width:640px;
  padding:12px 18px; border-radius:12px;
  background:rgba(255,255,255,.55); box-shadow:0 2px 14px rgba(180,90,190,.12);
}
.gy-gombsor{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

/* a válaszgombok mindig ugyanott — nem kell értük görgetni */
.gy-sav{
  flex:none; display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:10px 0 2px; min-height:64px; justify-content:center;
}
.gy-gomb{
  font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; border:none;
  border-radius:10px; padding:10px 22px; color:#fff;
  transition:transform .12s ease, box-shadow .12s ease;
}
.gy-gomb:hover{ transform:translateY(-1px); }
.gy-gomb.fo{ background:linear-gradient(100deg, var(--lila), var(--azur)); box-shadow:0 3px 14px rgba(120,120,255,.3); }
.gy-gomb.jo{ background:linear-gradient(100deg, #3fbf8f, #4fa8ff); box-shadow:0 3px 14px rgba(63,191,143,.3); }
.gy-gomb.nem{ background:linear-gradient(100deg, var(--magenta), #ff8a5a); box-shadow:0 3px 14px rgba(255,90,164,.3); }
.gy-gomb.halk{ background:rgba(255,255,255,.6); color:#8a5fa8; box-shadow:none; }
.gy-sugo{ font-size:11.5px; color:#b193c4; font-style:italic; }

/* íráskor halkul a látvány, hogy ne vonja el a figyelmet */
.lap.iras-kozben .vilag{ opacity:.5; transition:opacity .6s ease; }
.lap .vilag{ transition:opacity .9s ease; }

.uresen{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  color:#a483b4; font-size:14px; font-style:italic; text-align:center; line-height:1.8; padding:0 60px;
}

.rejtve{ display:none !important; }

@media (prefers-reduced-motion: reduce){
  .folt, .pillango, .szikra, .orchidea, .orchidea2{ animation:none !important; }
}

/* ===================== MENETREND ===================== */
#menetrendNezet{ padding:0 70px 40px 50px; }

/* — stopper — */
.mr-stopper{
  display:flex; align-items:center; gap:16px; margin:2px 0 16px;
  background:linear-gradient(120deg, rgba(255,255,255,.72), rgba(255,240,250,.6));
  border:1px solid rgba(150,95,140,.2); border-radius:16px; padding:14px 18px;
  box-shadow:0 6px 20px rgba(150,80,150,.1);
}
.mr-stopper.fut{
  border-color:rgba(255,90,164,.55);
  background:linear-gradient(120deg, rgba(255,222,240,.85), rgba(232,225,255,.7));
  box-shadow:0 6px 26px rgba(255,90,164,.24);
}
.mr-ora{
  font:700 30px/1 "SF Mono", ui-monospace, Menlo, monospace;
  letter-spacing:1px; color:var(--kijelol); font-variant-numeric:tabular-nums;
}
.mr-stopper.fut .mr-ora{ animation:mrLuktet 2.4s ease-in-out infinite; }
@keyframes mrLuktet{ 0%,100%{ opacity:1 } 50%{ opacity:.6 } }
.mr-ora-alatt{ font-size:11.5px; color:var(--halk); margin-top:3px; }
.mr-nagygomb{
  flex:none; border:0; cursor:pointer; border-radius:12px; padding:11px 20px;
  font:700 14px/1 inherit; color:#fff;
  background:linear-gradient(120deg, var(--magenta), var(--lila));
  box-shadow:0 4px 14px rgba(255,90,164,.35);
  transition:transform .12s ease, box-shadow .12s ease;
}
.mr-nagygomb:hover{ transform:translateY(-1px); box-shadow:0 7px 18px rgba(255,90,164,.45); }
.mr-nagygomb.leallit{ background:linear-gradient(120deg,#ff7a5a,#ff5aa4); }
.mr-terkitolto{ flex:1; }

/* — összegzés — */
.mr-osszegzo{
  background:rgba(255,255,255,.5); border:1px solid rgba(150,95,140,.18);
  border-radius:14px; padding:13px 17px; margin-bottom:18px;
}
.mr-cel{ font-size:15px; font-weight:700; color:#7c2f74; }
.mr-cel b{ color:var(--kijelol); }
.mr-sav{
  height:8px; border-radius:99px; background:rgba(160,110,190,.16);
  margin:10px 0 8px; overflow:hidden;
}
.mr-sav i{ display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg, var(--magenta), var(--lila) 55%, var(--azur)); }
.mr-adatok{ display:flex; gap:18px; flex-wrap:wrap; font-size:11.5px; color:var(--halk); }
.mr-adatok b{ color:#8a5fa8; font-size:12.5px; }

/* — beállítás — */
.mr-beallit{ display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:11.5px; color:var(--halk); margin-top:11px;
  padding-top:10px; border-top:1px solid rgba(120,80,140,.13); }
.mr-beallit input[type=number]{
  width:52px; font:600 12px/1 inherit; color:var(--tinta); text-align:center;
  border:1px solid rgba(150,95,140,.3); border-radius:7px; padding:4px 5px;
  background:rgba(255,255,255,.7); outline:none;
}
.mr-beallit input[type=number]:focus{ border-color:var(--magenta); }
.mr-nap-pipa{ display:flex; gap:4px; }
.mr-nap-pipa span{
  cursor:pointer; width:23px; height:22px; border-radius:7px; font-size:11px; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(150,95,140,.25); background:rgba(255,255,255,.6); color:var(--halkabb);
}
.mr-nap-pipa span.piheno{ background:linear-gradient(130deg,#ffd5e8,#e4d8ff); color:#a0459a; border-color:rgba(255,90,164,.4); }

/* — napok — */
.mr-nap{ margin-bottom:9px; }
.mr-nap-fej{
  display:flex; align-items:center; gap:10px; cursor:pointer;
  padding:8px 12px; border-radius:11px;
  background:rgba(255,255,255,.42); border:1px solid rgba(150,95,140,.15);
}
.mr-nap-fej:hover{ background:rgba(255,255,255,.66); }
.mr-nap.ma .mr-nap-fej{
  background:linear-gradient(100deg, rgba(255,150,200,.3), rgba(160,108,255,.2) 75%);
  border-color:rgba(255,90,164,.45);
}
.mr-nap-datum{ font-size:13.5px; font-weight:700; color:#7c2f74; }
.mr-nap.ma .mr-nap-datum{ color:var(--kijelol); }
.mr-nap-cimke{
  font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
  color:#fff; background:linear-gradient(120deg,var(--magenta),var(--lila));
  padding:3px 8px; border-radius:99px;
}
.mr-nap-perc{ font-size:11.5px; color:var(--halk); margin-left:auto; }
.mr-nap-nyil{ font-size:11px; color:var(--halkabb); transition:transform .15s ease; }
.mr-nap.nyitva .mr-nap-nyil{ transform:rotate(90deg); }
.mr-nap-torzs{ display:none; padding:8px 0 4px 4px; }
.mr-nap.nyitva .mr-nap-torzs{ display:block; }

/* — tételek — */
.mr-tetel{
  display:flex; align-items:flex-start; gap:10px;
  background:rgba(255,255,255,.5); border:1px solid rgba(150,95,140,.16);
  border-left:3px solid var(--lila);
  border-radius:10px; padding:8px 12px; margin-bottom:5px;
}
.mr-tetel.kesz{ border-left-color:#3fbf8f; opacity:.55; }
.mr-tetel.kihagyva{ border-left-color:#c9aed4; opacity:.45; }
.mr-tetel[data-tipus="v"]{ border-left-color:var(--azur); }
.mr-tetel[data-tipus="gy"]{ border-left-color:var(--magenta); }
.mr-tetel[data-tipus="k"]{ border-left-color:#ffab3d; }
.mr-tetel[data-tipus="b"]{ border-left-color:#7c2f74; }
.mr-pipa{
  flex:none; width:19px; height:19px; margin-top:1px; cursor:pointer;
  border-radius:6px; border:1.6px solid #c58ad8; background:rgba(255,255,255,.7);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; color:#fff; transition:background .12s ease, border-color .12s ease;
}
.mr-pipa:hover{ border-color:var(--magenta); }
.mr-tetel.kesz .mr-pipa{ background:linear-gradient(140deg,#3fbf8f,#4fa8ff); border-color:#3fbf8f; }
.mr-torzs{ flex:1; min-width:0; -webkit-user-select:text; user-select:text; }
.mr-cim{ font-size:13.5px; font-weight:600; color:var(--tinta); }
.mr-cim.link{ cursor:pointer; }
.mr-cim.link::after{ content:"  → lecke"; font-size:11.5px; font-weight:600; color:var(--kijelol); opacity:.75; }
.mr-potlo{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:-6px 0 14px 4px; font-size:12.5px; color:var(--halk); }
.mr-potlo-nyito{ cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.mr-potlo-nyito:hover{ color:var(--kijelol); }
.mr-potlo select, .mr-potlo input{ font:inherit; font-size:12.5px; padding:4px 8px; border-radius:8px; border:1px solid rgba(164,140,255,.35); background:rgba(255,255,255,.75); color:var(--tinta); }
.mr-potlo input{ width:64px; }
.mr-potlo-gomb{ font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; border:none; border-radius:8px; padding:5px 12px; color:#fff; background:linear-gradient(100deg, var(--lila), var(--azur)); }
.mr-cim.link:hover{ color:var(--kijelol); text-decoration:underline; }
.gyak-tetel.menetrendi .gyak-also{ font-size:11.5px; color:var(--halk); }
.mr-tetel.kesz .mr-cim, .mr-tetel.kihagyva .mr-cim{ text-decoration:line-through; color:var(--halk); }
.mr-also{ display:flex; align-items:center; gap:9px; margin-top:2px; font-size:11.5px; color:#b193c4; }
.mr-modul{ font-weight:600; color:#a486b8; }
.mr-kihagy{
  flex:none; cursor:pointer; color:#c9aed4; font-size:12px; padding:1px 7px;
  border-radius:6px; opacity:.4; transition:opacity .12s ease, background .12s ease;
}
.mr-kihagy:hover{ opacity:1; background:rgba(255,90,164,.14); color:var(--kijelol); }

.mr-tovabb{
  display:block; margin:12px auto 0; cursor:pointer; border:0; border-radius:10px;
  padding:8px 18px; font:600 12.5px/1 inherit; color:#8a5fa8;
  background:rgba(255,255,255,.55); border:1px solid rgba(150,95,140,.2);
}
.mr-tovabb:hover{ color:var(--kijelol); background:rgba(255,255,255,.8); }
.mr-kesz-uzenet{ text-align:center; padding:40px 20px; font-size:16px; font-weight:700; color:#7c2f74; }

/* ===================== GYAKORLAT-ÁTTEKINTŐ ===================== */
#gyakorlatokNezet{ flex:1; min-height:0; overflow-y:auto; padding:6px 70px 40px 50px; }
#gyakorlatokNezet::-webkit-scrollbar{ width:6px; }
#gyakorlatokNezet::-webkit-scrollbar-thumb{ background:linear-gradient(var(--lila), var(--azur)); border-radius:99px; }

.gl-fej{ display:flex; align-items:baseline; gap:12px; margin:0 0 18px; }
.gl-cim{ font-size:29px; font-weight:700; color:#8a5fa8; line-height:1.25; }
.gl-db{ font-size:13px; color:var(--halk); }
.gl-alcim{ font-size:12.5px; color:var(--halk); margin-bottom:18px; }

.gl-kitolto{ flex:1; }
.gl-kesz-kapcs{
  display:inline-flex; align-items:center; gap:5px; cursor:pointer; align-self:center;
  font-size:11.5px; font-weight:700; color:#a486b8;
  padding:5px 11px; border-radius:99px;
  background:rgba(255,255,255,.5); border:1px solid rgba(150,95,140,.2);
}
.gl-kesz-kapcs:hover{ color:var(--kijelol); background:rgba(255,255,255,.8); }
.gl-kesz-kapcs .nyil{ font-size:11px; transition:transform .15s ease; }
.gl-kesz-kapcs.nyitva .nyil{ transform:rotate(90deg); }
.gl-kesz-kapcs.nyitva{ color:#7c2f74; border-color:rgba(255,90,164,.4); }

.gl-csoport{ margin-bottom:16px; }
.gl-lecke{
  display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  font-size:13px; font-weight:700; color:var(--kijelol); margin:0 0 7px;
  padding:3px 10px 3px 0; border-radius:8px;
}
.gl-lecke:hover{ color:#7c2f74; }
.gl-lecke .nyil{ font-size:11px; color:var(--halkabb); }
.gl-lecke:hover .nyil{ color:var(--kijelol); }

.gl-szakaszcim{
  font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
  color:var(--halkabb); margin:26px 0 10px;
  padding-top:14px; border-top:1px solid rgba(120,80,140,.15);
}
.gl-ures{ text-align:center; padding:60px 20px; }
.gl-ures .fo{ font-size:17px; font-weight:700; color:#7c2f74; margin-bottom:6px; }
.gl-ures .alsor{ font-size:13px; color:var(--halk); }
/* ===================== FELHŐ: belépő és állapotjelző ===================== */
#felhoAllapot{
  flex:none; padding:0 18px; font-size:10.5px; color:#b79ccb; letter-spacing:.3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#felhoAllapot[data-allapot="hiba"]{ color:#c98aa8; }

#felhoBelepo{
  position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  padding:20px; background:rgba(246,217,236,.72);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
}
.fb-doboz{
  width:100%; max-width:340px; display:flex; flex-direction:column; gap:10px;
  padding:26px 22px 20px; border-radius:20px;
  background:linear-gradient(168deg, #fdf4fa, #f3e8fb 60%, #e8effb);
  box-shadow:0 22px 60px rgba(120,60,140,.24), 0 0 0 1px rgba(255,255,255,.7);
}
.fb-cim{
  font-size:24px; font-weight:700; text-align:center;
  background:linear-gradient(96deg, var(--magenta), var(--lila) 55%, var(--azur));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.fb-al{ font-size:13px; color:#8a6a9a; text-align:center; line-height:1.5; margin-bottom:4px; }
.fb-doboz input{
  font:inherit; font-size:16px; padding:11px 13px; border-radius:11px; color:var(--tinta);
  border:1px solid rgba(164,140,255,.35); background:rgba(255,255,255,.85); outline:none;
  -webkit-user-select:text; user-select:text;
}
.fb-doboz input:focus{ border-color:var(--magenta); }
.fb-gomb{
  font:inherit; font-size:16px; font-weight:600; padding:11px; border:none; border-radius:11px; cursor:pointer;
  color:#fff; background:linear-gradient(100deg, var(--magenta), var(--lila));
}
.fb-uzenet{ min-height:18px; font-size:12.5px; color:#b0508a; text-align:center; }
.fb-kesobb{ font:inherit; font-size:12.5px; border:none; background:none; color:var(--halk); text-decoration:underline; cursor:pointer; }

/* ===================== TELEFON ===================== */
