/* ===== BEÍRT VÁLASZ ELLENŐRZÉSE ===== */
/* Ékezet, kis-nagybetű, írásjel és a fölösleges szóköz nem számít.
   A vesszővel/perjellel elválasztott változatok közül bármelyik jó. */
function egyszerusit(sz){
  return (sz || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/^(to|a|az|the)\s+/, "")
    .replace(/[.,;:!?()"'`´’-]/g, " ")
    .replace(/\s+/g, " ").trim();
}

/* Kereséshez: kisbetű + ékezet nélkül, de a hossz NEM változik,
   különben elcsúszik a találat helye az eredeti szövegben. */
function lapit(sz){
  return (sz || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function valaszHelyesE(beirt, vart){
  const b = egyszerusit(beirt);
  if (!b) return false;
  return String(vart || "").split(/[,/]|\bvagy\b/)
    .map(egyszerusit).filter(Boolean)
    .some(v => v === b);
}

/* ===== ÉLŐ ÓRA: FIGYELMEZTETÉS 10 PERCCEL ELŐTTE ===== */
const ORA_ELOTT = 10;
let mar_szoltam = new Set();

function oraFigyeles(){
  setInterval(oraEllenoriz, 30000);
  oraEllenoriz();
}

function oraEllenoriz(){
  const most_ = percAHetben();
  for (const l of leckek){
    const talalat = (l.html || "").matchAll(
      /data-kezd="(\d+)"[^>]*data-veg="\d+"[^>]*data-cim="([^"]*)"[^>]*data-ido="([^"]*)"[^>]*data-nap="([^"]*)"/g);
    for (const m of talalat){
      const kezd = +m[1];
      let tav = kezd - most_;
      if (tav < -60) tav += 7 * 1440;              /* a hét körbeér */
      if (tav > ORA_ELOTT || tav < 0) continue;
      const kulcs = kezd + "|" + m[2];
      if (mar_szoltam.has(kulcs)) continue;
      mar_szoltam.add(kulcs);
      oraAblak(szovegDekod(m[2]), m[3], m[4], Math.max(0, Math.round(tav)));
    }
  }
  if (mar_szoltam.size > 40) mar_szoltam = new Set();
}

function szovegDekod(s){
  const d = document.createElement("textarea"); d.innerHTML = s; return d.value;
}

function oraAblak(cim, ido, nap, perc){
  const regi = document.getElementById("oraFigyelmeztetes");
  if (regi) regi.remove();
  const f = document.createElement("div");
  f.className = "ora-ertesito"; f.id = "oraFigyelmeztetes";
  f.innerHTML =
    '<div class="oe-doboz">' +
      '<div class="oe-fejlec">Élő óra ' + (perc <= 0 ? "most kezdődik" : perc + " perc múlva") + '</div>' +
      '<div class="oe-cim"></div>' +
      '<div class="oe-mikor"></div>' +
      '<div class="oe-gombok">' +
        '<button class="oe-gomb fo">Megyek</button>' +
        '<button class="oe-gomb halk">Most nem</button>' +
      '</div>' +
    '</div>';
  f.querySelector(".oe-cim").textContent = cim;
  f.querySelector(".oe-mikor").textContent = nap + " · " + ido;
  document.body.appendChild(f);
  const zar = () => f.remove();
  f.querySelector(".oe-gomb.fo").onclick = () => {
    zar();
    const z = leckek.find(x => x.cim === "Zoom élő hívások");
    if (z) leckereUgrik(z.id, "");
  };
  f.querySelector(".oe-gomb.halk").onclick = zar;
  f.onclick = e => { if (e.target === f) zar(); };
}

/* ===== KÉPNAGYÍTÓ: a galéria képei nagyban, lapozhatóan ===== */
let nagyitoLista = [], nagyitoHol = 0;

function nagyitoNyit(racs, kezd){
  nagyitoLista = Array.from(racs.querySelectorAll("figure")).map(f => ({

  })).filter(x => x.src);

function nagyitoEgy(src, felirat){

function nagyitoLep(merre){

/* ===== LECKÉK KÖZTI UGRÁS, VISSZAÚTTAL ===== */
let honnanJottem = [];

function leckereUgrik(cel, horgony){
  const l = leckek.find(x => x.id === cel || x.cim.trim() === String(cel).trim());
  if (!l) return;
  kurzortElenged();
  if (kivalasztottId && kivalasztottId !== l.id) honnanJottem.push(kivalasztottId);
  kivalasztottId = l.id; aktivFul = "vazlat"; gyakorlasSor = null;

  if (horgony) setTimeout(() => {

  frissitVisszaNyilat();
}

function visszaLepek(){
  const elozo = honnanJottem.pop();
  if (!elozo) return;
  kivalasztottId = elozo; aktivFul = "vazlat"; gyakorlasSor = null;
  rajzol(); frissitVisszaNyilat();
}

/* ===== ÉLŐ ÓRAREND: mi megy most, mi jön ===== */
function percAHetben(){
  const most_ = new Date();
  const r = new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Budapest", hour12: false,
      weekday: "short", hour: "2-digit", minute: "2-digit" })
    .formatToParts(most_).reduce((o, x) => (o[x.type] = x.value, o), {});
  const napok = { Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:5, Sun:6 };
  return (napok[r.weekday] ?? 0) * 1440 + (+r.hour % 24) * 60 + (+r.minute);
}

function idotartam(perc){
  if (perc < 60) return perc + " perc";
  const o = Math.floor(perc / 60), p = perc % 60;
  if (o < 24) return o + " óra" + (p ? " " + p + " perc" : "");
  return Math.round(o / 24) + " nap";
}

function frissitOrarend(){
  const blokkok = $("tartalom").querySelectorAll(".ora-blokk[data-kezd]");
  const allapot = $("tartalom").querySelector(".orarend-allapot");
  if (!blokkok.length) return;

  const most_ = percAHetben();
  let fut = null, kov = null, kovTav = Infinity;

  for (const b of blokkok){
    b.classList.remove("most", "kovetkezo");
    const k = +b.dataset.kezd, v = +b.dataset.veg;
    if (k <= most_ && most_ < v){ fut = b; continue; }
    /* a hét körbeér, ezért a távolság moduló egy hét */
    let tav = k - most_;
    if (tav < 0) tav += 7 * 1440;
    if (tav < kovTav){ kovTav = tav; kov = b; }
  }

  if (fut) fut.classList.add("most");
  if (kov) kov.classList.add("kovetkezo");
  if (!allapot) return;

  allapot.innerHTML = "";
  allapot.classList.toggle("semmi", !fut);
  const cella = (cimke, fo, mikor) => {
    const d = document.createElement("div");
    const c = document.createElement("div"); c.className = "cimke"; c.textContent = cimke;
    const f = document.createElement("div"); f.className = "fo"; f.textContent = fo;
    const m = document.createElement("div"); m.className = "mikor"; m.textContent = mikor;
    d.appendChild(c); d.appendChild(f); d.appendChild(m);
    return d;
  };

  if (fut){
    const hatra = +fut.dataset.veg - most_;
    allapot.appendChild(cella("Most fut", fut.dataset.cim,
      "még " + idotartam(hatra) + " · " + fut.dataset.ido));
  } else {
    allapot.appendChild(cella("Most", "nincs élő óra", ""));
  }
  if (kov){
    allapot.appendChild(cella("Következik", kov.dataset.cim,
      idotartam(kovTav) + " múlva · " + kov.dataset.nap + " " + kov.dataset.ido));
  }
}

      (elteres !== 6 ? "<br><span style='color:#c2521f'>szokatlan — figyelj!</span>" : "");
    d.appendChild(e);

function tippKotesek(){

    let x = r.left - lap.left + r.width / 2 - sz_ / 2;

    if (e.target.closest(".tipp")) ablak.classList.remove("latszik");
  });

function rajzolGyik(szures){
  const doboz = $("sugoTorzs");
  doboz.innerHTML = "";
  const sz = (szures || "").trim().toLowerCase();
  let talalat = 0;

  GYIK.forEach((tetel, i) => {
    const egyezik = !sz || (tetel.k + " " + tetel.v).toLowerCase().indexOf(sz) >= 0;
    if (!egyezik) return;
    talalat++;

    const d = document.createElement("div");
    d.className = "gyik" + (sz ? " nyitva" : "");

    const k = document.createElement("div");
    k.className = "gyik-k";
    const nyil = document.createElement("span");
    nyil.className = "nyil"; nyil.textContent = "\u25B6";
    k.appendChild(nyil);
    const kszoveg = document.createElement("span");
    kszoveg.textContent = tetel.k;
    k.appendChild(kszoveg);
    k.onclick = () => d.classList.toggle("nyitva");
    d.appendChild(k);

    const v = document.createElement("div");
    v.className = "gyik-v";
    v.innerHTML = tetel.v;
    d.appendChild(v);

    doboz.appendChild(d);
  });

  if (!talalat){
    const u = document.createElement("div");
    u.className = "gyik-nincs";
    u.textContent = "Erre nincs találat. Kérdezd meg őket: contact@yogarenewteachertraining.com";
    doboz.appendChild(u);
  }
}

function sugoNyit(){
  $("sugoFatyol").classList.remove("rejtve");
  $("sugoKereso").value = "";
  rajzolGyik("");
  setTimeout(() => $("sugoKereso").focus(), 60);
}
function sugoZar(){ $("sugoFatyol").classList.add("rejtve"); }

function sugoKotesek(){
  $("sugoGomb").onclick = sugoNyit;
  $("sugoBezar").onclick = sugoZar;
  $("sugoKereso").oninput = () => rajzolGyik($("sugoKereso").value);
  $("sugoFatyol").onclick = e => { if (e.target === $("sugoFatyol")) sugoZar(); };
}

function fajlNev(ut){
  const darabok = ut.replace(/\/+$/, "").split("/");
  return decodeURIComponent(darabok[darabok.length - 1] || ut);
}

/* külső link a rendszer böngészőjében, helyi fájl a saját appjában nyílik */
function megnyitKivul(url){
  if (!url) return;
  if (hid) hid.postMessage({ tipus:"link", url: url });
  else window.open(url, "_blank");
}

    vszoveg.contentEditable = "true"; vszoveg.spellcheck = true;
    vszoveg.textContent = k.valasz;

/* ===== GYAKORLÁS ===== */
const ISMETLES_ADAG = 30;

function inditGyakorlas(leckeId, mod){
  const forras = leckeId ? leckek.filter(l => l.id === leckeId) : leckek.filter(ismetlesbeSzamit);
  const tetelek = [];
  for (const l of forras)
    for (const k of foKartyak(l))
      if (esedekesE(k) || leckeId) tetelek.push({ lecke: l, kerdes: k });

  if (!tetelek.length){
    gyakorlasSor = { tetelek: [], mutato: 0, valaszLatszik: false, jo: 0, rossz: 0 };
    rajzolFo();
    return;
  }
  /* keverés, hogy ne a sorrendet tanulja meg */
  for (let i = tetelek.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tetelek[i], tetelek[j]] = [tetelek[j], tetelek[i]];
  }
  /* a napi ismétlés adagokban megy — egy kör legfeljebb ISMETLES_ADAG kártya */
  const adagos = !leckeId && tetelek.length > ISMETLES_ADAG;
  gyakorlasSor = { tetelek: adagos ? tetelek.slice(0, ISMETLES_ADAG) : tetelek,
                   mutato: 0, valaszLatszik: false, jo: 0, rossz: 0,
                   forditva: !!(mod && mod.forditva), irasMind: !!(mod && mod.iras),
                   cim: mod && mod.cim, napiIsmetles: !leckeId };
  rajzolFo();
}

/* milyen kép: rajz (átlátszó), kollázslap, vagy fotó */
function kepFajta(ut, kiserE){
  const u = (ut || "").toLowerCase();
  if (u.indexOf("poszt-") >= 0) return "kollazs";
  if (u.indexOf("csakra-") >= 0 || u.indexOf("yama-") >= 0 || u.indexOf("niyama-") >= 0 || u.indexOf("szoveg-") >= 0) return "tabla";   /* álló műlap: keret nélkül */
  if (u.endsWith(".svg") || u.endsWith(".png")) return "szabad";
  return kiserE ? "kiser" : "";          /* fotó: a régi méretek maradnak */
}

/* ===== TÜKÖRKÉPEK — kifejtős önreflexió, a válaszok dátummal megmaradnak ===== */
function inditTukor(lecke, szakasz){
  const tetelek = lecke.kerdesek.filter(k => k.tukor && k.csoport === szakasz)
                                .map(k => ({ lecke: lecke, kerdes: k }));
  if (!tetelek.length) return;
  gyakorlasSor = { tetelek, mutato: 0, valaszLatszik: false, jo: 0, rossz: 0,
                   tukor: true, cim: "Tükörképek · " + szakasz, mentett: 0 };
  rajzolFo();
}

function tukorDatum(iso){
  const d = new Date(iso);
  return d.getFullYear() + ". " + MR_HONAP[d.getMonth()] + " " + d.getDate() + ".";
}

function rajzolTukor(gy, kartya, sav){
  const osszes = gy.tetelek.length;
  if (gy.mutato >= osszes){
    kartya.appendChild(szoveges("gy-kerdes", gy.mentett ? "Elmentve ✦" : "Végigértél"));
    kartya.appendChild(szoveges("gy-sugo", gy.mentett
      ? gy.mentett + " válasz került a tükörképeid közé — bármikor visszanézheted, ha újra megnyitod."
      : "Most nem írtál semmit — a korábbi válaszaid megvannak."));
    const sor = document.createElement("div"); sor.className = "gy-gombsor";
    sor.appendChild(gomb("gy-gomb fo", "Vissza a leckéhez", () => { gyakorlasSor = null; rajzol(); }));
    sav.appendChild(sor);
    return;
  }
  const t = gy.tetelek[gy.mutato], k = t.kerdes;
  kartya.appendChild(szoveges("gy-sugo", gy.cim));
  kartya.appendChild(szoveges("gy-kerdes kicsi", k.kerdes));

  const mezo = document.createElement("textarea");
  mezo.className = "gy-iras tukor-iras";
  mezo.placeholder = "Írd le, ami eszedbe jut — nincs jó vagy rossz válasz…";
  mezo.value = k.sajatValasz || "";                      /* félbehagyott piszkozat */
  mezo.oninput = () => { k.sajatValasz = mezo.value; ment(); };
  kartya.appendChild(mezo);
  setTimeout(() => mezo.focus(), 0);

  const regiek = (k.valaszok || []).slice().reverse();
  if (regiek.length){
    const doboz = document.createElement("div");
    doboz.className = "tukor-regiek";
    doboz.appendChild(szoveges("tukor-regiek-cim", "Korábbi válaszaid · " + regiek.length));
    for (const v of regiek){
      const e = document.createElement("div"); e.className = "tukor-regi";
      e.appendChild(szoveges("tukor-datum", tukorDatum(v.datum)));
      e.appendChild(szoveges("tukor-szoveg", v.szoveg));
      doboz.appendChild(e);
    }
    kartya.appendChild(doboz);
  }

  const sor = document.createElement("div"); sor.className = "gy-gombsor";
  if (gy.mutato > 0) sor.appendChild(gomb("gy-gomb halk", "‹ Előző", () => { gy.mutato--; rajzolGyakorlas(); }));
  sor.appendChild(gomb("gy-gomb halk", "Kihagyom", () => { gy.mutato++; rajzolGyakorlas(); }));
  sor.appendChild(gomb("gy-gomb fo", "Mentés és tovább", () => {
    const szoveg = (k.sajatValasz || "").trim();
    if (szoveg){
      k.valaszok = (k.valaszok || []).concat({ datum: most(), szoveg: szoveg });
      k.sajatValasz = "";
      gy.mentett++;
      t.lecke.modositva = most();
      mentAzonnal();
    }
    gy.mutato++; rajzolGyakorlas();
  }));
  sav.appendChild(sor);
  sav.appendChild(szoveges("gy-sugo", "a válaszod dátummal elmentődik — nem kerül a napi ismétlésbe"));
}

function rajzolGyakorlas(){
  const gy = gyakorlasSor;
  const doboz = $("gyKartya");
  doboz.innerHTML = "";
  const sav = $("gySav");
  sav.innerHTML = "";
  const kartya = document.createElement("div");
  kartya.className = "gy-belso" + (gy.valaszLatszik ? " valasz-latszik" : "");
  doboz.appendChild(kartya);

  const osszes = gy.tetelek.length;
  const kesz = Math.min(gy.mutato, osszes);
  $("gyHalado").style.width = osszes ? Math.round(kesz / osszes * 100) + "%" : "0%";
  $("gySzamlalo").textContent = osszes ? (Math.min(gy.mutato + 1, osszes) + " / " + osszes) : "";

  if (gy.tukor){ rajzolTukor(gy, kartya, sav); return; }

  /* nincs mit gyakorolni */
  if (!osszes){
    kartya.appendChild(szoveges("gy-kerdes", "Most nincs esedékes kérdés."));
    kartya.appendChild(szoveges("gy-sugo", "Jó munka. Nézz vissza később, vagy nyiss meg egy leckét és gyakorold végig."));
    sav.appendChild(gomb("gy-gomb halk", "Vissza", () => { gyakorlasSor = null; rajzolFo(); }));
    $("gySzamlalo").textContent = "";
    return;
  }

  /* végigértünk */
  if (gy.mutato >= osszes){
    rajzolJutalmat(kartya, gy);
    const sor = document.createElement("div");
    sor.className = "gy-gombsor";
    /* napi ismétlés: ha maradt még, jöhet a következő adag — de nem kötelező */
    const maradt = gy.napiIsmetles ? osszesEsedekes() : 0;
    if (maradt > 0){
      sor.appendChild(gomb("gy-gomb fo", "Még egy adag · " + Math.min(maradt, ISMETLES_ADAG), () => inditGyakorlas(null)));
      sor.appendChild(gomb("gy-gomb halk", "Elég mára", () => { gyakorlasSor = null; rajzol(); }));
    } else {
      sor.appendChild(gomb("gy-gomb fo", gy.napiIsmetles ? "Kész" : "Vissza a leckéhez", () => { gyakorlasSor = null; rajzol(); }));
    }
    if (gy.rossz) sor.appendChild(gomb("gy-gomb halk", "Amit elrontottam, újra", () => {
      const ujra = gy.tetelek.filter(t => esedekesE(t.kerdes));
      if (!ujra.length){ gyakorlasSor = null; rajzol(); return; }
      gyakorlasSor = { tetelek: ujra, mutato: 0, valaszLatszik: false, jo: 0, rossz: 0,
                       napiIsmetles: gy.napiIsmetles };
      rajzolGyakorlas();
    }));
    sav.appendChild(sor);
    $("gySzamlalo").textContent = osszes + " / " + osszes;
    return;
  }

  const tetel = gy.tetelek[gy.mutato];

  if (tetel.kerdes.valasztos){
    rajzolValasztos(gy, tetel, kartya, sav);
    return;
  }

  if (tetel.kerdes.reszek && tetel.kerdes.reszek.length){
    rajzolReszesKartya(gy, tetel, kartya, sav);
    return;
  }

  const honnan = szoveges("gy-sugo", tetel.lecke.cim);
  kartya.appendChild(honnan);

  /* megfordított irányban a válasz kerül előre */
  const elolSzoveg = gy.forditva ? (tetel.kerdes.valasz || "") : (tetel.kerdes.kerdes || "");
  const hatulSzoveg = gy.forditva ? (tetel.kerdes.kerdes || "") : (tetel.kerdes.valasz || "");
  const vanSzoveg = !!elolSzoveg.trim();
  if (vanSzoveg && gy.valaszLatszik && tetel.kerdes.kep){
    /* felfedés után: a szó és a kép fejsorrá zsugorodik, a VÁLASZ kerül középre */
    const fejsor = document.createElement("div");
    fejsor.className = "gy-fejsor";
    const kep = document.createElement("img");
    kep.className = "gy-belyegkep"; kep.src = tetel.kerdes.kep; kep.alt = "";
    fejsor.appendChild(kep);
    const szo = document.createElement("div");
    szo.className = "gy-szo"; szo.textContent = elolSzoveg;
    fejsor.appendChild(szo);
    kartya.appendChild(fejsor);
  } else if (vanSzoveg && tetel.kerdes.kepFent && tetel.kerdes.kep){
    /* a kép a fő — a kérdés szövege alatta olvasható, mint egy munkafüzetlapon */
    const kep = document.createElement("img");
    kep.className = "gy-kep " + kepFajta(tetel.kerdes.kep, false); kep.src = tetel.kerdes.kep; kep.alt = "";
    kartya.appendChild(kep);
    kartya.appendChild(szoveges("gy-kerdes", elolSzoveg));
  } else if (vanSzoveg){
    /* a FOGALOM a fő — a kép csak kíséri, kisebben */
    kartya.appendChild(szoveges("gy-kerdes", elolSzoveg));
    if (tetel.kerdes.kep){
      const kep = document.createElement("img");
      kep.className = "gy-kep " + kepFajta(tetel.kerdes.kep, true); kep.src = tetel.kerdes.kep; kep.alt = "";
      kartya.appendChild(kep);
    }
  } else if (tetel.kerdes.kep){
    /* nincs szöveg (ászana-kártyák): ilyenkor a kép MAGA a kérdés */
    const kep = document.createElement("img");
    kep.className = "gy-kep " + kepFajta(tetel.kerdes.kep, false); kep.src = tetel.kerdes.kep; kep.alt = "";
    kartya.appendChild(kep);
  } else {
    kartya.appendChild(szoveges("gy-kerdes", "(üres kérdés)"));
  }

  const irasosE = !!tetel.kerdes.iras || !!gy.irasMind;

  if (irasosE){
    const mezo = document.createElement("textarea");
    mezo.className = "gy-iras" + (gy.irasMind ? " rovid" : "");
    mezo.placeholder = gy.irasMind ? "Írd be angolul…" : "Írd le a válaszod…";
    mezo.value = gy.irasMind ? (gy.piszkozat || "") : (tetel.kerdes.sajatValasz || "");
    mezo.oninput = () => {
      if (gy.irasMind){ gy.piszkozat = mezo.value; return; }   /* drill: nem mentjük */
      tetel.kerdes.sajatValasz = mezo.value; ment();
    };
    kartya.appendChild(mezo);
    if (gy.irasMind) mezo.onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        gy.itelet = valaszHelyesE(gy.piszkozat, hatulSzoveg);
        gy.valaszLatszik = true; rajzolGyakorlas();
      }
    };
    setTimeout(() => mezo.focus(), 0);
  }

  if (!gy.valaszLatszik){
    const sor = document.createElement("div");
    sor.className = "gy-gombsor";
    sor.appendChild(gomb("gy-gomb fo", irasosE ? "Kész — mutasd" : "Mutasd a választ", () => {
      if (gy.irasMind) gy.itelet = valaszHelyesE(gy.piszkozat, hatulSzoveg);
      gy.valaszLatszik = true; rajzolGyakorlas();
    }));
    sav.appendChild(sor);
    sav.appendChild(szoveges("gy-sugo", gy.irasMind
      ? "Írd be, aztán Enter — vagy kattints"
      : (irasosE ? "Írd le, aztán nézd meg — a könyvet is előveheted hozzá"
                 : "Válaszolj hangosan · szóköz = felfedés")));
  } else {
    const v = hatulSzoveg || "(ehhez nincs válasz beírva)";
    const doboz = document.createElement("div");
    doboz.className = "gy-valasz";
    const sorok = document.createElement("div");
    sorok.className = "valasz-sorok";
    let vastag = 0;
    v.split("\n").forEach(sor => {
      const t = sor.trim();
      if (!t) return;
      const e = document.createElement("div");
      if (/^\[.*\]$/.test(t)){                    /* kiejtés */
        e.className = "kiejt"; e.textContent = t.replace(/^\[|\]$/g, "");
      } else if (t.charAt(0) === "\u26A0"){         /* eltérés a kurzus anyagától */
        e.className = "megjegyzes"; e.textContent = t;
      } else if (/^\(.*\)$/.test(t)){             /* zárójeles magyar név */
        e.className = "halk"; e.textContent = t;
      } else {                                     /* angol és szanszkrit — ezek a vastagok */
        e.className = vastag === 0 ? "fo" : (vastag === 1 ? "fo2" : "mellek");
        e.textContent = t; vastag++;
      }
      sorok.appendChild(e);
    });
    doboz.appendChild(sorok);
    kartya.appendChild(doboz);
    rajzolCsaladot(kartya, tetel);
    const sor = document.createElement("div");
    sor.className = "gy-gombsor";

    if (gy.irasMind){
      /* a beírt válaszból magától kiderül, ment-e */
      const helyes = !!gy.itelet;
      const itelet = document.createElement("div");
      itelet.className = "gy-itelet " + (helyes ? "jo" : "nem");
      itelet.innerHTML = helyes
        ? "✓ Eltaláltad"
        : "✗ Amit írtál: <b></b>";
      if (!helyes) itelet.querySelector("b").textContent = (gy.piszkozat || "").trim() || "—";
      kartya.insertBefore(itelet, doboz);
      sor.appendChild(gomb("gy-gomb fo", "Tovább", () => lepGyakorlas(helyes)));
      if (!helyes) sor.appendChild(gomb("gy-gomb halk", "Mégis tudtam", () => lepGyakorlas(true)));
      sav.appendChild(sor);
      sav.appendChild(szoveges("gy-sugo", "Enter vagy szóköz — tovább"));
    } else {
      sor.appendChild(gomb("gy-gomb nem", "Nem ment", () => lepGyakorlas(false)));
      sor.appendChild(gomb("gy-gomb jo",  "Ment",     () => lepGyakorlas(true)));
      sav.appendChild(sor);
      sav.appendChild(szoveges("gy-sugo", "N — nem ment · M — ment"));
    }
  }
}

/* munkafüzet-kártya: egy póz (vagy fogalom) képpel, alatta több önálló, egyenként beírandó
   kérdés-válasz mező — mint egy kitöltős munkafüzetlap. A kártya egészére egyszerre dől el,
   hogy ment-e (nem alkérdésenként). */
/* feleletválasztós kártya (záróvizsga-gyakorló): angolul, mint a vizsgán, alatta magyarul */
function rajzolValasztos(gy, tetel, kartya, sav){
  const k = tetel.kerdes, v = k.valasztos;
  kartya.appendChild(szoveges("gy-sugo", k.csoport || tetel.lecke.cim));
  kartya.appendChild(szoveges("gy-kerdes kicsi", k.kerdes));
  if (v.kerdesHu) kartya.appendChild(szoveges("vl-hu", v.kerdesHu));

  /* a lehetőségek sorrendje körönként kevert, de egy kártyán belül állandó */
  if (!gy.vlSorrend || gy.vlSorrend.id !== k.id){
    const idx = v.lehetosegek.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    gy.vlSorrend = { id: k.id, idx: idx };
  }
  const lista = document.createElement("div");
  lista.className = "vl-lista";
  for (const i of gy.vlSorrend.idx){
    const b = document.createElement("button");
    let cls = "vl-gomb";
    if (gy.valaszLatszik){
      if (i === v.helyes) cls += " jo";
      else if (i === gy.vlValasztott) cls += " rossz";
      else cls += " halvany";
    }
    b.className = cls;
    const en = document.createElement("span"); en.className = "vl-en"; en.textContent = v.lehetosegek[i];
    b.appendChild(en);
    if (v.lehetosegekHu[i] && v.lehetosegekHu[i] !== v.lehetosegek[i]){
      const hu = document.createElement("span"); hu.className = "vl-hu-kis"; hu.textContent = v.lehetosegekHu[i];
      b.appendChild(hu);
    }
    if (!gy.valaszLatszik) b.onclick = () => { gy.vlValasztott = i; gy.valaszLatszik = true; rajzolGyakorlas(); };
    lista.appendChild(b);
  }
  kartya.appendChild(lista);

  if (gy.valaszLatszik){
    const helyes = gy.vlValasztott === v.helyes;
    kartya.appendChild(szoveges("vl-itelet " + (helyes ? "jo" : "nem"), helyes ? "✓ Eltaláltad" : "✗ Nem ez — a jó válasz zölddel"));
    if (v.magyarazat) kartya.appendChild(szoveges("vl-magyarazat", v.magyarazat));
    const sor = document.createElement("div"); sor.className = "gy-gombsor";
    sor.appendChild(gomb("gy-gomb fo", "Tovább", () => { gy.vlSorrend = null; lepGyakorlas(helyes); }));
    sav.appendChild(sor);
    sav.appendChild(szoveges("gy-sugo", "Enter vagy szóköz — tovább"));
  } else {
    sav.appendChild(szoveges("gy-sugo", "kattints a válaszra — vagy nyomd meg a számát (1–" + v.lehetosegek.length + ")"));
  }
}

function rajzolReszesKartya(gy, tetel, kartya, sav){
  const k = tetel.kerdes;
  kartya.appendChild(szoveges("gy-sugo", tetel.lecke.cim));
  if (k.kep){
    const kep = document.createElement("img");
    kep.className = "gy-kep " + kepFajta(k.kep, false); kep.src = k.kep; kep.alt = "";
    kartya.appendChild(kep);
  }
  if (k.kerdes) kartya.appendChild(szoveges("gy-kerdes kicsi", k.kerdes));

  const lista = document.createElement("div");
  lista.className = "gy-reszek";
  k.reszek.forEach((r, i) => {
    const doboz = document.createElement("div");
    doboz.className = "gy-resz";
    if (r.cim) doboz.appendChild(szoveges("gy-resz-cim", r.cim));
    if (r.kerdes) doboz.appendChild(szoveges("gy-resz-kerdes", r.kerdes));
    const mezo = document.createElement("textarea");
    mezo.className = "gy-iras gy-resz-iras";
    mezo.placeholder = "Írd le a válaszod…";
    mezo.value = r.sajatValasz || "";
    mezo.oninput = () => { r.sajatValasz = mezo.value; ment(); };
    doboz.appendChild(mezo);
    if (gy.valaszLatszik) doboz.appendChild(szoveges("gy-resz-valasz", r.valasz || "(nincs megadva)"));
    lista.appendChild(doboz);
    if (i === 0) setTimeout(() => mezo.focus(), 0);
  });
  kartya.appendChild(lista);

  /* a póz gyakorlási naplója itt, a kártyán is */
  const naplo = document.createElement("div");
  naplo.className = "gyak-naplo gy-naplo";
  naplo.dataset.naplo = k.kerdes;
  kartya.appendChild(naplo);
  rajzolGyakNaplo(tetel.lecke, naplo);

  const sor = document.createElement("div");
  sor.className = "gy-gombsor";
  if (!gy.valaszLatszik){
    sor.appendChild(gomb("gy-gomb fo", "Kész — mutasd", () => { gy.valaszLatszik = true; rajzolGyakorlas(); }));
    sav.appendChild(sor);
    sav.appendChild(szoveges("gy-sugo", "töltsd ki mind, aztán nézd meg — a könyvet is előveheted hozzá"));
  } else {
    sor.appendChild(gomb("gy-gomb nem", "Nem ment", () => lepGyakorlas(false)));
    sor.appendChild(gomb("gy-gomb jo",  "Ment",     () => lepGyakorlas(true)));
    sav.appendChild(sor);
    sav.appendChild(szoveges("gy-sugo", "N — nem ment · M — ment"));
  }
}

function lepGyakorlas(ment_e){
  const gy = gyakorlasSor;
  gy.piszkozat = ""; gy.itelet = null;
  const tetel = gy.tetelek[gy.mutato];
  valaszol(tetel.kerdes, ment_e);
  if (ment_e) gy.jo++; else gy.rossz++;
  gy.mutato++;
  gy.valaszLatszik = false;
  rajzolGyakorlas();
  rajzolLista();
}

function szoveges(osztaly, szoveg){
  const e = document.createElement("div");
  e.className = osztaly;
  e.style.whiteSpace = "pre-line";
  e.textContent = szoveg;
  return e;
}
function gomb(osztaly, felirat, mit){
  const g = document.createElement("button");
  g.className = osztaly; g.textContent = felirat; g.onclick = mit;
  return g;
}


/* ===== SZERKESZTŐ PARANCSOK ===== */
function cellaKeres(){
  const kij = window.getSelection();
  if (!kij.rangeCount) return null;
  let e = kij.getRangeAt(0).startContainer;
  while (e && e !== $("tartalom")){
    if (e.nodeType === 1 && (e.tagName === "TD" || e.tagName === "TH")) return e;
    e = e.parentNode;
  }
  return null;
}

function beszurTabla(){
  const html =
    '<table><thead><tr><th>Fogalom</th><th>Jelentés</th></tr></thead>' +
    '<tbody><tr><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td></tr></tbody></table><p><br></p>';
  document.execCommand("insertHTML", false, html);
  tartalomValtozott();
}

function ujSor(){
  const cella = cellaKeres();
  if (!cella){ return; }
  const sor = cella.parentNode;
  const uj = sor.cloneNode(true);
  for (const c of uj.children){ c.innerHTML = "<br>"; if (c.tagName === "TH"){ } }
  /* fejlécből másolt sor mindig sima cella legyen */
  if (sor.parentNode.tagName === "THEAD"){
    const test = sor.closest("table").querySelector("tbody") || sor.closest("table");
    const sima = document.createElement("tr");
    for (let i = 0; i < sor.children.length; i++){
      const td = document.createElement("td"); td.innerHTML = "<br>"; sima.appendChild(td);
    }
    test.insertBefore(sima, test.firstChild);
  } else {
    sor.parentNode.insertBefore(uj, sor.nextSibling);
  }
  tartalomValtozott();
}

function ujOszlop(){
  const cella = cellaKeres();
  if (!cella) return;
  const tabla = cella.closest("table");
  const hely = Array.prototype.indexOf.call(cella.parentNode.children, cella);
  for (const sor of tabla.querySelectorAll("tr")){
    const minta = sor.children[hely];
    const uj = document.createElement(minta && minta.tagName === "TH" ? "th" : "td");
    uj.innerHTML = "<br>";
    sor.insertBefore(uj, sor.children[hely + 1] || null);
  }
  tartalomValtozott();
}

function tartalomValtozott(){
  const l = aktualis(); if (!l) return;
  l.html = tisztaHtml();
  l.modositva = most();
  ment();
}

/* a helyőrzőkbe berajzolt teendők nem részei a szövegnek — mentés előtt kiürítjük őket */
function tisztaHtml(){
  const masolat = $("tartalom").cloneNode(true);
  for (const h of masolat.querySelectorAll("[data-gyakorlat]")) h.innerHTML = "";
  for (const h of masolat.querySelectorAll(".idozona")) h.innerHTML = "";
  for (const h of masolat.querySelectorAll(".orarend-allapot")) h.innerHTML = "";
  for (const h of masolat.querySelectorAll("[data-naplo]")) h.innerHTML = "";
  return masolat.innerHTML;
}

/* ===== KÖTÉSEK ===== */
function kotesek(){
  $("oldalsavGomb").onclick = oldalsavValt;
  $("visszaNyil").onclick = visszaLepek;
  $("keresoMezo").onfocus = () => keresoNyit($("keresoMezo").value);
  $("keresoNagy").oninput = keresoFut;
  $("keresoValaszban").onchange = keresoFut;
  $("keresoZar").onclick = keresoZar;
  $("keresoReteg").onclick = e => {
    /* a homályos háttérre vagy az eredménylista üres részére kattintva kilépünk */
    if (e.target.id === "keresoReteg" || e.target.id === "keresoTalalatok") keresoZar();
  };
  $("nagyitoZar").onclick = nagyitoZar;
  $("nagyitoBal").onclick = () => nagyitoLep(-1);
  $("nagyitoJobb").onclick = () => nagyitoLep(1);
  $("nagyito").onclick = e => { if (e.target.id === "nagyito") nagyitoZar(); };
  $("fulVazlat").onclick   = () => { aktivFul = "vazlat";   rajzolFo(); };
  $("fulKerdesek").onclick = () => { aktivFul = "kerdesek"; rajzolFo(); };

  $("gyKilep").onclick = () => { gyakorlasSor = null; rajzol(); };

  $("leckeCim").oninput = () => {
    const l = aktualis(); if (!l) return;
    l.cim = $("leckeCim").value; l.modositva = most();
    ment(); rajzolLista();
  };

  const mezo = $("tartalom");
  mezo.addEventListener("input", tartalomValtozott);
  /* szerkesztéskor csak szöveg törölhető — a képek, pózlapok, táblázatok, gombok, napló
     egészben maradnak. Ha egy törlés/beírás ilyen blokkba nyúlna bele, nem engedjük. */
  mezo.addEventListener("beforeinput", e => {
    const tipus = e.inputType || "";
    let tartomanyok = e.getTargetRanges ? e.getTargetRanges() : [];
    if (!tartomanyok.length){
      const sel = window.getSelection();
      tartomanyok = sel && sel.rangeCount ? [sel.getRangeAt(0)] : [];
    }
    for (const t of tartomanyok){
      if (t.collapsed && !tipus.startsWith("delete")) continue;
      const r = document.createRange();
      try { r.setStart(t.startContainer, t.startOffset); r.setEnd(t.endContainer, t.endOffset); } catch(_){ continue; }
      for (const el of mezo.querySelectorAll(VEDETT_TORLES)){
        if (!r.intersectsNode(el)) continue;
        /* ha a módosítás teljes egészében a blokk belsejében van (pl. szöveg a pózlapon), mehet */
        if (el.contains(r.startContainer) && el.contains(r.endContainer) && !el.matches(VEDETT_EGESZ)) continue;
        e.preventDefault(); return;
      }
    }
  });
  mezo.addEventListener("focus", () => $("lap").classList.add("iras-kozben"));
  mezo.addEventListener("blur",  () => $("lap").classList.remove("iras-kozben"));
  mezo.addEventListener("paste", e => {
    e.preventDefault();
    const szoveg = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, szoveg);
  });


  document.addEventListener("keydown", e => {
    const parancs = e.metaKey || e.ctrlKey;
    if (parancs && e.key.toLowerCase() === "s"){ e.preventDefault(); mentAzonnal(); }
    if (parancs && e.key === "\\"){ e.preventDefault(); oldalsavValt(); }
    if (parancs && e.key.toLowerCase() === "f"){ e.preventDefault(); keresoNyit(); return; }
    if (keresoNyitvaE()){
      if (e.key === "Escape"){ e.preventDefault(); keresoZar(); return; }
      if (e.key === "ArrowDown"){ e.preventDefault(); talalatKijelol(talalatHol + 1); return; }
      if (e.key === "ArrowUp"){ e.preventDefault(); talalatKijelol(talalatHol - 1); return; }
      if (e.key === "Enter" && talalatLista[talalatHol]){
        e.preventDefault(); talalatraUgrik(talalatLista[talalatHol].adat); return;
      }
      return;
    }
    if (nagyitoNyitvaE()){
      if (e.key === "Escape"){ e.preventDefault(); nagyitoZar(); return; }
      if (e.key === "ArrowLeft"){ e.preventDefault(); nagyitoLep(-1); return; }
      if (e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); nagyitoLep(1); return; }
    }
    if (e.key === "Escape" && !$("sugoFatyol").classList.contains("rejtve")){ sugoZar(); return; }
    if (e.key === "Escape" && gyakorlatokNyitva){ e.preventDefault(); gyakorlatokListaZar(); return; }
    if (parancs && e.key === "/"){ e.preventDefault(); sugoNyit(); }
    /* gyakorlás billentyűvel: szóköz felfed, 1 = nem ment, 2 = ment */
    const vlT = gyakorlasSor && !parancs && gyakorlasSor.tetelek[gyakorlasSor.mutato];
    if (vlT && vlT.kerdes.valasztos){
      const v = vlT.kerdes.valasztos;
      if (!gyakorlasSor.valaszLatszik && /^[1-9]$/.test(e.key) && +e.key <= v.lehetosegek.length){
        e.preventDefault();
        gyakorlasSor.vlValasztott = gyakorlasSor.vlSorrend.idx[+e.key - 1];
        gyakorlasSor.valaszLatszik = true; rajzolGyakorlas(); return;
      }
      if (gyakorlasSor.valaszLatszik && (e.key === " " || e.key === "Enter")){
        e.preventDefault(); const h = gyakorlasSor.vlValasztott === v.helyes;
        gyakorlasSor.vlSorrend = null; lepGyakorlas(h); return;
      }
      if (e.key === "Escape"){ gyakorlasSor = null; rajzol(); }
      return;
    }
    if (gyakorlasSor && gyakorlasSor.tukor && !parancs){
      if (e.key === "Escape"){ gyakorlasSor = null; rajzol(); }
    } else if (gyakorlasSor && !parancs){
      const cel = e.target;
      if (cel && (cel.isContentEditable || cel.tagName === "INPUT" || cel.tagName === "TEXTAREA")) return;
      if (e.key === " "){ e.preventDefault();
        if (!gyakorlasSor.valaszLatszik && gyakorlasSor.mutato < gyakorlasSor.tetelek.length){
          gyakorlasSor.valaszLatszik = true; rajzolGyakorlas();
        }
      }
      if (gyakorlasSor.valaszLatszik && gyakorlasSor.irasMind &&
          (e.key === " " || e.key === "Enter")){
        e.preventDefault(); lepGyakorlas(!!gyakorlasSor.itelet); return;
      }
      const b = e.key.toLowerCase();
      if (gyakorlasSor.valaszLatszik && (b === "n" || b === "m" || e.key === "1" || e.key === "2")){
        e.preventDefault(); lepGyakorlas(b === "m" || e.key === "2");
      }
      if (e.key === "Escape"){ gyakorlasSor = null; rajzol(); }
    }
  });


  window.addEventListener("blur", () => { if (mentesIdozito) window.naploAzonnaliMentes(); });

  linkKotesek();
  tippKotesek();
  oraKotesek();
  sugoKotesek();
}

function indulasUtan(){
  oraFigyeles();
  napotJelol();
  mrStopperHelyreallit();
  $("lap").classList.toggle("osszecsukott", !oldalsavNyitva);
  if (!kivalasztottId){
    const elso = leckek.slice().sort((a,b) => (b.modositva||"").localeCompare(a.modositva||""))[0];
    kivalasztottId = elso ? elso.id : null;
  }
  rajzol();
  window.naploKesz = true;
}

kotesek();

if (hid){
  hid.postMessage({ tipus:"betoltes" });
} else {
  let mentett = null;
  try { mentett = localStorage.getItem(TAROLO_KULCS); } catch(e){}
  const t = ertelmez(mentett);
  mappak = t.mappak; leckek = t.leckek;
  oldalsavNyitva = t.oldalsavNyitva; nyitottMappak = t.nyitottMappak;
  indulasUtan();
}

<script>
/* ===== FELHŐ: közös napló a Mac és a telefon között (Supabase) =====
   A helyi mentés (Macen a naplo.json, telefonon a localStorage) megmarad —
   a felhő csak összefésüli a kettőt: leckénként a később módosított változat nyer. */
(function(){

/* ----- összefésülés ----- */
function ido(s){ const t = Date.parse(s || ""); return isNaN(t) ? 0 : t; }
function tartalom(d){
  return JSON.stringify([d.mappak || [], d.leckek || [], (d.beallitasok && d.beallitasok.haladas) || {}]);
}
function osszefesul(helyi, tavoli, helyiAzUjabb){
  if (!tavoli || !Array.isArray(tavoli.leckek)) return helyi;

  /* leckék: leckénként a később módosított; ami csak az egyik oldalon van, megmarad */
  const tavLeckek = new Map(tavoli.leckek.map(l => [l.id, l]));
  const leckek = [];
  const latott = new Set();
  for (const l of helyi.leckek || []){
    const t = tavLeckek.get(l.id);
    leckek.push(t && ido(t.modositva) > ido(l.modositva) ? t : l);
    latott.add(l.id);
  }
  for (const t of tavoli.leckek) if (!latott.has(t.id)) leckek.push(t);

  /* mappák: azonos mappánál az újabb oldalé, az új mappák mindkét oldalról jönnek */
  const [elso, masik] = helyiAzUjabb ? [helyi, tavoli] : [tavoli, helyi];
  const mappak = (elso.mappak || []).slice();
  const mappaIdk = new Set(mappak.map(m => m.id));
  for (const m of masik.mappak || []) if (!mappaIdk.has(m.id)) mappak.push(m);

  /* haladás: napi számlálóknál a nagyobb érték, a többinél az újabb oldalé */
  const hE = (elso.beallitasok && elso.beallitasok.haladas) || {};
  const hM = (masik.beallitasok && masik.beallitasok.haladas) || {};
  const haladas = Object.assign({}, hM, hE);
  for (const k of Object.keys(hE)){
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && hM[k] && typeof hE[k] === "object" && typeof hM[k] === "object"){
      const nap = Object.assign({}, hM[k], hE[k]);
      for (const m of Object.keys(nap)){
        if (typeof hE[k][m] === "number" && typeof hM[k][m] === "number") nap[m] = Math.max(hE[k][m], hM[k][m]);
      }
      haladas[k] = nap;
    }
  }

  return Object.assign({}, helyi, {
    beallitasok:Object.assign({}, helyi.beallitasok, { haladas:haladas }),
    mappak:mappak,
    leckek:leckek
  });
}

/* ----- szinkron ----- */
let fut = false, ujra = false, szinkronBetolt = false, idozito = null;

async function szinkron(){
  if (!window.naploKesz) return;          /* Macen előbb a helyi fájlnak kell betöltődnie */
  if (fut){ ujra = true; return; }
  fut = true;
  try {
    const t = await hozzaferes();
    if (!t) return;
    allapot("dolgozik");
    const helyi = JSON.parse(window.naploAzonnaliMentes());

    const v = await fetch(FELHO_URL + "/rest/v1/naplo?select=adat,frissitve", { headers:fejlec(t) });
    if (!v.ok) throw new Error("letöltés " + v.status);
    const sor = (await v.json())[0] || null;
    const tavoli = sor ? sor.adat : null;
    const helyiAzUjabb = !sor || (mm.helyiValtozas || 0) > ido(sor.frissitve);
    const ossz = osszefesul(helyi, tavoli, helyiAzUjabb);
    const osszT = tartalom(ossz);

    if (osszT !== tartalom(helyi)){
      /* gépelés vagy gyakorlás közben nem rántjuk ki a lapot alólad — kicsit később újra */
      if (window.naploFrissithetoE && !window.naploFrissithetoE()){ setTimeout(szinkron, 6000); return; }
      szinkronBetolt = true;
      try { window.naploBetoltes(JSON.stringify(ossz)); window.naploAzonnaliMentes(); }
      finally { szinkronBetolt = false; }
    }

    if (!tavoli || osszT !== tartalom(tavoli)){
      const f = await fetch(FELHO_URL + "/rest/v1/naplo?on_conflict=user_id", {
        method:"POST",
        headers:fejlec(t, { "Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=minimal" }),
        body:JSON.stringify({ user_id:mm.uid, adat:ossz, frissitve:new Date().toISOString() })
      });
      if (!f.ok) throw new Error("feltöltés " + f.status);
    }
    allapot("kesz");
  } catch(e){
    console.log("[felho] " + e.message);
    allapot("hiba");
  } finally {
    fut = false;
    if (ujra){ ujra = false; setTimeout(szinkron, 400); }
  }
}

/* ----- képek a weben: a privát tárhelyről, bejelentkezve töltjük le ----- */
/* a fájlnév biztonságos kulcsa (ékezet, szóköz nélkül) — a Swift oldalon ugyanez */
function kepKulcs(nev){
  let k = "";
  for (const b of new TextEncoder().encode(nev)){
    const c = String.fromCharCode(b);
    k += /[A-Za-z0-9.\-]/.test(c) ? c : "_" + b.toString(16).padStart(2, "0");
  }
  return k;
}
const kepek = new Map();
function kepUrl(ut){
  if (kepek.has(ut)) return kepek.get(ut);
  const p = (async () => {
    let nev = ut.slice(6);
    try { nev = decodeURIComponent(nev); } catch(e){}
    const cim = FELHO_URL + "/storage/v1/object/authenticated/kepek/" + (mm && mm.uid) + "/" + kepKulcs(nev);
    let tar = null;
    try { tar = await caches.open("rozsanaplo-kepek"); } catch(e){}
    let valasz = tar ? await tar.match(cim) : null;
    if (!valasz){
      const t = await hozzaferes();
      if (!t) throw new Error("nincs belépés");
      valasz = await fetch(cim, { headers:fejlec(t) });
      if (!valasz.ok) throw new Error("kép " + valasz.status);
      if (tar) await tar.put(cim, valasz.clone());
    }
    return URL.createObjectURL(await valasz.blob());
  })();
  p.catch(() => kepek.delete(ut));
  kepek.set(ut, p);
  return p;
}
function kepetCserel(el){
  const attr = el.tagName.toLowerCase() === "img" ? "src" : "href";
  const v = el.getAttribute(attr);
  if (!v || !v.startsWith("kepek/")) return;
  el.setAttribute("data-kep", v);
  if (attr === "src") el.removeAttribute("src"); else el.setAttribute("href", "");
  kepUrl(v).then(u => { if (el.getAttribute("data-kep") === v) el.setAttribute(attr, u); }).catch(() => {});
}
function kepeketKeres(gyoker){
  if (gyoker.nodeType !== 1) return;
  if (gyoker.matches && gyoker.matches('img[src^="kepek/"], image[href^="kepek/"]')) kepetCserel(gyoker);
  gyoker.querySelectorAll && gyoker.querySelectorAll('img[src^="kepek/"], image[href^="kepek/"]').forEach(kepetCserel);
}

/* ----- indulás ----- */
function indul(){

    const el = document.createElement("div");

}
